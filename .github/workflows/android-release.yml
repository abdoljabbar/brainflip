name: Build Android Release (AAB)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & sync Capacitor (PROD)
        run: |
          npm ci
          npm run android:sync:prod

      - name: Decode Upload Keystore (if configured)
        id: keystore
        env:
          BF_KEYSTORE_BASE64: ${{ secrets.BF_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$BF_KEYSTORE_BASE64" ]; then
            echo "$BF_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Signed Release AAB & Debug APK
        env:
          BF_STORE_FILE: ${{ steps.keystore.outputs.signed == 'true' && 'upload-keystore.jks' || '' }}
          BF_STORE_PASSWORD: ${{ secrets.BF_STORE_PASSWORD }}
          BF_KEY_ALIAS: ${{ secrets.BF_KEY_ALIAS }}
          BF_KEY_PASSWORD: ${{ secrets.BF_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug

      - name: Upload Play Store AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: brainflip-playstore-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload Test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: brainflip-test-apk
          path: android/app/build/outputs/apk/debug/*.apk
