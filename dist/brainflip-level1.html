  }

  const L = {
    id: 1,
    promptHTML: 'Wake him <span class="pw" id="pw-up">up</span>!',
    endings: [
      { id: 'sunrise', name: 'Rise & Shine', line: 'Good morning, world!', rarity: 64, icon: 'sunrise' },
      { id: 'quake', name: 'Earthquake Alarm', line: 'WHOA! Was that an earthquake?!', rarity: 21, icon: 'quake' },
      { id: 'cold', name: 'Cold Feet', line: 'BRRR! Who stole my blanket?!', rarity: 12, icon: 'cold' },
    ],
    hints(found) {
      const sensors = I.hasMotion;
      if (!found.includes('sunrise')) return [{ text: 'Even Noodle gets up when the sun does…' }, { text: 'The sun is asleep too. Drag it UP!', demo: 'sun' }];
      if (!found.includes('quake')) return [{ text: 'Phones can shake, you know.' },
        { text: sensors ? 'Shake your phone! (Or wiggle the bed fast!)' : 'Shake your phone — or grab the bed and wiggle it fast!', demo: sensors ? 'shake' : 'bed' }];
      if (!found.includes('cold')) return [{ text: 'He looks a little TOO cozy…' }, { text: 'Steal his blanket!', demo: 'blanket' }];
      return [{ text: 'You found every ending. Galaxy brain!' }];
    },
    demo(kind) {
      if (kind === 'sun') return [{ x: 125, y: 196 }, { x: 125, y: 92 }];
      if (kind === 'shake') return { shake: true };
      if (kind === 'blanket') return [{ x: 300, y: 420 }, { x: 330, y: 530 }];
      if (kind === 'bed') return [{ x: 378, y: 446 }, { x: 352, y: 446 }, { x: 378, y: 446 }, { x: 352, y: 446 }, { x: 378, y: 446 }, { x: 352, y: 446 }];
      return null;
    },
    build,
  };

  function build(ctx) {
    ctx.root.innerHTML = sceneSVG();
    const svg = ctx.root.querySelector('svg');
    const $ = (id) => svg.querySelector('#l1-' + id);
    const shakeG = $('shake'), bedset = $('bedset');
    const nd = $('nd'), ndBody = $('nd-body'), ndFace = $('nd-face'), ndFaceIn = $('nd-face-in'), ndArms = $('nd-arms');
    const ndShake = $('nd-shake'), ndBoil = $('nd-boil'), bubble = $('bubble'), bubbleC = $('bubble-c'), bubbleH = $('bubble-h');
    const sun = $('sun'), sunIn = $('sun-in'), sunHit = $('sun-hit');
    const clockPos = $('clock'), clockRot = $('clock-rot'), clockIn = $('clock-in');
    const frame = $('frame'), frameRot = $('frame-rot');
    const blanket = $('blanket');
    const zLayer = $('zs'), fxLayer = $('fx'), talkLayer = $('talk');

    const st = {
      sleeping: true, done: false, p: 0,
      sun: { ...SUN0 }, sunMood: 'sleep', sunAnim: 0, dragSun: false,
      pose: { ...LIE }, face: 'sleep', bubblePopped: false,
      dragBlanket: false, bOff: { x: 0, y: 0 },
      busy: {}, frameTilt: 4, taps: {}, lastTouch: performance.now(),
    };
    const alive = () => ctx.alive;
    const asleep = () => ctx.alive && st.sleeping && !st.done;
    const count = (k) => (st.taps[k] = (st.taps[k] || 0) + 1);

    /* ---------- Noodle ---------- */
    function applyPose(breath) {
      const p = st.pose;
      nd.setAttribute('transform', `translate(${p.x.toFixed(1)},${p.y.toFixed(1)})`);
      ndBody.setAttribute('transform', `rotate(${p.rot.toFixed(1)}) scale(${(1 + (breath || 0)).toFixed(3)},1)`);
      const k = U.clamp(Math.abs(p.rot) / 78, 0, 1);
      const ay = -14 - 12 * k, r = (p.rot * Math.PI) / 180;
      ndFace.setAttribute('transform', `translate(${(-ay * Math.sin(r)).toFixed(1)},${(ay * Math.cos(r)).toFixed(1)}) rotate(${(p.rot * 0.18).toFixed(1)})`);
    }
    function setFace(eyes, mouth, tag) { ndFaceIn.innerHTML = ART.noodleFace({ eyes, mouth }); st.face = tag || eyes + mouth; }
    function setArms(type, color) { ndArms.innerHTML = ART.noodleArms(type, color || YELLOW); }
    function tweenPose(to, dur, ease) {
      const from = { ...st.pose };
      return U.tween(dur, (t) => { st.pose = { x: U.lerp(from.x, to.x, t), y: U.lerp(from.y, to.y, t), rot: U.lerp(from.rot, to.rot, t) }; applyPose(0); }, ease);
    }
    function setBubble(r) {
      const cx = 9 + r * 0.95, cy = 10 - r * 0.15; // hangs off the nose, beside the mouth — clear of the eyes
      bubbleC.setAttribute('cx', cx.toFixed(1)); bubbleC.setAttribute('cy', cy.toFixed(1)); bubbleC.setAttribute('r', r.toFixed(1));
      bubbleH.setAttribute('cx', (cx - r * 0.35).toFixed(1)); bubbleH.setAttribute('cy', (cy - r * 0.35).toFixed(1)); bubbleH.setAttribute('r', (r * 0.28).toFixed(1));
    }
    applyPose(0);

    /** Noodle's own speech bubble (SVG, above his head). */
    function talk(text, ms = 1800) {
      const ax = st.pose.x + (st.sleeping ? -20 : 8), ay = st.pose.y - (st.sleeping ? 46 : 66);
      ctx.talk(talkLayer, ax, ay, text, ms, 0.35);
    }

    /** Comic burst ("SMACK!", "OUCH!") */
    function burst(text, x, y, color = YELLOW) {
      const g = U.svgEl('g', { transform: `translate(${x},${y})` }, fxLayer);
      const inner = U.svgEl('g', { class: 'fb popin' }, g);
      let d = '';
      for (let i = 0; i < 18; i++) { const a = (i / 18) * Math.PI * 2, r = i % 2 ? 22 : 34; d += `${i ? 'L' : 'M'}${(Math.cos(a) * r * 1.5).toFixed(1)},${(Math.sin(a) * r).toFixed(1)} `; }
      U.svgEl('path', { d: d + 'Z', fill: color, stroke: INK, 'stroke-width': 3, 'stroke-linejoin': 'round' }, inner);
      const t = U.svgEl('text', { y: 6, 'text-anchor': 'middle', 'font-family': '"Lilita One", sans-serif', 'font-size': 17, fill: INK }, inner);
      t.textContent = text;
      setTimeout(() => g.remove(), 750);
    }

    /* ---------- idle life: breathing, snot bubble, Z's ---------- */
    const t0 = performance.now();
    (function loop(now) {
      if (!alive()) return;
      const t = (now - t0) / 1000;
      if (st.sleeping) {
        applyPose(0.022 * Math.sin(t * 2.6));
        if (!st.bubblePopped) setBubble(4 + 6.5 * (0.5 + 0.5 * Math.sin(t * 2.6 - 1)));
      }
      if (st.sleeping && !st.done && now - st.lastTouch > 7000) {
        st.lastTouch = now;
        ctx.say(U.pick(['Psst… everything here reacts. Poke around!', 'Stuck? The bulb up top can help.', 'Think outside the screen.']));
      }
      requestAnimationFrame(loop);
    })(t0);
    svg.addEventListener('pointerdown', () => { st.lastTouch = performance.now(); });

    let zi = 0;
    const zTimer = setInterval(() => {
      if (!st.sleeping || !alive() || document.hidden) return;
      zi++;
      if (zi % 2) A.play('snore');
      const size = [16, 22, 13][zi % 3];
      const z = U.svgEl('text', { x: 172, y: 352, 'font-family': '"Lilita One", sans-serif', 'font-size': size, fill: '#fff', stroke: INK, 'stroke-width': 2.4, 'paint-order': 'stroke' }, zLayer);
      z.textContent = 'Z';
      const sx = 172 + U.rand(-6, 6), sway = U.rand(10, 22) * (zi % 2 ? 1 : -1);
      U.tween(2300, (t) => {
        if (!alive()) return;
        z.setAttribute('x', (sx + Math.sin(t * 5) * 6 + sway * t).toFixed(1));
        z.setAttribute('y', (352 - 80 * t).toFixed(1));
        z.setAttribute('opacity', (t < 0.2 ? t * 5 : 1 - (t - 0.2) / 0.8).toFixed(2));
      }, U.ease.linear).then(() => z.remove());
    }, 1500);
    ctx.onCleanup(() => clearInterval(zTimer));

    /* ---------- MAIN ENDING: drag the sun up ---------- */
    function setSunMood(m) { if (st.sunMood === m) return; st.sunMood = m; sunIn.querySelector('[data-part="sunface"]').innerHTML = ART.sunFace(m); }
    function daylight(p) {
      $('sky').setAttribute('fill', U.lerpColor(NIGHT, DAY, p));
      $('stars').setAttribute('opacity', Math.max(0, 1 - p * 1.6).toFixed(2));
      $('moon').setAttribute('transform', `translate(${(168 + p * 30).toFixed(1)},${(80 + p * 132).toFixed(1)})`);
      $('night').setAttribute('opacity', (0.55 * (1 - p)).toFixed(3));
      $('beam').setAttribute('opacity', (p * 0.55).toFixed(3));
      if (!st.done) setSunMood(p > 0.45 ? 'open' : 'sleep');
      if (st.sleeping && !st.done) {
        if (p > 0.5 && st.face !== 'stir') setFace('squint', 'frown', 'stir');
        else if (p <= 0.5 && st.face === 'stir') setFace('closed', 'sleep', 'sleep');
      }
    }
    function placeSun() {
      sun.setAttribute('transform', `translate(${st.sun.x.toFixed(1)},${st.sun.y.toFixed(1)})`);
      sunHit.setAttribute('cx', st.sun.x.toFixed(1)); sunHit.setAttribute('cy', st.sun.y.toFixed(1));
      st.p = U.clamp((SUN0.y - st.sun.y) / (SUN0.y - SUN1.y), 0, 1);
      daylight(st.p);
    }
    let grab = { x: 0, y: 0 };
    I.drag(sunHit, svg, {
      onStart(pt) {
        if (ctx.locked || st.done) return;
        st.dragSun = true; st.sunAnim++;
        grab = { x: pt.x - st.sun.x, y: pt.y - st.sun.y };
        sunIn.classList.remove('peek');
        A.play('tap');
      },
      onMove(pt) {
        if (!st.dragSun) return;
        st.sun.x = U.clamp(pt.x - grab.x, 84, 166);
        st.sun.y = U.clamp(pt.y - grab.y, SUN1.y, SUN0.y + 6);
        placeSun();
        if (st.p >= 1) { st.dragSun = false; sunrise(); }
      },
      onEnd() {
        if (!st.dragSun) return;
        st.dragSun = false;
        if (st.p > 0.75) sunrise(); else sunSink();
      },
      onTap() { st.dragSun = false; if (!ctx.locked && !st.done) sunTap(); },
    });
    async function sunTap() {
      const n = count('sun'), id = ++st.sunAnim, y0 = SUN0.y;
      A.play('giggle');
      ctx.say(n === 1 ? 'Did the sun just… move?' : 'Hehe. That tickles.');
      await U.tween(180, (t) => { if (st.sunAnim !== id) return; st.sun.y = y0 - 18 * t; placeSun(); });
      await U.tween(450, (t) => { if (st.sunAnim !== id) return; st.sun.y = y0 - 18 + 18 * t; placeSun(); }, U.ease.outBounce);
      if (st.sunAnim === id && !st.done) sunIn.classList.add('peek');
    }
    async function sunSink() {
      const id = ++st.sunAnim, y0 = st.sun.y, x0 = st.sun.x;
      if (st.p > 0.15) ctx.say('It slid back down. Push it ALL the way up!');
      A.play('swish');
      await U.tween(850, (t) => { if (st.sunAnim !== id) return; st.sun.y = U.lerp(y0, SUN0.y, t); st.sun.x = U.lerp(x0, SUN0.x, t); placeSun(); }, U.ease.inOutCubic);
      if (st.sunAnim === id && !st.done) sunIn.classList.add('peek');
    }
    async function sunrise() {
      if (st.done || !alive()) return;
      st.done = true; ctx.locked = true; st.sunAnim++;
      const y0 = st.sun.y, x0 = st.sun.x;
      A.play('whoosh');
      await U.tween(450, (t) => { st.sun.y = U.lerp(y0, SUN1.y, t); st.sun.x = U.lerp(x0, SUN1.x, t); placeSun(); }, U.ease.outBack);
      setSunMood('happy');
      sunIn.querySelector('[data-part="rays"]').classList.add('spin');
      A.play('chirp');
      await U.wait(350);
      wake('sunrise');
    }

    /* ---------- SECRET ENDING: earthquake (shake the phone, or wiggle the bed) ---------- */
    function joltFeedback(n) {
      if (st.done || !alive()) return;
      U.replay(shakeG, 'jolt');
      A.play('wobble');
      if (n === 1 && st.sleeping) talk('Hm…?', 900);
    }
    ctx.onCleanup(I.onShake(() => quake()));
    ctx.onCleanup(I.onJolt((n) => joltFeedback(n)));
    ctx.debugShake = () => quake();

    let wig = null, bedAnim = 0;
    function springBed() {
      const id = ++bedAnim;
      const m = /translate\(([-\d.]+)/.exec(bedset.getAttribute('transform') || '');
      const from = m ? parseFloat(m[1]) : 0;
      U.tween(400, (t) => {
        if (bedAnim !== id || !alive()) return;
        bedset.setAttribute('transform', `translate(${(from * (1 - t)).toFixed(1)},0)`);
      }, U.ease.outElastic);
    }
    const bedHandlers = {
      onStart(pt) { if (ctx.locked || st.done) return; bedAnim++; A.play('tap'); wig = { lastX: pt.x, dir: 0, extreme: pt.x, flips: [] }; },
      onMove(pt, d) {
        if (!wig) return;
        bedset.setAttribute('transform', `translate(${U.clamp(d.dx * 0.3, -14, 14).toFixed(1)},0)`);
        if (wig.dir === 0) {
          if (Math.abs(pt.x - wig.extreme) > 10) { wig.dir = Math.sign(pt.x - wig.extreme); wig.extreme = pt.x; }
        } else if ((pt.x - wig.extreme) * wig.dir > 0) {
          wig.extreme = pt.x;
        } else if (Math.abs(pt.x - wig.extreme) > 14) {
          wig.dir = -wig.dir; wig.extreme = pt.x;
          const now = performance.now();
          wig.flips = wig.flips.filter((f) => now - f < 1400);
          wig.flips.push(now);
          joltFeedback(wig.flips.length);
          if (wig.flips.length >= 4) { wig = null; bedset.removeAttribute('transform'); quake(); }
        }
      },
      onEnd() { if (!wig) return; wig = null; springBed(); },
      onTap(pt, e) {
        wig = null;
        const hit = e.target.closest('[data-tap]');
        const name = hit ? hit.getAttribute('data-tap') : 'bed';
        if (taps[name]) taps[name]();
      },
    };
    ['headboard', 'bedbase', 'mattress', 'pillow', 'footboard'].forEach((id) => I.drag($(id), svg, bedHandlers));

    async function quake() {
      if (st.done || ctx.locked || !alive()) return;
      st.done = true; ctx.locked = true;
      A.play('rumble');
      U.haptic([120, 40, 200, 40, 260]);
      shakeG.classList.remove('jolt');
      shakeG.classList.add('quake');
      setTimeout(() => shakeG.classList.remove('quake'), 1300);
      // the frame drops off its nail (and lands in front of the bed), the clock falls off the nightstand
      shakeG.insertBefore(frame, zLayer);
      const tilt0 = st.frameTilt;
      U.tween(700, (t) => {
        frame.setAttribute('transform', `translate(${(306 + 12 * t).toFixed(1)},${(108 + 450 * t).toFixed(1)})`);
        frameRot.setAttribute('transform', `rotate(${U.lerp(tilt0, -14, t).toFixed(1)})`);
      }, U.ease.outBounce).then(() => A.play('crash'));
      setTimeout(() => U.tween(600, (t) => {
        clockPos.setAttribute('transform', `translate(${(64 - 10 * t).toFixed(1)},${(384 + 120 * t).toFixed(1)})`);
        clockRot.setAttribute('transform', `rotate(${(-110 * t).toFixed(1)})`);
      }, U.ease.outBounce), 220);
      zLayer.innerHTML = '';
      await U.wait(300);
      wake('quake');
    }

    /* ---------- SECRET ENDING: steal the blanket ---------- */
    I.drag(blanket, svg, {
      onStart() { if (ctx.locked || st.done) return; st.dragBlanket = true; A.play('tap'); },
      onMove(pt, d) {
        if (!st.dragBlanket) return;
        const dist = Math.hypot(d.dx, d.dy);
        st.bOff = { x: d.dx * 0.75, y: d.dy * 0.75 };
        blanket.setAttribute('transform', `translate(${st.bOff.x.toFixed(1)},${st.bOff.y.toFixed(1)})`);
        if (dist > 45 && st.face !== 'chilly') setFace('squint', 'frown', 'chilly');
        if (dist > 170) { st.dragBlanket = false; blanketOff(); }
      },
      onEnd(pt, d) {
        if (!st.dragBlanket) return;
        st.dragBlanket = false;
        if (Math.hypot(d.dx, d.dy) > 115) blanketOff(); else blanketBack();
      },
      onTap() { st.dragBlanket = false; if (!ctx.locked && !st.done) taps.blanket(); },
    });
    function blanketBack() {
      const from = { ...st.bOff };
      U.tween(650, (t) => { st.bOff = { x: from.x * (1 - t), y: from.y * (1 - t) }; blanket.setAttribute('transform', `translate(${st.bOff.x.toFixed(1)},${st.bOff.y.toFixed(1)})`); }, U.ease.outElastic);
      if (Math.hypot(from.x, from.y) > 30) {
        A.play('swish'); talk('Mmh… mine…', 1300);
        ctx.say('He yanked it back. Pull harder!');
      }
      if (st.sleeping) setFace('closed', 'sleep', 'sleep');
    }
    async function blanketOff() {
      if (st.done || !alive()) return;
      st.done = true; ctx.locked = true;
      A.play('whoosh'); U.haptic(30);
      shakeG.insertBefore(blanket, zLayer); // falls in front of the bed
      const from = { ...st.bOff };
      await U.tween(560, (t) => {
        const x = U.lerp(from.x, 30, t), y = U.lerp(from.y, 128, t) - Math.sin(t * Math.PI) * 46;
        blanket.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(9 * t).toFixed(1)},300,430)`);
      }, U.ease.inOutCubic);
      A.play('slam');
      wake('cold');
    }

    /* ---------- waking up: three different payoffs ---------- */
    async function wake(type) {
      st.sleeping = false;
      bubble.style.display = 'none';
      talkLayer.innerHTML = '';
      if (!alive()) return;
      if (type === 'sunrise') {
        setFace('squint', 'flat'); await U.wait(300);
        setFace('open', 'yawn'); setArms('up'); A.play('boing');
        await tweenPose(SIT, 700, U.ease.outBack);
        talk('Good morning, world!', 2400);
        await U.wait(600); setFace('happy', 'grin');
      } else if (type === 'quake') {
        setFace('wide', 'bigO'); setArms('up'); A.play('boing');
        await tweenPose({ x: 212, y: 296, rot: -30 }, 280, U.ease.outCubic);
        await tweenPose(SIT, 560, U.ease.outBounce);
        setFace('spiral', 'o'); setArms('relax');
        dizzy();
        talk('WHOA! Earthquake?!', 2400);
      } else if (type === 'cold') {
        U.tween(400, (t) => $('nd-pill').setAttribute('fill', U.lerpColor(YELLOW, ICE, t)));
        setFace('wide', 'chatter');
        ndShake.classList.add('shiver');
        A.play('brrr');
        await tweenPose(SIT_BARE, 600, U.ease.outBack);
        setArms('hug', ICE);
        snow();
        talk('BRRR! Who stole my blanket?!', 2400);
      }
      await U.wait(850);
      if (alive()) ctx.win(type);
    }
    function dizzy() {
      const g = U.svgEl('g', { transform: `translate(${SIT.x},${SIT.y - 64}) scale(1,.35)` }, fxLayer);
      const spin = U.svgEl('g', { class: 'o0 spin', style: 'animation-duration:1.1s' }, g);
      [0, 120, 240].forEach((a) => {
        const r = (a * Math.PI) / 180;
        U.svgEl('path', { d: `M0,-9 L2.6,-2.6 L9,-2 L4,2.4 L5.6,9 L0,5.4 L-5.6,9 L-4,2.4 L-9,-2 L-2.6,-2.6 Z`, transform: `translate(${(Math.cos(r) * 30).toFixed(1)},${(Math.sin(r) * 30).toFixed(1)}) scale(1,2.6)`, fill: YELLOW, stroke: INK, 'stroke-width': 1.6 }, spin);
      });
    }
    function snow() {
      for (let i = 0; i < 16; i++) {
        const x = U.rand(120, 320), delay = U.rand(0, 700), dur = U.rand(1500, 2400), rot = U.rand(-90, 90);
        const f = U.svgEl('g', { opacity: 0 }, fxLayer);
        f.innerHTML = `<path d="M0,-7 V7 M-6,-3.5 L6,3.5 M-6,3.5 L6,-3.5" stroke="#3A9BD5" stroke-width="2.6" stroke-linecap="round"/>`;
        setTimeout(() => {
          if (!alive()) { f.remove(); return; }
          U.tween(dur, (t) => {
            if (!alive()) return;
            f.setAttribute('opacity', t < 0.15 ? t / 0.15 : 1 - (t - 0.15) / 0.85);
            f.setAttribute('transform', `translate(${(x + Math.sin(t * 6 + i) * 10).toFixed(1)},${(250 + 200 * t).toFixed(1)}) rotate(${(rot * t).toFixed(1)})`);
          }, U.ease.linear).then(() => f.remove());
        }, delay);
      }
    }

    /* ---------- everything else reacts (and never solves) ---------- */
    async function clockTap() {
      if (st.busy.clock || !asleep()) return;
      st.busy.clock = true; ctx.attempt();
      A.play('alarm'); clockIn.classList.add('ring'); U.haptic([30, 40, 30, 40, 30, 40]);
      setFace('squint', 'frown', 'annoyed');
      await U.wait(750);
      clockIn.classList.remove('ring');
      if (!asleep()) { st.busy.clock = false; return; }
      // a stretchy noodle arm whacks the snooze button
      const d = 'M206,404 C170,356 108,338 72,370';
      const armInk = U.svgEl('path', { d, fill: 'none', stroke: INK, 'stroke-width': 11, 'stroke-linecap': 'round' }, fxLayer);
      const armCol = U.svgEl('path', { d, fill: 'none', stroke: YELLOW, 'stroke-width': 5.5, 'stroke-linecap': 'round' }, fxLayer);
      const len = armInk.getTotalLength();
      [armInk, armCol].forEach((a) => { a.style.strokeDasharray = len; a.style.strokeDashoffset = len; });
      await U.tween(170, (t) => [armInk, armCol].forEach((a) => (a.style.strokeDashoffset = len * (1 - t))));
      const hand = U.svgEl('circle', { cx: 72, cy: 370, r: 8.5, fill: YELLOW, stroke: INK, 'stroke-width': 3 }, fxLayer);
      A.play('smack'); U.haptic(40); burst('SMACK!', 70, 330);
      await U.tween(280, (t) => clockRot.setAttribute('transform', `translate(${(8 * t).toFixed(1)},${(10 * t).toFixed(1)}) rotate(${(-100 * t).toFixed(1)})`), U.ease.outBounce);
      hand.remove();
      await U.tween(170, (t) => [armInk, armCol].forEach((a) => (a.style.strokeDashoffset = len * t)));
      armInk.remove(); armCol.remove();
      if (!asleep()) { st.busy.clock = false; return; }
      setFace('closed', 'sleep', 'sleep');
      talk('…5 more minutes.');
      ctx.say('He hit snooze. Classic.');
      await U.wait(2300);
      if (!alive() || st.done) { st.busy.clock = false; return; }
      A.play('boing');
      await U.tween(350, (t) => clockRot.setAttribute('transform', `translate(${(8 * (1 - t)).toFixed(1)},${(10 * (1 - t)).toFixed(1)}) rotate(${(-100 * (1 - t)).toFixed(1)})`), U.ease.outBack);
      st.busy.clock = false;
    }

    const sleepTalk = ['5 more minutes…', 'Mmm… pancakes…', '*snort*… zzz', 'Not now, Mom…'];
    const taps = {
      noodle() {
        if (!asleep()) return;
        const n = count('noodle');
        A.play('snore'); U.replay(ndBoil, 'wiggle');
        talk(sleepTalk[(n - 1) % sleepTalk.length]);
        if (n === 2) ctx.say('He is a VERY heavy sleeper.');
        ctx.attempt();
      },
      bubble() {
        if (!asleep() || st.bubblePopped) return;
        st.bubblePopped = true;
        A.play('pop'); U.haptic(15);
        const r = bubbleC.getBoundingClientRect(), c = U.svgPoint(svg, r.left + r.width / 2, r.top + r.height / 2);
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2, drop = U.svgEl('circle', { r: 2.4, fill: '#CFEFFF', stroke: INK, 'stroke-width': 1.2 }, fxLayer);
          U.tween(380, (t) => { drop.setAttribute('cx', (c.x + Math.cos(a) * 18 * t).toFixed(1)); drop.setAttribute('cy', (c.y + Math.sin(a) * 18 * t + 10 * t * t).toFixed(1)); drop.setAttribute('opacity', 1 - t); }).then(() => drop.remove());
        }
        bubble.style.display = 'none';
        setFace('wide', 'o', 'pop');
        talk('*snort*', 1000);
        ctx.say('Gross. And he is still asleep.');
        ctx.attempt();
        setTimeout(() => {
          if (!asleep()) return;
          setFace('closed', 'sleep', 'sleep');
          bubble.style.display = ''; st.bubblePopped = false;
        }, 1300);
      },
      clock: clockTap,
      frame() {
        const from = st.frameTilt;
        st.frameTilt = from === 4 ? 18 : 4;
        A.play('wobble');
        U.tween(600, (t) => frameRot.setAttribute('transform', `rotate(${U.lerp(from, st.frameTilt, t).toFixed(1)},0,-52)`), U.ease.outElastic);
        ctx.say(st.frameTilt === 18 ? 'Crooked. Like your strategy.' : 'Straight again. Happy?');
        ctx.attempt();
      },
      curtain(node) { U.replay(node.firstElementChild, 'sway'); A.play('swish'); ctx.say('Swish! Still asleep.'); ctx.attempt(); },
      moon() {
        $('moonface').innerHTML = moonFace(true); A.play('giggle');
        ctx.say('The moon winks at you. Suspicious.');
        setTimeout(() => { if (alive()) $('moonface').innerHTML = moonFace(false); }, 900);
      },
      sky() { ctx.say('It is night. Obviously.'); ctx.attempt(); },
      hill() { ctx.say('A sleepy hill. Something is hiding behind it…'); },
      cactus(node) { A.play('ouch'); U.haptic(60); U.replay(node, 'wiggle'); burst('OUCH!', 292, 160, '#FF8FB1'); ctx.say('Cactus 1, You 0.'); ctx.attempt(); },
      books() { A.play('tap'); ctx.say('Book title: “The Sun Rises, So Do You.”', 3000); },
      slippers(node) { A.play('squeak'); U.replay(node, 'hop'); ctx.say('Squeak! Not nearly loud enough.'); ctx.attempt(); },
      rug() { A.play('tap'); ctx.say('Nice rug. Wrong answer.'); ctx.attempt(); },
      nightstand() { A.play('tap'); ctx.say('Just socks in there.'); ctx.attempt(); },
      pillow() { A.play('tap'); ctx.say('Fluffy. Not helpful.'); ctx.attempt(); },
      bed() { A.play('wobble'); ctx.say(count('bed') > 1 ? 'Wobbly old bed…' : 'Comfy bed. Too comfy.'); ctx.attempt(); },
      blanket() { A.play('swish'); talk('Mmh… burrito mode.', 1300); ctx.say('He is wrapped up tight.'); ctx.attempt(); },
      wall() { A.play('bonk'); ctx.say(U.pick(['Nope.', 'Think outside the screen.', 'Try something brighter.', 'Hmm. No.'])); ctx.attempt(); },
      floor() { taps.wall(); },
    };
    I.taps(svg, (name, node) => { if (ctx.locked) return; if (taps[name]) taps[name](node); });

    /* the prompt is part of the puzzle too */
    const up = ctx.promptEl.querySelector('#pw-up');
    ctx.promptEl.onclick = (e) => {
      if (ctx.locked) return;
      if (e.target === up) { U.replay(up, 'hop'); A.play('boing'); ctx.say('UP. Yes. Things go up.'); }
      else { A.play('tap'); ctx.say('Yes. THAT is the task.'); }
    };
  }

  BF.levels = BF.levels || {};
  BF.levels[1] = L;
})(window.BF);

    <g id="l2-pot" transform="translate(${PIV.x},${PIV.y})"><g id="l2-pot-in" data-tap="teapot" class="boil">${teapot()}</g></g>

    <!-- tea stream -->
    <path id="l2-stream-ink" d="" fill="none" stroke="${INK}" stroke-width="10" stroke-linecap="round" opacity="0" pointer-events="none"/>
    <path id="l2-stream" d="" fill="none" stroke="${TEA}" stroke-width="5" stroke-linecap="round" opacity="0" pointer-events="none"/>

    <g id="l2-fx" pointer-events="none"></g>
    <g id="l2-talk" pointer-events="none"></g>
  </g>
</svg>`;
  }

  const L = {
    id: 2,
    promptHTML: '<span class="pw" id="pw-pour">Pour</span> him some tea!',
    endings: [
      { id: 'tea', name: 'Tea Time', line: 'Ahh. Perfect cup.', rarity: 58, icon: 'tea', stamp: 'CHEERS!' },
      { id: 'spill', name: 'Overflow', line: 'HOT HOT HOT!', rarity: 17, icon: 'spill', stamp: 'OOPS!' },
      { id: 'sugar', name: 'Sugar Rush', line: 'SUGAAAR RUSH!', rarity: 9, icon: 'sugar', stamp: 'SWEET!' },
    ],
    hints(found, ctx) {
      const sensors = I.hasMotion;
      if (!found.includes('tea')) return sensors
        ? [{ text: 'Teapots pour when they tip. Phones tip too.' }, { text: 'Tilt your phone to the right. Stop when it is full!', demo: 'tilt' }]
        : [{ text: 'Teapots pour when they tip.' }, { text: 'Drag the teapot to tip it. Stop when it is full!', demo: 'pot' }];
      if (!found.includes('spill')) return [{ text: 'What happens if you DON\'T stop?' }, { text: 'Keep pouring after the cup is full.', demo: sensors ? 'tilt' : 'pot' }];
      if (!found.includes('sugar')) return [{ text: 'Noodle has a sweet tooth.' }, { text: 'Feed him sugar cubes. Lots of them.', demo: 'sugar' }];
      return [{ text: 'All endings found. You are a tea master.' }];
    },
    demo(kind) {
      if (kind === 'tilt') return { tilt: 1 };
      if (kind === 'pot') return [{ x: 110, y: 330 }, { x: 175, y: 330 }];
      if (kind === 'sugar') return [{ x: 40, y: 362 }, { x: 300, y: 320 }];
      return null;
    },
    build,
  };

  function build(ctx) {
    ctx.root.innerHTML = sceneSVG();
    const svg = ctx.root.querySelector('svg');
    const $ = (id) => svg.querySelector('#l2-' + id);
    const pot = $('pot'), potIn = $('pot-in'), lamp = $('lamp'), cup = $('cup'), tea = $('tea'), drips = $('drips');
    const stream = $('stream'), streamInk = $('stream-ink'), puddle = $('puddle');
    const nd = $('nd'), ndFace = $('nd-face'), ndArms = $('nd-arms'), ndShake = $('nd-shake'), ndBoil = $('nd-boil');
    const fx = $('fx'), talkLayer = $('talk'), shakeG = $('shake');

    const st = {
      done: false, theta: 0, manual: null, lampA: 0, fill: 0, fullAnnounced: false, overT: 0, pourT: 0, pourSfxAt: 0, stopT: 0,
      nagged: false, warned: false, spill: 0, sugar: 0, taps: {}, face: 'smile', thirsty: true, lastTouch: performance.now(),
    };
    const alive = () => ctx.alive;
    const count = (k) => (st.taps[k] = (st.taps[k] || 0) + 1);
    const setFace = (eyes, mouth) => { ndFace.innerHTML = ART.noodleFace({ eyes, mouth }); st.face = eyes + mouth; };
    const setArms = (t, c) => { ndArms.innerHTML = ART.noodleArms(t, c || YELLOW); };

    const talk = (text, ms = 1800) => ctx.talk(talkLayer, ND.x - 6, ND.y - 62, text, ms, 0.72);

    /* ---------- the physics of a teapot ---------- */
    const potLift = (th) => Math.min(26, Math.max(0, th) * 0.42);
    function tipWorld(th) {
      const r = (th * Math.PI) / 180, c = Math.cos(r), s = Math.sin(r);
      return { x: PIV.x + TIP.x * c - TIP.y * s, y: (PIV.y - potLift(th)) + TIP.x * s + TIP.y * c };
    }
    function drawPot() {
      pot.setAttribute('transform', `translate(${PIV.x},${(PIV.y - potLift(st.theta)).toFixed(1)}) rotate(${st.theta.toFixed(1)})`);
    }
    function drawTea() {
      const h = 25 * U.clamp(st.fill, 0, 1);
      tea.setAttribute('y', (-3 - h).toFixed(1));
      tea.setAttribute('height', h.toFixed(1));
    }
    function drawStream(on, tip, land) {
      const o = on ? 1 : 0;
      stream.setAttribute('opacity', o); streamInk.setAttribute('opacity', o);
      if (!on) return;
      const d = `M${tip.x.toFixed(1)},${tip.y.toFixed(1)} Q${(tip.x + 14).toFixed(1)},${(tip.y - 2).toFixed(1)} ${land.x.toFixed(1)},${land.y.toFixed(1)}`;
      stream.setAttribute('d', d); streamInk.setAttribute('d', d);
    }
    let puddleEl = null;
    function growPuddle(x, amt) {
      st.spill += amt;
      const rx = Math.min(70, 8 + st.spill * 60);
      if (!puddleEl) puddleEl = U.svgEl('ellipse', { cy: 381, fill: TEA, stroke: INK, 'stroke-width': 2 }, puddle);
      puddleEl.setAttribute('cx', x.toFixed(1));
      puddleEl.setAttribute('rx', rx.toFixed(1));
      puddleEl.setAttribute('ry', Math.min(6, 2 + rx / 14).toFixed(1));
    }

    // touch fallback: drag the teapot sideways to tip it (only matters without sensors)
    I.drag(potIn, svg, {
      onStart() { if (ctx.locked || st.done) return; st.manual = 0; },
      onMove(pt, d) {
        if (st.manual === null) return;
        if (I.hasMotion) { st.manual = U.clamp(d.dx * 0.12, -6, 6); return; } // just a heavy wobble
        st.manual = U.clamp(d.dx * 0.55, 0, 72);
      },
      onEnd() {
        if (st.manual === null) return;
        st.manual = null;
        if (I.hasMotion && !st.done) { ctx.say('Too heavy to lift. Tilt something bigger…'); A.play('bonk'); ctx.attempt(); }
      },
      onTap(pt, e) {
        st.manual = null;
        if (ctx.locked) return;
        const hit = e.target.closest('[data-tap]');
        if (hit && hit.getAttribute('data-tap') === 'lid') taps.lid(hit);
        else taps.teapot();
      },
    });

    let last = performance.now();
    (function loop(now) {
      if (!alive()) return;
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      // lamp hangs toward real "down"
      const tilt = I.hasMotion ? I.tilt : 0;
      st.lampA += (U.clamp(-tilt * 0.9, -45, 45) - st.lampA) * 0.12;
      lamp.setAttribute('transform', `translate(200,-150) rotate(${st.lampA.toFixed(1)})`);

      if (!st.done) {
        let target = 0;
        if (st.manual !== null) target = st.manual;
        else if (I.hasMotion) target = U.clamp((tilt - 6) * 1.1, 0, 72);
        st.theta += (target - st.theta) * 0.14;
        drawPot();

        const flow = st.theta > 28 ? Math.min(1, (st.theta - 28) / 10) : 0;
        if (flow > 0) {
          const tip = tipWorld(st.theta);
          const landX = tip.x + 12 + Math.max(0, st.theta - 58) * 1.1;
          const inCup = tip.y < RIM - 2 && Math.abs(landX - CUP.x) < 22;
          const land = inCup ? { x: landX, y: CUP.y - 3 - 25 * Math.min(1, st.fill) } : { x: landX + 4, y: 378 };
          drawStream(true, tip, land);
          st.pourT += dt; st.stopT = 0;
          if (now - st.pourSfxAt > 115) {
            st.pourSfxAt = now;
            A.play('pour', inCup ? st.fill : 0.1);
          }
          if (inCup) {
            if (st.fill < 1) {
              st.fill = Math.min(1, st.fill + 0.4 * flow * dt);
              drawTea();
              if (st.face !== 'opengrin' && st.fill > 0.25) setFace('open', 'grin');
              if (st.fill >= 1 && !st.fullAnnounced) {
                st.fullAnnounced = true;
                setFace('wide', 'o');
                talk('That\'s plenty!', 1400);
                A.play('squeak');
              }
            } else {
              drips.setAttribute('opacity', 1);
              growPuddle(CUP.x, 0.5 * dt);
              st.overT += dt;
              if (st.overT > 1.35) overflow();
            }
          } else {
            growPuddle(landX, 0.35 * dt);
            if (!st.warned && st.spill > 0.15) { st.warned = true; ctx.say('Easy! Not THAT far.'); }
          }
        } else {
          drawStream(false);
          if (st.fill >= 1) teaTime();
          else if (st.fill > 0.12) {
            st.stopT += dt;
            if (st.stopT > 1.4 && !st.nagged) { st.nagged = true; talk('Half a cup? Really?', 1500); ctx.say('Keep going. He is thirsty.'); }
          }
        }
        if (now - st.lastTouch > 8000 && st.fill === 0) {
          st.lastTouch = now;
          ctx.say(U.pick(['Psst… read the poster.', 'Watch the lamp when you move.', 'Stuck? The bulb up top can help.']));
        }
      }
      requestAnimationFrame(loop);
    })(last);
    svg.addEventListener('pointerdown', () => { st.lastTouch = performance.now(); });

    /* ---------- endings ---------- */
    async function settlePot() {
      const from = st.theta;
      drawStream(false);
      await U.tween(450, (t) => { st.theta = from * (1 - t); drawPot(); }, U.ease.outBack);
    }
    async function teaTime() {
      if (st.done || !alive()) return;
      st.done = true; ctx.locked = true;
      settlePot();
      A.play('boing');
      setFace('happy', 'grin'); setArms('hold');
      // Noodle lifts the cup to his mouth
      await U.tween(600, (t) => cup.setAttribute('transform', `translate(${U.lerp(CUP.x, ND.x - 4, t).toFixed(1)},${U.lerp(CUP.y, ND.y + 28, t).toFixed(1)}) rotate(${(-14 * t).toFixed(1)})`), U.ease.outBack);
      A.play('chirp');
      talk('Ahh. Perfect cup.', 2200);
      hearts();
      await U.wait(1300);
      if (alive()) ctx.win('tea');
    }
    async function overflow() {
      if (st.done || !alive()) return;
      st.done = true; ctx.locked = true;
      A.play('whoosh'); U.haptic([60, 40, 60]);
      const t0 = performance.now();
      await U.tween(700, () => growPuddle(CUP.x, 0.03), U.ease.linear);
      settlePot();
      $('nd-pill').setAttribute('fill', '#FFB08A');
      setFace('wide', 'bigO'); setArms('up', '#FFB08A');
      ndShake.classList.add('shiver');
      A.play('brrr');
      steam();
      await U.tween(300, (t) => nd.setAttribute('transform', `translate(${ND.x},${(ND.y - 40 * Math.sin(t * Math.PI)).toFixed(1)})`));
      talk('HOT HOT HOT!', 2200);
      await U.tween(300, (t) => nd.setAttribute('transform', `translate(${ND.x},${(ND.y - 30 * Math.sin(t * Math.PI)).toFixed(1)})`));
      void t0;
      await U.wait(1100);
      if (alive()) ctx.win('spill');
    }
    async function sugarRush() {
      if (st.done || !alive()) return;
      st.done = true; ctx.locked = true;
      settlePot();
      setFace('wide', 'grin'); setArms('up');
      ndShake.classList.add('shiver');
      talk('SUGAAAR RUSH!', 2400);
      U.haptic([40, 30, 40, 30, 40, 30, 80]);
      for (let i = 0; i < 5 && alive(); i++) {
        A.play('boing');
        zoomLines();
        await U.tween(220, (t) => nd.setAttribute('transform', `translate(${(ND.x + (i % 2 ? 10 : -10) * Math.sin(t * Math.PI)).toFixed(1)},${(ND.y - 46 * Math.sin(t * Math.PI)).toFixed(1)})`));
      }
      await U.wait(700);
      if (alive()) ctx.win('sugar');
    }
    function hearts() {
      for (let i = 0; i < 4; i++) {
        const h = U.svgEl('path', { d: 'M0,-6 C-4,-11 -11,-7 -7,-2 L0,5 L7,-2 C11,-7 4,-11 0,-6 Z', fill: PINK, stroke: INK, 'stroke-width': 1.8 }, fx);
        const x0 = ND.x - 30 + i * 16;
        setTimeout(() => {
          if (!alive()) { h.remove(); return; }
          U.tween(1400, (t) => {
            if (!alive()) return;
            h.setAttribute('transform', `translate(${(x0 + Math.sin(t * 6 + i) * 6).toFixed(1)},${(ND.y - 40 - 70 * t).toFixed(1)}) scale(${(0.8 + t * 0.6).toFixed(2)})`);
            h.setAttribute('opacity', 1 - t);
          }, U.ease.linear).then(() => h.remove());
        }, i * 180);
      }
    }
    function steam() {
      for (let i = 0; i < 3; i++) {
        const s = U.svgEl('path', { d: 'M0,0 q6,-8 0,-16 q-6,-8 0,-16', fill: 'none', stroke: INK, 'stroke-width': 3, 'stroke-linecap': 'round', opacity: 0.7 }, fx);
        const x0 = ND.x - 26 + i * 26;
        U.tween(1600, (t) => { s.setAttribute('transform', `translate(${x0},${(ND.y - 64 - 30 * t).toFixed(1)})`); s.setAttribute('opacity', (0.7 * (1 - t)).toFixed(2)); }, U.ease.linear).then(() => s.remove());
      }
    }
    function zoomLines() {
      const g = U.svgEl('g', {}, fx);
      g.innerHTML = `<path d="M${ND.x - 70},${ND.y - 20} h-20 M${ND.x + 70},${ND.y - 10} h20 M${ND.x - 64},${ND.y + 10} h-16 M${ND.x + 66},${ND.y + 18} h16" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>`;
      setTimeout(() => g.remove(), 200);
    }

    /* ---------- SECRET: sugar cubes, dragged into Noodle's mouth ---------- */
    const sugarEl = $('sugar');
    let cube = null;
    I.drag(sugarEl, svg, {
      onStart(pt) {
        if (ctx.locked || st.done) return;
        cube = U.svgEl('rect', { width: 16, height: 16, rx: 3, fill: '#fff', stroke: INK, 'stroke-width': 2.6 }, fx);
        cube.setAttribute('transform', `translate(${pt.x - 8},${pt.y - 8})`);
        A.play('tap');
      },
      onMove(pt) { if (cube) cube.setAttribute('transform', `translate(${(pt.x - 8).toFixed(1)},${(pt.y - 8).toFixed(1)}) rotate(${(pt.x % 30) - 15},8,8)`); },
      onEnd(pt) {
        if (!cube) return;
        const c = cube; cube = null;
        if (Math.hypot(pt.x - ND.x, pt.y - (ND.y - 4)) < 52) {
          c.remove(); st.sugar++;
          A.play('pop'); U.replay(ndBoil, 'wiggle'); U.haptic(20);
          if (st.sugar === 1) { setFace('happy', 'grin'); talk('Mmm! Sugar!'); ctx.say('That is not tea.'); }
          else if (st.sugar === 2) { setFace('wide', 'grin'); talk('MORE! MORE!'); }
          else sugarRush();
        } else if (Math.abs(pt.x - CUP.x) < 26 && Math.abs(pt.y - (CUP.y - 16)) < 26) {
          c.remove(); A.play('pop'); ctx.say('Sweet. But the cup is still empty.');
        } else {
          A.play('bonk');
          const x0 = pt.x - 8, y0 = pt.y - 8;
          U.tween(400, (t) => c.setAttribute('transform', `translate(${x0.toFixed(1)},${U.lerp(y0, 364, t).toFixed(1)})`), U.ease.outBounce)
            .then(() => U.tween(500, (t) => c.setAttribute('opacity', 1 - t))).then(() => c.remove());
        }
      },
      onTap() { if (cube) { cube.remove(); cube = null; } if (!ctx.locked) taps.sugar(); },
    });

    /* ---------- reactions ---------- */
    const thirsty = ['I\'m sooo thirsty…', 'Tea, please!', '*taps cup*', 'Any day now…'];
    const taps = {
      noodle() { if (st.done) return; const n = count('noodle'); A.play('wobble'); U.replay(ndBoil, 'wiggle'); talk(thirsty[(n - 1) % thirsty.length]); ctx.attempt(); },
      cup() { A.play('squeak'); ctx.say(st.fill > 0 ? 'Some tea is in. Keep going!' : 'Empty. Tragic.'); ctx.attempt(); },
      teapot() { A.play('bonk'); U.replay(potIn, 'wiggle'); ctx.say(I.hasMotion ? 'Too heavy to lift. Tilt something bigger…' : 'Heavy! Try dragging it.'); ctx.attempt(); },
      lid(node) { A.play('boing'); U.replay(node.firstElementChild, 'hop'); steamPuff(); ctx.say('Hot! And full of tea.'); },
      lamp() { A.play('swish'); st.lampA += 25; ctx.say('Wheee. It always hangs straight down.', 2600); },
      poster(node) { A.play('tap'); U.replay(node, 'wiggle'); ctx.say('Wise words.'); },
      clock() {
        A.play('wobble');
        const h = $('hands');
        U.tween(700, (t) => h.setAttribute('transform', `rotate(${(720 * t).toFixed(0)})`), U.ease.outCubic);
        ctx.say('Four o\'clock. Always tea time.');
      },
      plates(node) { A.play('squeak'); U.replay(node.firstElementChild, 'wiggle'); ctx.say('Clatter! Not helpful.'); ctx.attempt(); },
      sugar() { A.play('tap'); ctx.say('Sugar cubes. Somebody loves sugar…'); },
      cloth() { A.play('tap'); ctx.say('Fancy tablecloth. Wrong answer.'); ctx.attempt(); },
      wall() { A.play('bonk'); ctx.say(U.pick(['Nope.', 'Think outside the screen.', 'The tea is not going to pour itself.'])); ctx.attempt(); },
      floor() { taps.wall(); },
    };
    function steamPuff() {
      const tip = { x: PIV.x - 50, y: PIV.y - 100 };
      const s = U.svgEl('path', { d: 'M0,0 q6,-8 0,-16 q-6,-8 0,-16', fill: 'none', stroke: INK, 'stroke-width': 3, 'stroke-linecap': 'round' }, fx);
      U.tween(900, (t) => { s.setAttribute('transform', `translate(${tip.x},${(tip.y - 24 * t).toFixed(1)})`); s.setAttribute('opacity', 1 - t); }).then(() => s.remove());
    }
    I.taps(svg, (name, node) => { if (ctx.locked) return; if (taps[name]) taps[name](node); });

    const pour = ctx.promptEl.querySelector('#pw-pour');
    ctx.promptEl.onclick = (e) => {
      if (ctx.locked) return;
      if (e.target === pour) { U.replay(pour, 'tip'); A.play('swish'); ctx.say('Pouring needs a little… tilt.'); }
      else { A.play('tap'); ctx.say('Yes. Tea. For Noodle.'); }
    };
    void shakeG;
  }

  BF.levels = BF.levels || {};
  BF.levels[2] = L;
})(window.BF);

</script>
<script>
/* Brainflip — Level 3: "Find the hidden cat"
   Main ending : pinch-zoom into the TINY painting: the cat lives in it  (verb: pinch / zoom)
   Secret #1   : the "a" in the prompt has tiny ears; tap it and the cat jumps out of the text
   Secret #2   : drop the tuna can on the floor; the cat comes out of the box  (verb: drag + wait)
   Decoys: a cat cushion, a striped "tail" behind the sofa, a dog portrait.
   Without pinch (desktop): mouse wheel or double-tap zooms. */
(function (BF) {
  'use strict';
  const U = BF.U, A = BF.audio, I = BF.input, ART = BF.art;
  const INK = '#1B1B2F', YELLOW = '#FFC93C', PINK = '#FF5D8F', ORANGE = '#FF9F43';
  const W = 'stroke-linecap="round" stroke-linejoin="round"';
  const S = `stroke="${INK}" stroke-width="3.4" ${W}`;
  const ND = { x: 128, y: 404 };
  const PAINT = { x: 266, y: 150 };   // the tiny painting's centre
  const MAXZ = 6;

  /** Whiskers the cat. Origin = bottom centre, about 64 x 84. */
  function cat({ eyes = 'open', wave = false, stroke = 3 } = {}) {
    const sw = `stroke="${INK}" stroke-width="${stroke}" ${W}`;
    const e = eyes === 'happy'
      ? `<path d="M-11,-52 Q-7,-57 -3,-52 M3,-52 Q7,-57 11,-52" fill="none" ${sw}/>`
      : `<circle cx="-7" cy="-53" r="3.4" fill="${INK}"/><circle cx="7" cy="-53" r="3.4" fill="${INK}"/><circle cx="-6" cy="-54.5" r="1.1" fill="#fff"/><circle cx="8" cy="-54.5" r="1.1" fill="#fff"/>`;
    const paw = wave
      ? `<path d="M15,-30 Q30,-38 30,-58" fill="none" stroke="${INK}" stroke-width="10" ${W}/><path d="M15,-30 Q30,-38 30,-58" fill="none" stroke="${ORANGE}" stroke-width="5" ${W}/><circle cx="30" cy="-61" r="6" fill="${ORANGE}" ${sw}/>`
      : `<ellipse cx="9" cy="-2" rx="8" ry="5" fill="${ORANGE}" ${sw}/>`;
    return `<path d="M16,-8 C42,-8 44,-36 30,-46" fill="none" stroke="${INK}" stroke-width="10" ${W}/>` +
      `<path d="M16,-8 C42,-8 44,-36 30,-46" fill="none" stroke="${ORANGE}" stroke-width="5" ${W}/>` +
      `<ellipse cx="0" cy="-22" rx="22" ry="23" fill="${ORANGE}" ${sw}/>` +
      `<path d="M-12,-30 h6 M-14,-20 h6 M8,-30 h6" stroke="#E07B20" stroke-width="3" stroke-linecap="round"/>` +
      `<ellipse cx="-9" cy="-2" rx="8" ry="5" fill="${ORANGE}" ${sw}/>${paw}` +
      `<path d="M-18,-60 L-15,-81 L-3,-70 Z M18,-60 L15,-81 L3,-70 Z" fill="${ORANGE}" ${sw}/>` +
      `<path d="M-14,-66 L-13,-75 L-7,-70 Z M14,-66 L13,-75 L7,-70 Z" fill="#FF8FB1"/>` +
      `<circle cx="0" cy="-52" r="20" fill="${ORANGE}" ${sw}/>` +
      `<path d="M-4,-71 v6 M4,-71 v6" stroke="#E07B20" stroke-width="2.6" stroke-linecap="round"/>` + e +
      `<path d="M-2.5,-47 h5 l-2.5,3 Z" fill="${PINK}"/><path d="M-5,-42 q2.5,3 5,0 q2.5,3 5,0" fill="none" stroke="${INK}" stroke-width="1.8" ${W}/>` +
      `<path d="M-12,-46 h-10 M-12,-43 l-9,3 M12,-46 h10 M12,-43 l9,3" stroke="${INK}" stroke-width="1.4" stroke-linecap="round"/>`;
  }

  function frame(x, y, w, h, inner, tap, rot = 0) {
    return `<g transform="translate(${x},${y}) rotate(${rot})"><g data-tap="${tap}" class="fb">
      <path d="M${-w * 0.25},${-h / 2} L0,${-h / 2 - Math.max(6, h * 0.25)} L${w * 0.25},${-h / 2}" fill="none" stroke="${INK}" stroke-width="2" ${W}/>
      <rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${Math.max(2, w * 0.06)}" fill="#C77D4A" stroke="${INK}" stroke-width="${Math.max(1.4, w * 0.035)}"/>
      <g>${inner}</g></g></g>`;
  }

  function sceneSVG() {
    const dog = `<rect x="-42" y="-32" width="84" height="64" fill="#FFF4E0" stroke="${INK}" stroke-width="2.4"/>
      <ellipse cx="0" cy="14" rx="26" ry="16" fill="#C77D4A" stroke="${INK}" stroke-width="2.4"/>
      <circle cx="0" cy="-6" r="17" fill="#E8A06A" stroke="${INK}" stroke-width="2.4"/>
      <path d="M-15,-14 Q-26,-4 -18,8 L-12,-6 Z M15,-14 Q26,-4 18,8 L12,-6 Z" fill="#8A5A3B" stroke="${INK}" stroke-width="2.2" ${W}/>

      <ellipse cx="0" cy="-1" rx="4" ry="3" fill="${INK}"/><path d="M0,2 v4" stroke="${INK}" stroke-width="1.8"/>

      ];
      return [{ text: 'All endings found! Sweet dreams.' }];
    },
    demo(kind) {
      if (kind === 'prompt') return [{ x: 240, y: -32 }, { x: 110, y: 150 }];
      if (kind === 'flip') return { flip: true };
      if (kind === 'hold') return { hold: { x: BULB.x, y: BULB.y } };
      if (kind === 'mask') return [{ x: MASK0.x, y: MASK0.y }, { x: ND.x, y: ND.y - 16 }];
      return null;
    },
    build,
  };

  // Level 4 stickers
  Object.assign(ART.stickers, {
    l4switch: (uid = 'a') => ART.stickerFrame('#1E2058',
      star(-32, -26, 8, MINT) + star(34, -20, 7, YELLOW) + star(-28, 30, 6, PINK) +
      `<rect x="-20" y="-28" width="40" height="56" rx="8" fill="#fff" stroke="${INK}" stroke-width="3.5"/>` +
      `<rect x="-10" y="-12" width="20" height="24" rx="3" fill="#EAF0F6" stroke="${INK}" stroke-width="2.4"/>` +
      `<rect x="-8" y="0" width="16" height="12" rx="3" fill="${MINT}" stroke="${INK}" stroke-width="2.6"/>`, 'l4sw' + uid),
    l4flip: (uid = 'a') => ART.stickerFrame('#131538',
      star(-34, -24, 7, YELLOW) + star(34, -26, 8, MINT) + star(32, 26, 6, PINK) +
      `<g transform="translate(0,-10) rotate(180)"><rect x="-18" y="-28" width="36" height="56" rx="8" fill="#2B2D6E" stroke="#fff" stroke-width="3"/><circle cx="0" cy="-16" r="4" fill="#5BC0EB"/></g>` +
      `<path d="M-20,26 Q-13,18 -6,26 M6,26 Q13,18 20,26" fill="none" stroke="#FFF4C2" stroke-width="3.8" ${W}/>`, 'l4fl' + uid),
    l4mask: (uid = 'a') => ART.stickerFrame('#FFE97D',
      `<path d="M0,-54 V-42 M40,-38 L30,-28 M-40,-38 L-30,-28 M50,0 H38 M-50,0 H-38" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>` +
      ART.noodle({ x: 0, y: 12, scale: 0.64, eyes: 'closed', mouth: 'grin', armType: 'relax', extra: `<g transform="translate(0,-20) scale(.92)">${maskArt()}</g>` }), 'l4mk' + uid),
  });

  function build(ctx) {
    ctx.root.innerHTML = sceneSVG();
    const svg = ctx.root.querySelector('svg');
    const $ = (id) => svg.querySelector('#l4-' + id);

    const beam = $('beam'), bulbGlow = $('bulb-glow'), bulbGlass = $('bulb-glass'), filament = $('filament');
    const bulbPivot = $('bulb-pivot'), bulbHit = $('bulb-hit'), holdRing = $('hold-ring');
    const dark = $('dark'), nightGlow = $('night-glow'), starsDim = $('stars-dim');
    const moth = $('moth'), secretWrap = $('secret-wrap'), realSwitch = $('real-switch'), realToggle = $('real-toggle');
    const fakeSwitch = $('fake-switch'), fakeRot = $('fake-rot'), fakeToggle = $('fake-toggle'), decoyMsg = $('decoy-msg');
    const hatch = $('hatch'), finger = $('finger');
    const ndBoil = $('nd-boil'), ndFace = $('nd-face'), ndArms = $('nd-arms'), ndWear = $('nd-wear');
    const mask = $('mask'), maskIn = $('mask-in'), fx = $('fx'), talkLayer = $('talk');
    const secretTimer = setTimeout(() => { if (alive()) secretWrap.setAttribute('opacity', '1'); }, 470);
    ctx.onCleanup(() => clearTimeout(secretTimer));

    const st = {
      done: false, lightOn: true, fakeTaps: 0, fakeBusy: false, fakeFallen: false,
      revealed: false, pOff: { x: 0, y: 0 }, swing: 0, swingV: 0,
      mothScared: 0, taps: {}, lastTouch: performance.now(),
    };
    const alive = () => ctx.alive;
    const count = (k) => (st.taps[k] = (st.taps[k] || 0) + 1);
    const setFace = (eyes, mouth) => { ndFace.innerHTML = ART.noodleFace({ eyes, mouth }); };
    const setArms = (t) => { ndArms.innerHTML = ART.noodleArms(t); };
    const talk = (text, ms = 1800) => ctx.talk(talkLayer, ND.x, ND.y - 64, text, ms, 0.5);

    function burst(text, x, y, color = YELLOW) {
      const g = U.svgEl('g', { transform: `translate(${x},${y})` }, fx);
      const inner = U.svgEl('g', { class: 'fb popin' }, g);
      let d = '';
      for (let i = 0; i < 16; i++) { const a = (i / 16) * Math.PI * 2, r = i % 2 ? 20 : 32; d += `${i ? 'L' : 'M'}${(Math.cos(a) * r * 1.4).toFixed(1)},${(Math.sin(a) * r).toFixed(1)} `; }
      U.svgEl('path', { d: d + 'Z', fill: color, stroke: INK, 'stroke-width': 3, 'stroke-linejoin': 'round' }, inner);
      const t = U.svgEl('text', { y: 6, 'text-anchor': 'middle', 'font-family': '"Lilita One", sans-serif', 'font-size': 17, fill: INK }, inner);
      t.textContent = text;
      setTimeout(() => g.remove(), 750);
    }

    function isSwitchUncovered() {
      const pr = ctx.promptEl.getBoundingClientRect();
      const sr = realToggle.getBoundingClientRect();
      // Uncovered once the prompt no longer overlaps the center of the real switch toggle
      const sx = sr.left + sr.width / 2, sy = sr.top + sr.height / 2;
      const hitPrompt = sx > pr.left - 8 && sx < pr.right + 8 && sy > pr.top - 8 && sy < pr.bottom + 8;
      return !hitPrompt;
    }

    /* ---------- MAIN ENDING: drag the #prompt banner to reveal the hidden switch ---------- */
    const promptEl = ctx.promptEl;
    promptEl.classList.add('prompt-drag');
    let pDrag = null;
    function placePrompt(rot = -2) {
      promptEl.style.transform = `translate(calc(-50% + ${st.pOff.x.toFixed(1)}px), ${st.pOff.y.toFixed(1)}px) rotate(${rot.toFixed(1)}deg)`;
    }
    const onPromptDown = (e) => {
      if (ctx.locked || st.done || pDrag) return;
      st.lastTouch = performance.now();
      promptEl.classList.remove('slam');
      secretWrap.setAttribute('opacity', '1');
      promptEl.style.transition = 'none';
      const p = ctx.sceneFromClient(e.clientX, e.clientY);
      pDrag = { id: e.pointerId, start: p, off0: { ...st.pOff }, maxMove: 0 };
      try { promptEl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      e.preventDefault();
    };
    const onPromptMove = (e) => {
      if (!pDrag || e.pointerId !== pDrag.id || st.done) return;
      const p = ctx.sceneFromClient(e.clientX, e.clientY);
      const dx = p.x - pDrag.start.x, dy = p.y - pDrag.start.y;
      pDrag.maxMove = Math.max(pDrag.maxMove, Math.hypot(dx, dy));
      st.pOff.x = U.clamp(pDrag.off0.x + dx, -220, 220);
      st.pOff.y = U.clamp(pDrag.off0.y + dy, -16, 440);
      placePrompt(U.clamp(-2 + dx * 0.08, -14, 12));
      if (!st.revealed && isSwitchUncovered()) {
        st.revealed = true;
        A.play('squeak');
        ctx.say('WAIT… how did you find that?!', 2600);
      }
    };
    const onPromptUp = (e) => {
      if (!pDrag || e.pointerId !== pDrag.id) return;
      const moved = pDrag.maxMove;
      pDrag = null;
      if (moved < 8) {
        const n = count('prompt');
        A.play('wobble');
        promptEl.style.transition = 'transform .22s cubic-bezier(.3,1.5,.5,1)';
        placePrompt(n % 2 ? 5 : -8);
        setTimeout(() => { if (alive() && !pDrag) placePrompt(-2); }, 180);
        ctx.say(n === 1 ? 'Hey! Don’t push the instructions around.' : 'Seriously, stop shoving me!');
      } else {
        promptEl.style.transition = 'transform .25s ease-out';
        placePrompt(-2);
        A.play('tap');
      }
    };
    promptEl.addEventListener('pointerdown', onPromptDown);
    promptEl.addEventListener('pointermove', onPromptMove);
    promptEl.addEventListener('pointerup', onPromptUp);
    promptEl.addEventListener('pointercancel', onPromptUp);
    ctx.onCleanup(() => {
      promptEl.removeEventListener('pointerdown', onPromptDown);
      promptEl.removeEventListener('pointermove', onPromptMove);
      promptEl.removeEventListener('pointerup', onPromptUp);
      promptEl.removeEventListener('pointercancel', onPromptUp);
    });

    /* ---------- light off visual transition (shared by Hidden Switch & Brain Flip!) ---------- */
    async function turnOffLights(endingId, src) {
      if (st.done || !alive()) return;
      st.done = true; ctx.locked = true; st.lightOn = false;
      A.play('click');
      if (endingId === 'flip') { A.play('flip'); U.haptic([40, 60, 120]); }
      else U.haptic(35);

      if (endingId === 'switch') realToggle.setAttribute('y', '0');
      beam.setAttribute('opacity', '0');
      bulbGlow.setAttribute('opacity', '0');
      bulbGlass.setAttribute('fill', '#B8C0CC');
      filament.setAttribute('stroke', '#6E6680');
      starsDim.setAttribute('opacity', '0');
      moth.setAttribute('opacity', '0');
      holdRing.setAttribute('opacity', '0');
      ndWear.innerHTML = ''; // Noodle removes his sunglasses in the dark!
      setFace('happy', 'grin'); setArms('relax');

      await U.tween(320, (t) => {
        if (!alive()) return;
        dark.setAttribute('opacity', (0.86 * t).toFixed(3));
        nightGlow.setAttribute('opacity', t.toFixed(3));
      }, U.ease.outCubic);

      // If flipped face-down on a real phone, wait briefly for the player to turn it back up so they see the payoff!
      if (endingId === 'flip' && src === 'sensor' && I.isFaceDown) {
        for (let i = 0; i < 32 && alive() && I.isFaceDown; i++) await U.wait(100);
        if (!alive()) return;
        await U.wait(220);
      }

      A.play('boing');
      talk(endingId === 'flip' ? 'Whoa… pitch black! Genius!' : 'Ahhh… sweet darkness!', 2400);
      if (endingId === 'switch') ctx.say('Who hides a light switch behind the title?!', 2600);
      await U.wait(1100);
      if (alive()) ctx.win(endingId);
    }

    /* ---------- SECRET ENDING #1: flip phone face-down (or hold bulb on desktop) ---------- */
    ctx.onCleanup(I.onFlip((src) => turnOffLights('flip', src)));

    let hold = null;
    bulbHit.addEventListener('pointerdown', (e) => {
      if (ctx.locked || st.done || hold) return;
      st.lastTouch = performance.now();
      try { bulbHit.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      hold = { id: e.pointerId, t0: performance.now(), smothering: false, warnedSensor: false };
      e.preventDefault();
    });
    const endBulbHold = (e) => {
      if (!hold || e.pointerId !== hold.id) return;
      const elapsed = performance.now() - hold.t0;
      const wasSmothering = hold.smothering;
      hold = null;
      holdRing.setAttribute('opacity', '0');
      holdRing.setAttribute('stroke-dashoffset', '264');
      if (st.done) return;
      if (wasSmothering) {
        dark.setAttribute('opacity', '0');
        A.play('swish');
        ctx.say('Keep holding to block out ALL the light!');
      } else if (elapsed < 340) {
        taps.bulb();
      }
    };
    bulbHit.addEventListener('pointerup', endBulbHold);
    bulbHit.addEventListener('pointercancel', endBulbHold);

    /* ---------- SECRET ENDING #2: drag the sleep mask onto Noodle's eyes ---------- */
    let maskGrab = null;
    I.drag(mask, svg, {
      onStart(pt) {
        if (ctx.locked || st.done) return;
        const m = /translate\(([-\d.]+),([-\d.]+)/.exec(mask.getAttribute('transform'));
        maskGrab = { dx: pt.x - parseFloat(m[1]), dy: pt.y - parseFloat(m[2]) };
        A.play('tap');
      },
      onMove(pt) {
        if (!maskGrab) return;
        const x = pt.x - maskGrab.dx, y = pt.y - maskGrab.dy;
        mask.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${U.clamp((x - MASK0.x) * 0.08, -14, 14).toFixed(1)})`);
      },
      onEnd(pt) {
        if (!maskGrab) return;
        maskGrab = null;
        if (Math.hypot(pt.x - ND.x, pt.y - (ND.y - 20)) < 64) {
          maskEnding();
        } else {
          const m = /translate\(([-\d.]+),([-\d.]+)/.exec(mask.getAttribute('transform'));
          const x0 = parseFloat(m[1]), y0 = parseFloat(m[2]);
          A.play('swish');
          U.tween(420, (t) => {
            if (!alive() || st.done) return;
            mask.setAttribute('transform', `translate(${U.lerp(x0, MASK0.x, t).toFixed(1)},${U.lerp(y0, MASK0.y, t).toFixed(1)})`);
          }, U.ease.outBack);
        }
      },
      onTap() {
        maskGrab = null;
        if (ctx.locked || st.done) return;
        A.play('squeak'); U.replay(maskIn, 'hop');
        ctx.say('A cozy sleep mask. Doesn’t turn off the light… or does it?');
      },
    });

    async function maskEnding() {
      if (st.done || !alive()) return;
      st.done = true; ctx.locked = true;
      mask.style.display = 'none';
      ndWear.innerHTML = `<g class="fb popin" transform="translate(0,-10) scale(.92)">${maskArt()}</g>`;
      setFace('closed', 'grin'); setArms('relax');
      A.play('pop'); U.haptic(25);
      await U.wait(280);
      A.play('boing');
      talk('Dark enough for me!', 2400);
      ctx.say('Technically… the light is still on. I’ll allow it.', 2600);
      // peaceful Z's under the blazing spotlight
      for (let i = 0; i < 3 && alive(); i++) {
        const z = U.svgEl('text', { x: ND.x + 28 + i * 10, y: ND.y - 44, 'font-family': '"Lilita One", sans-serif', 'font-size': 18 - i * 2, fill: '#fff', stroke: INK, 'stroke-width': 2.4, 'paint-order': 'stroke' }, fx);
        z.textContent = 'Z';
        U.tween(1300, (t) => {
          if (!alive()) return;
          z.setAttribute('y', (ND.y - 44 - 50 * t).toFixed(1));
          z.setAttribute('opacity', (1 - t).toFixed(2));
        }, U.ease.linear).then(() => z.remove());
        await U.wait(280);
      }
      await U.wait(700);
      if (alive()) ctx.win('mask');
    }

    /* ---------- DECOY: Useless Machine fake wall switch ---------- */
    async function fakeSwitchTap() {
      if (st.fakeBusy || st.fakeFallen || st.done) return;
      st.fakeTaps++;
      ctx.attempt();
      if (st.fakeTaps >= 3) {
        st.fakeFallen = true;
        A.play('crash'); U.haptic(45);
        decoyMsg.setAttribute('opacity', '1');
        await U.tween(620, (t) => {
          if (!alive()) return;
          fakeSwitch.setAttribute('transform', `translate(${(64 + 10 * t).toFixed(1)},${(278 + 206 * t).toFixed(1)})`);
          fakeRot.setAttribute('transform', `rotate(${(118 * t).toFixed(1)})`);
        }, U.ease.outBounce);
        ctx.say('Okay, THAT was definitely a decoy.');
        return;
      }
      st.fakeBusy = true;
      A.play('click');
      fakeToggle.setAttribute('y', '0');
      dark.setAttribute('opacity', '0.62');
      beam.setAttribute('opacity', '0.15');
      await U.wait(280);
      if (!alive() || st.done) { st.fakeBusy = false; return; }
      // cheeky mechanical finger pops out and flips it right back ON!
      hatch.setAttribute('opacity', '1');
      await U.tween(170, (t) => finger.setAttribute('transform', `translate(${(-10 * t).toFixed(1)},0)`), U.ease.outBack);
      if (!alive() || st.done) { st.fakeBusy = false; return; }
      A.play('click'); U.haptic(20);
      fakeToggle.setAttribute('y', '-11');
      dark.setAttribute('opacity', '0');
      beam.setAttribute('opacity', '1');
      await U.tween(160, (t) => finger.setAttribute('transform', `translate(${(-10 * (1 - t)).toFixed(1)},0)`));
      hatch.setAttribute('opacity', '0');
      ctx.say(st.fakeTaps === 1 ? 'Nope. It turned itself right back on.' : 'Very stubborn switch. Look somewhere else.');
      st.fakeBusy = false;
    }

    /* ---------- main animation loop: pendulum bulb, moth orbit, hold-to-smother ---------- */
    const t0 = performance.now();
    let last = t0;
    (function loop(now) {
      if (!alive()) return;
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      const t = (now - t0) / 1000;

      // bulb pendulum physics
      st.swingV += (-16 * st.swing - 3.6 * st.swingV) * dt;
      st.swing += st.swingV * dt;
      if (Math.abs(st.swing) > 0.05 || Math.abs(st.swingV) > 0.05) {
        bulbPivot.setAttribute('transform', `translate(195,-150) rotate(${st.swing.toFixed(2)})`);
      }

      if (st.lightOn) {
        // pulsing light rays
        const rs = 1 + 0.06 * Math.sin(t * 7);
        $('rays').setAttribute('transform', `scale(${rs.toFixed(3)})`);

        // moth orbiting the bulb
        const r = st.mothScared > 0 ? 78 : 42;
        if (st.mothScared > 0) st.mothScared = Math.max(0, st.mothScared - dt);
        const mx = BULB.x + Math.sin(t * 2.2) * r;
        const my = BULB.y + Math.sin(t * 4.4) * 16;
        moth.setAttribute('transform', `translate(${mx.toFixed(1)},${my.toFixed(1)}) rotate(${(Math.cos(t * 2.2) * 18).toFixed(1)})`);
      }

      // hold-to-smother on desktop (no motion sensors)
      if (hold && !st.done) {
        const held = (now - hold.t0) / 1000;
        if (I.hasMotion) {
          if (held > 0.35 && !hold.warnedSensor) {
            hold.warnedSensor = true;
            A.play('ouch'); U.haptic(50);
            burst('HOT!', BULB.x, BULB.y + 10, '#FF8FB1');
            ctx.say('Too hot to cover by hand! Flip something bigger…');
          }
        } else if (held > 0.18) {
          hold.smothering = true;
          const p = U.clamp((held - 0.18) / 1.1, 0, 1);
          dark.setAttribute('opacity', (p * 0.8).toFixed(3));
          holdRing.setAttribute('opacity', '0.9');
          holdRing.setAttribute('stroke-dashoffset', (264 * (1 - p)).toFixed(1));
          if (p >= 1) { hold = null; turnOffLights('flip', 'hold'); }
        }
      }

      if (!st.done && now - st.lastTouch > 8000) {
        st.lastTouch = now;
        ctx.say(U.pick([
          'Psst… the switch is behind something you never touch.',
          'The game is called BrainFLIP…',
          'Stuck? The bulb up top can help.',
        ]));
      }
      requestAnimationFrame(loop);
    })(t0);
    svg.addEventListener('pointerdown', () => { st.lastTouch = performance.now(); });

    /* ---------- reactions (no dead taps!) ---------- */
    const complaints = ['MY EYES! Turn it OFF!', 'It’s 3 AM!', 'I can see through my eyelids!', 'Too bright!!'];
    const taps = {
      realSwitch() {
        if (!isSwitchUncovered()) return;
        turnOffLights('switch', 'tap');
      },
      fakeSwitch: fakeSwitchTap,
      bulb() {
        st.swingV += (Math.random() < 0.5 ? 1 : -1) * 32;
        A.play('ouch'); U.haptic(45);
        burst('HOT!', BULB.x, BULB.y + 10, '#FF8FB1');
        ctx.say(I.hasMotion ? 'OW! Way too hot to touch!' : 'OW! Hot! (Unless you really hold it down…)');
        ctx.attempt();
      },
      moth() {
        st.mothScared = 1.6;
        A.play('squeak');
        ctx.say('Moth says: “LÄMP! Don’t you dare turn it off!”');
        ctx.attempt();
      },
      noodle() {
        const n = count('noodle');
        A.play('wobble'); U.replay(ndBoil, 'wiggle');
        talk(complaints[(n - 1) % complaints.length]);
        ctx.attempt();
      },
      window() { A.play('tap'); ctx.say('It’s already night outside! The sun isn’t the problem this time.'); ctx.attempt(); },
      poster(node) { A.play('wobble'); U.replay(node, 'wiggle'); ctx.say('$999 electric bill?! Hurry up and turn it off!'); ctx.attempt(); },
      stars() { A.play('tap'); ctx.say('Glow-in-the-dark stickers. Way too bright to see them.'); },
      outlet() { A.play('bonk'); ctx.say('Super-glued in. And that’s just the toaster.'); ctx.attempt(); },
      chair() { A.play('tap'); ctx.say('Comfy chair, blinding room.'); ctx.attempt(); },
      nightstand() { A.play('tap'); ctx.say('Just bedtime stuff.'); ctx.attempt(); },
      water() { A.play('squeak'); ctx.say('Water and electricity? Bad idea.'); ctx.attempt(); },
      rug() { A.play('tap'); ctx.say('Nothing hidden under the rug.'); ctx.attempt(); },
      wall() { A.play('bonk'); ctx.say(U.pick(['Nope.', 'Think outside the screen.', 'Look behind what you never touch.'])); ctx.attempt(); },
      floor() { taps.wall(); },
    };
    I.taps(svg, (name, node) => { if (ctx.locked || st.done) return; if (taps[name]) taps[name](node); });
  }

  BF.levels = BF.levels || {};
  BF.levels[4] = L;
})(window.BF);

</script>
<script>
/* Brainflip — Level 5 (per GDD v0.1): "Get the cookie jar!"
   Main ending : turn the phone upside down — gravity flips and the jar + Noodle meet at the ceiling!
                 (desktop / no-sensor fallback: drag or double-tap the "THIS SIDE UP ↑" sign upside down, or dev key U)  (verb: upside-down flip)
   Secret #1   : stack the 3 heavy books under the shelf so Noodle climbs up to grab the jar  (verb: stack / drag)
   Secret #2   : unscrew both bolts holding up the high wall shelf so it collapses right into Noodle's arms  (verb: inspect / tap)
   Decoys: Noodle jumping futilely, bolted kitchen counter, kitchen clock, mouse hole, height chart. */
(function (BF) {
  'use strict';
  const U = BF.U, A = BF.audio, I = BF.input, ART = BF.art;
  const INK = '#1B1B2F', YELLOW = '#FFC93C', PINK = '#FF5D8F', MINT = '#3DDC97', SKY = '#5BC0EB';
  const W = 'stroke-linecap="round" stroke-linejoin="round"';
  const S = `stroke="${INK}" stroke-width="3.4" ${W}`;

  const ND0 = { x: 195, y: 416 };
  const SHELF_Y = 194;
  const JAR0 = { x: 198, y: 146 };
  const SCREW_L = { x: 146, y: 214 };
  const SCREW_R = { x: 250, y: 214 };
  const SIGN_NAIL = { x: 328, y: 146 };
  const STACK_X = 198;
  const STACK_BASE = 488;

  const BOOKS = [
    { id: 0, x0: 76, y0: 518, w: 96, h: 34, fill: SKY, spine: '#3AA6D4', title: 'BIG BOOK', pages: '#FFF9EC' },
    { id: 1, x0: 330, y0: 398, w: 88, h: 32, fill: PINK, spine: '#E04274', title: 'COOKBOOK', pages: '#FFF9EC' },
    { id: 2, x0: 312, y0: 518, w: 94, h: 30, fill: MINT, spine: '#28BA7B', title: 'GRAVITY 101', pages: '#FFF9EC' },
  ];

  function cookie(x, y, r = 11) {
    return `<g transform="translate(${x},${y})">` +
      `<circle r="${r}" fill="#E69B49" stroke="${INK}" stroke-width="2.2"/>` +
      `<circle cx="${-r * 0.35}" cy="${-r * 0.2}" r="2" fill="#4E2A14"/>` +
      `<circle cx="${r * 0.3}" cy="${-r * 0.3}" r="1.8" fill="#4E2A14"/>` +
      `<circle cx="${r * 0.1}" cy="${r * 0.35}" r="2.1" fill="#4E2A14"/>` +
      `<circle cx="${-r * 0.25}" cy="${r * 0.3}" r="1.6" fill="#4E2A14"/></g>`;
  }

  function jarSVG() {
    return `
      <!-- domed lid + knob -->
      <circle cx="0" cy="-55" r="8.5" fill="${PINK}" ${S}/>
      <rect x="-26" y="-48" width="52" height="14" rx="6" fill="${PINK}" ${S}/>
      <!-- glass jar body -->
      <rect x="-34" y="-34" width="68" height="72" rx="16" fill="#E6F8FF" ${S}/>

  function build(ctx) {

    const talk = (text, ms = 1800, ax = st.ndX, ay = st.ndY - 64) => ctx.talk(talkLayer, ax, ay, text, ms, 0.5);

    function burst(text, x, y, color = YELLOW) {
      const g = U.svgEl('g', { transform: `translate(${x},${y})` }, fx);
      const inner = U.svgEl('g', { class: 'fb popin' }, g);
      let d = '';
      for (let i = 0; i < 16; i++) { const a = (i / 16) * Math.PI * 2, r = i % 2 ? 20 : 32; d += `${i ? 'L' : 'M'}${(Math.cos(a) * r * 1.48).toFixed(1)},${(Math.sin(a) * r).toFixed(1)} `; }
      U.svgEl('path', { d: d + 'Z', fill: color, stroke: INK, 'stroke-width': 3, 'stroke-linejoin': 'round' }, inner);
      const t = U.svgEl('text', { y: 6, 'text-anchor': 'middle', 'font-family': '"Lilita One", sans-serif', 'font-size': 15.5, fill: INK }, inner);
      t.textContent = text;

        const sx = t < 0.15 ? 1.12 : 1 - arc * 0.08;
        const sy = t < 0.15 ? 0.88 : 1 + arc * 0.1;
        nd.setAttribute('transform', `translate(${st.ndX.toFixed(1)},${y.toFixed(1)}) scale(${sx.toFixed(3)},${sy.toFixed(3)})`);
      }, U.ease.linear);

    /* ---------- MAIN ENDING: Brainflip! (Turn phone upside down, OR flip "THIS SIDE UP" sign on desktop) ---------- */
    async function upsideDownEnding(src) {
      if (st.done || !alive()) return;

      A.play('flip'); A.play('whoosh');

        const p = U.svgEl('path', { d: `M${lx},440 V310`, stroke: '#fff', 'stroke-width': 4, 'stroke-linecap': 'round', opacity: 0.75 }, fx);
        U.tween(680, (t) => {

          p.setAttribute('transform', `translate(0,${(-260 * t).toFixed(1)})`);
          p.setAttribute('opacity', (0.75 * (1 - t)).toFixed(2));
        }).then(() => p.remove());
        return p;
      });
      void lines;

      // Books float & tumble upward to the ceiling!
      bookState.forEach((b, idx) => {
        const el = bookEls[idx];
        const x0 = b.x, y0 = b.y;
        const tx = [62, 318, 320][idx], ty = [26, 24, 55][idx], rot = [170, -174, 185][idx];
        U.tween(720 + idx * 70, (t) => {
          if (!alive()) return;
          el.setAttribute('transform', `translate(${U.lerp(x0, tx, t).toFixed(1)},${U.lerp(y0, ty, t).toFixed(1)}) rotate(${(rot * t).toFixed(1)})`);
        }, U.ease.outBounce);
      });

      // Noodle yells WHOAAA!, flips 180°, and falls UP onto the ceiling right beside the falling cookie jar!
      setFace('wide', 'bigO'); setArms('up');
      talk('WHOAAA!!', 700);
      const nx0 = st.ndX, ny0 = st.ndY;
      const jm = /translate\(([-\d.]+),([-\d.]+)/.exec(jar.getAttribute('transform'));
      const jx0 = jm ? parseFloat(jm[1]) : JAR0.x, jy0 = jm ? parseFloat(jm[2]) : JAR0.y;

      await U.tween(780, (t) => {
        if (!alive()) return;
        const ny = U.lerp(ny0, 82, t), nx = U.lerp(nx0, 168, t);
        const nr = 180 * Math.min(1, t * 1.45);

        const jy = U.lerp(jy0, 108, t), jx = U.lerp(jx0, 236, t);

        jar.setAttribute('transform', `translate(${jx.toFixed(1)},${jy.toFixed(1)}) rotate(${jr.toFixed(1)})`);

      talkLayer.innerHTML = '';
      const bg = U.svgEl('g', { class: 'fb-top popin' }, talkLayer);
      U.svgEl('path', { d: 'M162,232 L170,214 L178,232 Z', fill: '#fff', stroke: INK, 'stroke-width': 3, 'stroke-linejoin': 'round' }, bg);
      U.svgEl('rect', { x: 46, y: 230, width: 298, height: 36, rx: 16, fill: '#fff', stroke: INK, 'stroke-width': 3 }, bg);
      U.svgEl('rect', { x: 164, y: 229, width: 12, height: 6, fill: '#fff' }, bg);
      const bt = U.svgEl('text', { x: 195, y: 253.5, 'text-anchor': 'middle', 'font-family': 'Fredoka, sans-serif', 'font-weight': 600, 'font-size': 15.5, fill: INK }, bg);
