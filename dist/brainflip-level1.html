:root {
  --ink: #1B1B2F;
  --paper: #FFF4E0;
  --paper-dot: #EAD8B8;
  --yellow: #FFC93C;
  --pink: #FF5D8F;
  --mint: #3DDC97;
  --sky: #5BC0EB;
  --night: #2B2D6E;
  --orange: #FF6B35;
  --muted: #6E6680;
  --display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --ui: "Fredoka", "Nunito", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
html, body { position: fixed; inset: 0; width: 100%; } /* no rubber-band scrolling on iOS */
body {
  background-color: var(--paper);
  background-image: radial-gradient(var(--paper-dot) 1.3px, transparent 1.4px);
  background-size: 22px 22px;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  font-family: var(--ui);
  color: var(--ink);
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.hidden { display: none !important; }
.bf-defs { position: absolute; width: 0; height: 0; overflow: hidden; }

/* ---------- stage: fixed 390x780 design canvas scaled to fit ---------- */
#stage {
  position: absolute; left: 50%; top: 50%;
  width: 390px; height: 780px;
  transform-origin: 50% 50%;
  overflow: hidden;
  background-color: var(--paper);
  background-image: radial-gradient(var(--paper-dot) 1.3px, transparent 1.4px);
  background-size: 22px 22px;
}
body.desk #stage { border: 4px solid var(--ink); border-radius: 38px; box-shadow: 12px 12px 0 var(--ink); }
.desk-note { display: none; }
body.desk .desk-note {
  display: block; position: absolute; left: 0; right: 0; bottom: 14px; margin: 0;
  text-align: center; font-weight: 600; font-size: 15px; color: var(--muted);
}
.screen { position: absolute; inset: 0; }

/* ---------- buttons ---------- */
.btn {
  font-family: var(--display); font-size: 24px; letter-spacing: .5px;
  background: #fff; border: 3.5px solid var(--ink); border-radius: 18px;
  padding: 10px 22px; box-shadow: 0 6px 0 var(--ink);
  transition: transform .06s, box-shadow .06s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.btn-pink { background: var(--pink); color: #fff; -webkit-text-stroke: 1.2px var(--ink); paint-order: stroke fill; }
.btn-yellow { background: var(--yellow); }
.btn-mint { background: var(--mint); }
.btn-big { font-size: 34px; padding: 12px 54px; border-radius: 22px; box-shadow: 0 8px 0 var(--ink); }
.btn-big:active { box-shadow: 0 3px 0 var(--ink); transform: translateY(5px); }
.btn-round {
  width: 50px; height: 50px; border-radius: 50%; padding: 0;
  display: grid; place-items: center;
  background: #fff; border: 3.5px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
  position: relative;
}
.btn-round:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn-round svg { width: 28px; height: 28px; }
.btn-hint { background: var(--yellow); }
.badge {

window.BF = window.BF || {};
(function (BF) {
  'use strict';
  const U = {};

  U.$ = (sel, root) => (root || document).querySelector(sel);

    isProd: Boolean(window.BF_PROD),
  };

  /** Safe bridge to native Android MainActivity methods (falls back cleanly on web/desktop). */
  BF.native = {
    isAndroidApp() {
      return Boolean(window.BF_ANDROID && typeof window.BF_ANDROID.openStoreReview === 'function');
    },
    openStoreReview() {
      try {
        if (window.BF_ANDROID && window.BF_ANDROID.openStoreReview) {
          window.BF_ANDROID.openStoreReview();
          return true;
        }
      } catch (e) { /* fallback to web */ }
      try { window.open(STORE_URL, '_blank', 'noopener'); } catch (e) { /* ignore */ }
      return false;
    },
    requestInAppReview() {
      try {
        if (window.BF_ANDROID && window.BF_ANDROID.requestInAppReview) {
          window.BF_ANDROID.requestInAppReview();
          return true;
        }
      } catch (e) { /* ignore */ }
      return false;
    },
    openExternal(url) {
      try {
        if (window.BF_ANDROID && window.BF_ANDROID.openExternal) {
          window.BF_ANDROID.openExternal(url);
          return true;
        }
      } catch (e) { /* fallback to web */ }
      try { window.open(url, '_blank', 'noopener'); } catch (e) { /* ignore */ }
      return false;
    },
    async share(title, text, url) {
      const full = url ? `${text}\n${url}` : text;
      try {
        if (window.BF_ANDROID && window.BF_ANDROID.shareText) {
          window.BF_ANDROID.shareText(title, full);
          return 'native';
        }
      } catch (e) { /* fallback to web share */ }
      try {
        if (navigator.share) {

(function (BF) {
  'use strict';

  function unlock() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;

    if (!ctx) return;

      ctx.resume().catch(() => {});

    if (ctx && ctx.state === 'running') ctx.suspend().catch(() => {});

      const target = s.target; s = null;
      if (moved > 10 || target.closest('[data-drag]')) return;
      const hit = target.closest('[data-tap]');
      if (hit) handler(hit.getAttribute('data-tap'), hit, e);
    });
  }

  /* ---------- shake detection ----------
     |acceleration| deviating from gravity by > JOLT m/s², 3 jolts inside 1.1 s = a shake. */
  const JOLT = 9.5, WINDOW = 1100, NEED = 3;
  const shakeFns = new Set(), joltFns = new Set(), flipFns = new Set(), upsideFns = new Set(), volDownFns = new Set(), blowFns = new Set();
  let motionSeen = false, lastJolt = 0, jolts = [];

  /* ---------- tilt: in-screen-plane angle, + = right edge down ----------
     From gravity when the phone is held up (works upright too); from gamma when it lies flat.
     Android reports the gravity reaction (y>0 upright), iOS the opposite sign: both handled. */
  let tiltDeg = 0, tiltOverride = null, lastGravityTilt = 0;
  let faceDown = false, faceDownSince = 0, flipFired = false, lastOrientFlip = 0;
  let upsideDown = false, upsideSince = 0, upsideFired = false, lastOrientUp = 0, upProgress = 0;
  let zSign = 0, ySign = 0; // learned upright/face-up signs for accelerometer-only fallback

  function gravityTilt(g) {
    if (!g || g.x == null || Math.hypot(g.x, g.y) < 3) return null;
    const a = g.y >= 0 ? Math.atan2(-g.x, g.y) : Math.atan2(g.x, -g.y);
    return (a * 180) / Math.PI;
  }

  function updateFaceDown(down, now) {
    if (document.hidden) { faceDownSince = 0; return; }
    faceDown = down;
    if (down) {
      if (!faceDownSince) faceDownSince = now;
      if (!flipFired && now - faceDownSince >= 420) {
        flipFired = true;
        flipFns.forEach((f) => f('sensor'));
      }
    } else {
      faceDownSince = 0;
      flipFired = false;
    }
  }

  function updateUpsideDown(upZ, now) {
    if (document.hidden) { upsideSince = 0; upProgress = 0; return; }
    // upZ = world-Z component of phone's +Y (top) axis: +1 upright, 0 flat/sideways, -1 upside down
    upProgress = U.clamp((-upZ - 0.15) / 0.65, 0, 1);
    const inv = upZ < -0.68;
    upsideDown = inv;
    if (inv) {
      if (!upsideSince) upsideSince = now;
      if (!upsideFired && now - upsideSince >= 360) {
        upsideFired = true;
        upsideFns.forEach((f) => f('sensor'));
      }
    } else {
      upsideSince = 0;
      upsideFired = false;
    }
  }

  window.addEventListener('deviceorientation', (e) => {
    if (e.gamma == null) return;
    // Ignore dummy all-zero events fired once by some desktop browsers without sensors
    const hasSignal = Math.abs(e.gamma) > 0.01 || Math.abs(e.beta || 0) > 0.01 || Math.abs(e.alpha || 0) > 0.01;
    if (!hasSignal) return;
    motionSeen = true;
    const now = performance.now();
    if (now - lastGravityTilt >= 400) tiltDeg = e.gamma;
    // Exact world-Z components under W3C Z-X'-Y'' Euler angles:
    // screen normal = cos(beta)*cos(gamma); screen +Y (top edge) = sin(beta)
    if (e.beta != null) {
      const bRad = (e.beta * Math.PI) / 180;
      const gRad = (e.gamma * Math.PI) / 180;
      const nz = Math.cos(bRad) * Math.cos(gRad);
      lastOrientFlip = now;
      updateFaceDown(nz < -0.65, now);
      lastOrientUp = now;
      updateUpsideDown(Math.sin(bRad), now);
    }
  });

  function onMotion(e) {
    if (document.hidden) return;
    let dev = null;
    const g = e.accelerationIncludingGravity, a = e.acceleration;
    const now = performance.now();
    if (g && g.x != null && g.y != null && g.z != null) {
      const mag = Math.hypot(g.x, g.y, g.z);
      // Reject zeroed dummy readings so desktop/sandboxed frames never fake sensors or trigger false shakes
      if (mag > 1.0) {
        motionSeen = true;
        const gt = gravityTilt(g);
        if (gt !== null) { tiltDeg = gt; lastGravityTilt = now; }
        updateLandscape(g.x, g.y, g.z, now);
        dev = Math.abs(mag - 9.81);
        // Accelerometer-only fallbacks when deviceorientation isn't providing beta/gamma
        if (!zSign && Math.abs(g.z) > 4) zSign = Math.sign(g.z);
        if (zSign && now - lastOrientFlip > 600) {
          updateFaceDown(g.z * zSign < -7.4 && Math.hypot(g.x, g.y) < 5.5, now);
        }
        if (!ySign && Math.abs(g.y) > 4.5) ySign = Math.sign(g.y);
        if (ySign && now - lastOrientUp > 600) {
          updateUpsideDown((g.y * ySign) / 9.81, now);
        }
      }
    }
    if (dev === null && a && a.x != null && a.y != null && a.z != null) {
      const amag = Math.hypot(a.x, a.y, a.z);
      if (amag > 0.05) { motionSeen = true; dev = amag; }
    }
    if (dev === null) return;
    if (dev > JOLT && now - lastJolt > 90) {
      lastJolt = now;
      jolts = jolts.filter((t) => now - t < WINDOW);
      jolts.push(now);
      joltFns.forEach((f) => f(jolts.length));
      if (jolts.length >= NEED) { jolts = []; shakeFns.forEach((f) => f('sensor')); }
    }
  }
  window.addEventListener('devicemotion', onMotion);

  /** iOS 13+ needs an explicit permission prompt from a user gesture. */
  async function requestMotion() {
    let ok = true;
    try {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        ok = (await DeviceMotionEvent.requestPermission()) === 'granted';
      }
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        await DeviceOrientationEvent.requestPermission();
      }
    } catch (e) { return false; }
    return ok;
  }

  /** Opt-in microphone blow detector (only started on explicit user action; always stopped on cleanup). */
  let micStream = null, micCtx = null, micRAF = 0, micActive = false;
  async function startMic() {
    if (micActive) return true;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      micCtx = new AC();
      const src = micCtx.createMediaStreamSource(micStream);
      const an = micCtx.createAnalyser();
      an.fftSize = 512;
      src.connect(an);
      const buf = new Uint8Array(an.fftSize);
      micActive = true;
      let loudSince = 0, lastBlow = 0;
      (function poll() {
        if (!micActive) return;
        an.getByteTimeDomainData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
        const rms = Math.sqrt(sum / buf.length);
        const now = performance.now();
        if (rms > 0.14 && !document.hidden) {
          if (!loudSince) loudSince = now;
          if (now - loudSince >= 170 && now - lastBlow > 900) {
            lastBlow = now; loudSince = 0;
            blowFns.forEach((f) => f('mic'));
          }
        } else {
          loudSince = 0;
        }
        micRAF = requestAnimationFrame(poll);
      })();
      return true;
    } catch (e) {
      stopMic();
      return false;
    }
  }
  function stopMic() {
    micActive = false;
    if (micRAF) { cancelAnimationFrame(micRAF); micRAF = 0; }
    if (micStream) { try { micStream.getTracks().forEach((t) => t.stop()); } catch (e) { /* ignore */ } micStream = null; }
    if (micCtx) { try { micCtx.close(); } catch (e) { /* ignore */ } micCtx = null; }
  }

  /* ---------- landscape / sideways detection ----------
     When the player turns the phone 90° the gravity vector moves into the phone's X axis.
     We only *detect* it: the UI stays portrait so the puzzle scene can react (a cloud slides off). */
  const landFns = new Set();
  let landProgress = 0, landSince = 0, landFired = false, landOverride = 0;
  function updateLandscape(px, py, pz, now) {
    if (document.hidden) { landSince = 0; landProgress = 0; return; }
    const mag = Math.hypot(px, py, pz);
    if (mag < 4) return; // flat on a table or a zeroed dummy reading
    const side = Math.abs(px) / mag;
    landProgress = U.clamp((side - 0.55) / 0.35, 0, 1);
    const on = landProgress > 0.85 && Math.abs(py) / mag < 0.6;
    if (on) {
      if (!landSince) landSince = now;
      if (!landFired && now - landSince >= 380) {
        landFired = true;
        landFns.forEach((f) => f(Math.sign(px) || 1, 'sensor'));
      }
    } else {
      landSince = 0;
      landFired = false;
    }
  }

  /* ---------- charging state (real device, opt-in: no permission needed) ----------
     We only react to a *transition* into charging (the player actually plugged the cable in).
     The state at page load is recorded silently, so a phone that was already on a charger
     — or a plugged-in laptop — never auto-wins the level. */
  const powerFns = new Set();
  let charging = false, batteryLevel = null, powerStarted = false, powerReady = false;
  function setCharging(v, src) {
    const next = !!v;
    if (next === charging) return;
    charging = next;
    if (!powerReady) return; // bootstrap reading: remember it, don't fire
    powerFns.forEach((f) => { try { f(charging, src); } catch (e) { /* ignore */ } });
  }
  async function startPower() {
    if (powerStarted) return charging;
    powerStarted = true;
    try {
      if (navigator.getBattery) {
        const b = await navigator.getBattery();
        batteryLevel = b.level;
        charging = !!b.charging;   // silent: this is the baseline, not an event
        powerReady = true;
        const upd = () => { batteryLevel = b.level; setCharging(b.charging, 'battery'); };
        b.addEventListener('chargingchange', upd);
        b.addEventListener('levelchange', upd);
      } else {
        powerReady = true;
      }
    } catch (e) { powerReady = true; /* unsupported webview: the in-game plug still works */ }
    return charging;
  }
  // Native Android bridge (MainActivity battery BroadcastReceiver) calls this hook
  window.BF_NATIVE_CHARGING = (v) => {
    if (v) { powerReady = true; setCharging(true, 'native'); }
    else setCharging(false, 'native');
    return true;
  };

  /* ---------- app leave & return (visibilitychange — Level 11!) ---------- */
  const appReturnFns = new Set();
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      hiddenAt = performance.now();
    } else if (hiddenAt) {
      const awayMs = performance.now() - hiddenAt;
      hiddenAt = 0;
      if (awayMs >= 1000) {
        appReturnFns.forEach((f) => { try { f(awayMs, 'visibility'); } catch (e) { /* ignore */ } });
      }
    }
  });

  BF.input = {
    drag, taps, requestMotion, startMic, stopMic, startPower,
    onShake(f) { shakeFns.add(f); return () => shakeFns.delete(f); },
    onJolt(f) { joltFns.add(f); return () => joltFns.delete(f); },
    onFlip(f) { flipFns.add(f); return () => flipFns.delete(f); },
    onUpsideDown(f) { upsideFns.add(f); return () => upsideFns.delete(f); },
    onVolumeDown(f) { volDownFns.add(f); return () => volDownFns.delete(f); },
    onBlow(f) { blowFns.add(f); return () => blowFns.delete(f); },
    onLandscape(f) { landFns.add(f); return () => landFns.delete(f); },
    onPower(f) { powerFns.add(f); return () => powerFns.delete(f); },
    onAppReturn(f) { appReturnFns.add(f); return () => appReturnFns.delete(f); },
    get hasMotion() { return motionSeen || tiltOverride !== null; },
    get isFaceDown() { return faceDown; },
    get isUpsideDown() { return upsideDown; },
    get upProgress() { return upProgress; },
    get micActive() { return micActive; },
    /** 0 = held upright, 1 = turned fully sideways (landscape). */
    get landscapeProgress() { return landOverride ? 1 : landProgress; },
    get isLandscape() { return landProgress > 0.85 || !!landOverride; },
    get isCharging() { return charging; },
    get batteryLevel() { return batteryLevel; },
    /** current tilt in degrees, + = right edge of the phone down */
    get tilt() { return tiltOverride !== null ? tiltOverride : tiltDeg; },
    simulateTilt(d) { tiltOverride = d; },
    simulateShake() { shakeFns.forEach((f) => f('debug')); },
    simulateFlip() { flipFns.forEach((f) => f('debug')); },
    simulateUpsideDown(src = 'debug') { upsideFns.forEach((f) => f(src)); },
    simulateVolumeDown(src = 'debug') { volDownFns.forEach((f) => f(src)); },
    simulateBlow(src = 'debug') { blowFns.forEach((f) => f(src)); },
    simulateLandscape(dir = 1) {
      landOverride = dir || 1;
      landProgress = 1;
      landFns.forEach((f) => f(dir || 1, 'debug'));
    },
    clearLandscape() { landOverride = 0; landProgress = 0; landSince = 0; landFired = false; },
    simulateCharging(v = true) {
      powerReady = true;
      if (v) charging = false; // force a real transition so listeners fire
      setCharging(v, 'debug');
    },
    simulateAppReturn(awayMs = 5000) {
      appReturnFns.forEach((f) => { try { f(awayMs, 'debug'); } catch (e) { /* ignore */ } });
    },
  };
  // Native Android bridge (MainActivity.java KEYCODE_VOLUME_DOWN) calls this hook when available
  window.BF_VOLUME_DOWN = () => {
    volDownFns.forEach((f) => f('hardware'));
    return volDownFns.size > 0;
  };
})(window.BF);

</script>
<script>
/* Brainflip — Noodle, the mascot. Pure SVG strings so the same art feeds the game,
   the ending stickers and the style board.
   Body coords: a 76x104 bean centred on (0,0).  Face coords: centred on the face anchor. */
(function (BF) {
  'use strict';
  const INK = '#1B1B2F';
  const YELLOW = '#FFC93C';
  const HAIR = '#FFE6A0';
  const CHEEK = '#FF8FB1';
  const W = 'stroke-linecap="round" stroke-linejoin="round"';

  const EYES = {
    open: (x, y) => `<circle cx="${x}" cy="${y}" r="9.5" fill="#fff" stroke="${INK}" stroke-width="3"/><circle cx="${x + 1.5}" cy="${y + 1}" r="4.6" fill="${INK}"/><circle cx="${x + 3.2}" cy="${y - 1.2}" r="1.6" fill="#fff"/>`,
    closed: (x, y) => `<path d="M${x - 7},${y - 1} Q${x},${y + 6} ${x + 7},${y - 1}" fill="none" stroke="${INK}" stroke-width="3.2" ${W}/>`,
    happy: (x, y) => `<path d="M${x - 7},${y + 3} Q${x},${y - 7} ${x + 7},${y + 3}" fill="none" stroke="${INK}" stroke-width="3.4" ${W}/>`,
    squint: (x, y) => `<path d="M${x - 7},${y + 1} L${x + 7},${y - 1}" fill="none" stroke="${INK}" stroke-width="3.4" ${W}/>`,
    wide: (x, y) => `<circle cx="${x}" cy="${y}" r="11" fill="#fff" stroke="${INK}" stroke-width="3"/><circle cx="${x}" cy="${y}" r="2.8" fill="${INK}"/>`,
    spiral: (x, y) => `<circle cx="${x}" cy="${y}" r="10.5" fill="#fff" stroke="${INK}" stroke-width="3"/><path d="M${x - 1},${y} a1.5,1.5 0 1,1 3,0 a3,3 0 1,1 -6,0 a4.5,4.5 0 1,1 9,0 a6,6 0 1,1 -12,0" fill="none" stroke="${INK}" stroke-width="1.8"/>`,
    wink: (x, y, side) => side < 0 ? EYES.open(x, y) : EYES.happy(x, y),
  };

  const MOUTHS = {
    smile: (x, y) => `<path d="M${x - 8},${y} Q${x},${y + 8} ${x + 8},${y}" fill="none" stroke="${INK}" stroke-width="3.2" ${W}/>`,
    grin: (x, y) => `<path d="M${x - 10},${y - 2} Q${x},${y + 15} ${x + 10},${y - 2} Z" fill="${INK}" stroke="${INK}" stroke-width="2.5" ${W}/><path d="M${x - 5},${y + 6.5} Q${x},${y + 2.5} ${x + 5},${y + 6.5} Q${x},${y + 10} ${x - 5},${y + 6.5}Z" fill="${CHEEK}"/>`,
    o: (x, y) => `<ellipse cx="${x}" cy="${y + 2}" rx="4.5" ry="5.5" fill="${INK}"/>`,
    bigO: (x, y) => `<ellipse cx="${x}" cy="${y + 3}" rx="7" ry="9" fill="${INK}"/><ellipse cx="${x}" cy="${y + 7}" rx="4" ry="3" fill="${CHEEK}"/>`,
    yawn: (x, y) => `<ellipse cx="${x}" cy="${y + 3}" rx="8" ry="10.5" fill="${INK}"/><ellipse cx="${x}" cy="${y + 8}" rx="5" ry="3.5" fill="${CHEEK}"/>`,
    sleep: (x, y) => `<ellipse cx="${x}" cy="${y + 1}" rx="3.6" ry="2.6" fill="${INK}"/>`,
    frown: (x, y) => `<path d="M${x - 7},${y + 4} Q${x},${y - 3} ${x + 7},${y + 4}" fill="none" stroke="${INK}" stroke-width="3.2" ${W}/>`,
    chatter: (x, y) => `<rect x="${x - 12}" y="${y - 5}" width="24" height="11" rx="4" fill="#fff" stroke="${INK}" stroke-width="2.6"/><path d="M${x - 10},${y + 1} l4,-4 l4,4 l4,-4 l4,4 l4,-4" fill="none" stroke="${INK}" stroke-width="2" ${W}/>`,
    flat: (x, y) => `<path d="M${x - 6},${y + 2} L${x + 6},${y + 2}" stroke="${INK}" stroke-width="3.2" ${W}/>`,
  };

  function face({ eyes = 'open', mouth = 'smile', blush = true } = {}) {
    let s = '';
    if (blush) s += `<ellipse cx="-24" cy="6" rx="6.5" ry="3.8" fill="${CHEEK}" opacity=".85"/><ellipse cx="24" cy="6" rx="6.5" ry="3.8" fill="${CHEEK}" opacity=".85"/>`;
    s += EYES[eyes](-13, -6, -1) + EYES[eyes](13, -6, 1);
    s += MOUTHS[mouth](0, 11);
    return s;
  }

  function arm(d, hx, hy, color) {
    return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="9" ${W}/><path d="${d}" fill="none" stroke="${color}" stroke-width="4" ${W}/><circle cx="${hx}" cy="${hy}" r="6.5" fill="${color}" stroke="${INK}" stroke-width="3"/>`;
  }

  /** Arms are drawn as stretchy noodles: ink outline + body-colour core. */
  function arms(type, color = YELLOW) {
    switch (type) {
      case 'wave': return arm('M33,-4 Q52,-10 55,-34', 55, -38, color) + arm('M-33,6 Q-46,20 -48,34', -48, 38, color);
      case 'up': return arm('M-31,-16 Q-50,-36 -47,-60', -47, -64, color) + arm('M31,-16 Q50,-36 47,-60', 47, -64, color);
      case 'hug': return arm('M-33,2 Q-8,26 18,12', 20, 10, color) + arm('M33,4 Q8,30 -16,18', -18, 16, color);
      case 'relax': return arm('M-33,4 Q-46,20 -47,36', -47, 40, color) + arm('M33,4 Q46,20 47,36', 47, 40, color);
      case 'reach': return arm('M-33,6 Q-52,14 -64,36', -64, 40, color) + arm('M33,4 Q46,20 47,36', 47, 40, color);
      case 'hold': return arm('M-33,6 Q-44,26 -22,30', -20, 30, color) + arm('M33,6 Q34,30 4,32', 2, 32, color);
      case 'shrug': return arm('M-33,0 Q-52,-6 -56,-22', -56, -26, color) + arm('M33,0 Q52,-6 56,-22', 56, -26, color);
      default: return '';
    }
  }

  function legs(color = YELLOW) {
    return `<path d="M-14,46 L-15,68 M14,46 L15,68" stroke="${INK}" stroke-width="4.5" ${W}/>` +
      `<ellipse cx="-20" cy="70" rx="10" ry="5.5" fill="${color}" stroke="${INK}" stroke-width="3"/>` +
      `<ellipse cx="20" cy="70" rx="10" ry="5.5" fill="${color}" stroke="${INK}" stroke-width="3"/>`;
  }

  const HAIR_D = 'M1,-51 C0,-62 -12,-68 -15,-60 C-18,-51 -5,-48 -3,-57 C-1,-66 10,-74 20,-66';
  function body({ color = YELLOW, pillId = '' } = {}) {
    return `<path d="${HAIR_D}" fill="none" stroke="${INK}" stroke-width="8" ${W}/>` +
      `<path d="${HAIR_D}" fill="none" stroke="${HAIR}" stroke-width="3.6" ${W}/>` +
      `<rect ${pillId ? `id="${pillId}"` : ''} x="-38" y="-52" width="76" height="104" rx="38" fill="${color}" stroke="${INK}" stroke-width="3.6"/>` +
      `<path d="M-26,-26 Q-30,-6 -26,14" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" opacity=".55"/>`;
  }

  /** Complete, static Noodle (title screen, stickers, style board). */
  function noodle({ x = 0, y = 0, rot = 0, scale = 1, eyes = 'open', mouth = 'smile', armType = 'none', withLegs = false, color = YELLOW, extra = '' } = {}) {
    return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${scale})">` +
      (withLegs ? legs(color) : '') + body({ color }) + arms(armType, color) +
      `<g transform="translate(0,-14)">${face({ eyes, mouth })}</g>${extra}</g>`;
  }

  BF.art = Object.assign(BF.art || {}, { noodle, noodleBody: body, noodleFace: face, noodleArms: arms, noodleLegs: legs, INK, YELLOW });
})(window.BF);

</script>
<script>
/* Brainflip — UI icons, the sun character and ending stickers (SVG strings). */
(function (BF) {
  'use strict';
  const INK = '#1B1B2F';
  const W = 'stroke-linecap="round" stroke-linejoin="round"';
  const svg = (vb, inner, extra = '') => `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" ${extra}>${inner}</svg>`;

  /* ---------- the sun (also a character: it sleeps, peeks, giggles) ---------- */
  function sunFace(mood) {
    const cheeks = `<ellipse cx="-15" cy="4" rx="5" ry="3" fill="#FF8FB1" opacity=".9"/><ellipse cx="15" cy="4" rx="5" ry="3" fill="#FF8FB1" opacity=".9"/>`;
    if (mood === 'sleep') return cheeks + `<path d="M-14,-9 Q-9,-4 -4,-9 M4,-9 Q9,-4 14,-9" fill="none" stroke="${INK}" stroke-width="2.8" ${W}/><ellipse cx="0" cy="6" rx="2.6" ry="2" fill="${INK}"/>`;
    if (mood === 'open') return cheeks + `<circle cx="-9" cy="-7" r="3.4" fill="${INK}"/><circle cx="9" cy="-7" r="3.4" fill="${INK}"/><ellipse cx="0" cy="7" rx="3.6" ry="4.2" fill="${INK}"/>`;
    return cheeks + `<path d="M-14,-5 Q-9,-13 -4,-5 M4,-5 Q9,-13 14,-5" fill="none" stroke="${INK}" stroke-width="2.8" ${W}/><path d="M-8,3 Q0,13 8,3 Z" fill="${INK}" stroke="${INK}" stroke-width="2" ${W}/>`;
  }
  function sunRays() {
    let s = '';
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2, a1 = a - 0.17, a2 = a + 0.17;
      const p = (r, t) => `${(Math.cos(t) * r).toFixed(1)},${(Math.sin(t) * r).toFixed(1)}`;
      s += `<path d="M${p(31, a1)} L${p(45, a)} L${p(31, a2)} Z" fill="#FFB23F" stroke="${INK}" stroke-width="2.6" ${W}/>`;
    }
    return s;
  }
  function sun(mood = 'happy', { spin = false } = {}) {

      `<circle r="27" fill="#FFD23F" stroke="${INK}" stroke-width="3.4"/>` +

  const landscape = svg('0 0 120 120', `<g transform="rotate(90 60 60)"><rect x="40" y="18" width="40" height="72" rx="9" fill="#fff" stroke="${INK}" stroke-width="4"/><rect x="47" y="28" width="26" height="48" rx="3" fill="#5BC0EB" stroke="${INK}" stroke-width="2.4"/><circle cx="60" cy="83" r="3" fill="${INK}"/></g><path d="M16,60 A44,44 0 0,1 60,18" fill="none" stroke="${INK}" stroke-width="4" ${W}/><path d="M52,12 L62,18 L54,26" fill="none" stroke="${INK}" stroke-width="4" ${W}/><path d="M104,60 A44,44 0 0,1 60,102" fill="none" stroke="${INK}" stroke-width="4" ${W}/><path d="M68,108 L58,102 L66,94" fill="none" stroke="${INK}" stroke-width="4" ${W}/>`);

  function sticker(bg, inner, id) {

      BF.art.noodle({ x: 0, y: 6, scale: 0.6, rot: -8, eyes: 'spiral', mouth: 'o', armType: 'up' }), 'qk' + uid),
    cold: (uid = 'a') => sticker('#BDE7FF',

      BF.art.noodle({ x: 0, y: 12, scale: 0.6, eyes: 'wide', mouth: 'chatter', armType: 'hug', color: '#A8DDF7' }), 'cd' + uid),
  };

  const cup = (x, y, s, fill = '#B5651D') => `<g transform="translate(${x},${y}) scale(${s})">` +
    `<path d="M20,-22 Q34,-22 32,-10 Q30,0 18,-2" fill="none" stroke="${INK}" stroke-width="7" ${W}/><path d="M20,-22 Q34,-22 32,-10 Q30,0 18,-2" fill="none" stroke="#fff" stroke-width="3" ${W}/>` +
    `<path d="M-24,-30 H24 L18,4 H-18 Z" fill="#fff" stroke="${INK}" stroke-width="3.5" ${W}/>` +
    `<path d="M-22,-24 H22 L21,-18 H-21 Z" fill="${fill}"/>` +
    `<ellipse cx="0" cy="8" rx="34" ry="6" fill="#fff" stroke="${INK}" stroke-width="3"/></g>`;
  const cube = (x, y, r) => `<rect x="${x - 9}" y="${y - 9}" width="18" height="18" rx="3" transform="rotate(${r},${x},${y})" fill="#fff" stroke="${INK}" stroke-width="2.6"/>`;
  Object.assign(stickers, {
    tea: (uid = 'a') => sticker('#FFE1B3',
      `<path d="M-10,-36 q6,-8 0,-16 q-6,-8 0,-16 M10,-34 q6,-8 0,-16 q-6,-8 0,-16" fill="none" stroke="${INK}" stroke-width="3" opacity=".55" ${W}/>` +
      `<path d="M0,-58 C-6,-66 -16,-60 -10,-52 L0,-44 L10,-52 C16,-60 6,-66 0,-58 Z" fill="#FF5D8F" stroke="${INK}" stroke-width="2.4" ${W}/>` + cup(0, 18, 1.3), 'tea' + uid),
    spill: (uid = 'a') => sticker('#FF6B35',
      BF.art.noodle({ x: 0, y: 4, scale: 0.6, eyes: 'wide', mouth: 'bigO', armType: 'up', color: '#FFB08A' }) +
      `<path d="M-30,-44 q4,8 0,12 q-4,-4 0,-12 Z M30,-40 q4,8 0,12 q-4,-4 0,-12 Z M-40,0 q4,8 0,12 q-4,-4 0,-12 Z" fill="#B5651D" stroke="${INK}" stroke-width="2" ${W}/>` +
      `<path d="M-60,46 Q-20,36 0,44 Q30,52 60,42 V70 H-60 Z" fill="#B5651D" stroke="${INK}" stroke-width="3" ${W}/>`, 'sp' + uid),
    sugar: (uid = 'a') => sticker('#FF8FB1',
      BF.art.noodle({ x: 0, y: 8, scale: 0.6, eyes: 'wide', mouth: 'grin', armType: 'up' }) +
      cube(-38, -30, 14) + cube(38, -24, -10) + cube(-42, 22, -6) + cube(40, 28, 18) +
      `<path d="M-52,-6 h-8 M60,4 h-8 M-50,40 h-8" stroke="#fff" stroke-width="3.5" ${W}/>`, 'sg' + uid),
  });

  BF.art = Object.assign(BF.art || {}, { stickerFrame: sticker, cup, sun, sunFace, icons: { menu, bulb, soundOn, soundOff, gear, lock, star, hand, brain, tilt, shake, flip, upsideDown, landscape }, stickers, snowflake });
})(window.BF);

<script>
/* Brainflip — game shell: screens, HUD, narrator, hints, endings, juice.
   A level is a plain object { id, promptHTML, endings[], hints(found), build(ctx) }. */
(function (BF) {
  'use strict';
  const U = BF.U, A = BF.audio, ART = BF.art;
  const G = (BF.game = {});
  const el = {};
  let level = null, ctx = null, narrTimer = 0, boilTimer = 0, boilPaused = false;
  let hints = U.store.get('bf.hints', 5);
  let hintStage = 0, demoSeq = 0, confettiRAF = 0, inLevelHistory = false;

  const RANKS = [
    [45, 'Galaxy Brain'],
    [39, 'Chaos Mastermind'],
    [27, 'Certified Brainflipper'],
    [15, 'Plot Twister'],
    [5, 'Curious Bean'],
    [0, 'Sleepy Noodle'],
  ];

  G.getProgress = () => {
    const ids = Object.keys(BF.levels || {}).map(Number).sort((a, b) => a - b);
    let foundTotal = 0, maxTotal = 0, highestCompleted = 0, firstIncomplete = ids[0] || 1;
    let pickedIncomplete = false;
    ids.forEach((n) => {
      const def = BF.levels[n];
      const valid = new Set(def.endings.map((e) => e.id));
      const found = U.store.get(`bf.l${n}.found`, []).filter((id) => valid.has(id));
      foundTotal += found.length;
      maxTotal += def.endings.length;
      if (found.length > 0 && n > highestCompleted) highestCompleted = n;
      if (!pickedIncomplete && found.length < def.endings.length) { firstIncomplete = n; pickedIncomplete = true; }
    });
    const maxLevel = ids[ids.length - 1] || 15;
    const storedUnlocked = U.store.get('bf.unlocked', 1);
    const unlocked = U.clamp(Math.max(1, storedUnlocked, highestCompleted + 1), 1, maxLevel);
    const rank = (RANKS.find(([min]) => foundTotal >= min) || RANKS[RANKS.length - 1])[1];
    return { ids, foundTotal, maxTotal, highestCompleted, unlocked, maxLevel, firstIncomplete, rank };
  };
  G.refreshHints = () => {
    hints = U.store.get('bf.hints', 5);
    if (el.hintCount) el.hintCount.textContent = hints;
  };

  const STAGE_W = 390, MIN_H = 780, MAX_H = 900;
  const SCENE_TOP = 150; // scene y=0 sits 150px below the stage top
  let stageH = MIN_H;

  /* ---------- layout: 390px-wide design canvas; on phones the height follows the screen ---------- */
  function fit() {
    const desk = window.innerWidth >= 700 && window.innerHeight >= 600;
    document.body.classList.toggle('desk', desk);
    let s, H = MIN_H;
    if (desk) {
      s = Math.min(window.innerWidth / (STAGE_W + 80), window.innerHeight / (MIN_H + 90), 1.05);
    } else {
      s = window.innerWidth / STAGE_W;
      H = window.innerHeight / s;
      if (H < MIN_H) { s = window.innerHeight / MIN_H; H = MIN_H; } // short screens: letterbox the sides
      H = Math.min(H, MAX_H);
    }
    stageH = Math.round(H);
    el.stage.style.height = stageH + 'px';
    el.stage.style.transform = `translate(-50%, -50%) translateY(${desk ? -14 : 0}px) scale(${s})`;
    layoutScene();
  }
  function layoutScene() {
    const svg = el.scene && el.scene.querySelector('svg');
    if (!svg) return;
    svg.setAttribute('viewBox', `0 ${-SCENE_TOP} ${STAGE_W} ${stageH}`);
    svg.setAttribute('height', stageH);
    svg.setAttribute('width', STAGE_W);
  }

  G.init = () => {
    el.stage = U.$('#stage');
    el.title = U.$('#screen-title');
    el.level = U.$('#screen-level');
    el.prompt = U.$('#prompt');
    el.scene = U.$('#scene-wrap');
    el.narr = U.$('#narrator');
    el.overlay = U.$('#overlay');
    el.endings = U.$('#endings');
    el.hintBtn = U.$('#btn-hint');
    el.hintCount = U.$('#hint-count');
    el.levelNum = U.$('#level-num');
    el.levelSound = U.$('#btn-level-sound');
    el.fx = U.$('#fx-canvas');
    fit();
    window.addEventListener('resize', fit);
    U.$('#btn-menu').innerHTML = ART.icons.menu;
    el.hintBtn.insertAdjacentHTML('afterbegin', ART.icons.bulb);
    el.hintCount.textContent = hints;
    el.narr.querySelector('.nicon').innerHTML = ART.icons.brain;
    const paintLevelSound = () => {
      if (!el.levelSound) return;
      el.levelSound.innerHTML = A.muted ? ART.icons.soundOff : ART.icons.soundOn;
      el.levelSound.setAttribute('aria-label', A.muted ? 'Sound off' : 'Sound on');
    };
    paintLevelSound();
    A.onMuteChange(paintLevelSound);
    el.levelSound.addEventListener('click', () => {
      A.unlock();
      if (ctx && ctx.alive && !ctx.locked && ctx.onSoundButton && ctx.onSoundButton()) return;
      A.setMuted(!A.muted);
      A.play('tap');
    });
    U.$('#btn-menu').addEventListener('click', () => { A.play('tap'); G.showTitle(); });
    el.hintBtn.addEventListener('click', useHint);
    window.addEventListener('popstate', () => {
      if (!el.level.classList.contains('hidden')) {
        inLevelHistory = false;
        G.showTitle(true);
      }
    });
    window.BF_HANDLE_BACK = () => {
      const to = U.$('#title-overlay');
      if (to && !to.classList.contains('hidden')) {
        A.play('tap');
        to.classList.add('hidden');
        to.innerHTML = '';
        return true;
      }
      if (el.level && !el.level.classList.contains('hidden')) {
        A.play('tap');
        G.showTitle();
        return true;
      }
      return false;
    };
    startBoil();
  };

  /* ---------- line boil: cycle 3 turbulence seeds on visible .boil elements only ---------- */
  function startBoil() {
    if (U.params.get('boil') === '0' || U.reducedMotion()) return;
    let i = 0;
    clearInterval(boilTimer);
    boilTimer = setInterval(() => {
      if (document.hidden || boilPaused) return;
      const scope = el.level.classList.contains('hidden') ? el.title : el.level;
      i = (i + 1) % 3;
      U.$$('.boil', scope).forEach((n) => n.setAttribute('filter', `url(#boil${i})`));
    }, 130);
  }
  G.setBoilPaused = (p) => { boilPaused = !!p; };

  function clearDemos() {
    demoSeq++;
    U.$$('.ghost-hand, .pinch-dot, .tilt-demo, .shake-demo, .flip-demo, .upside-demo, .rock-demo, .hold-demo', el.level).forEach((n) => n.remove());
  }
  function clearTransient() {
    clearDemos();
    U.$$('.stamp', el.level).forEach((n) => n.remove());
    clearTimeout(narrTimer);
    el.narr.classList.remove('show');
    if (el.levelSound) el.levelSound.classList.remove('sound-blast');
    if (confettiRAF) { cancelAnimationFrame(confettiRAF); confettiRAF = 0; }
    if (el.fx) { const c2 = el.fx.getContext('2d'); if (c2) c2.clearRect(0, 0, el.fx.width, el.fx.height); }
  }
  function resetPrompt() {
    el.prompt.onclick = null;
    el.prompt.style.transform = '';
    el.prompt.style.left = '';
    el.prompt.style.top = '';
    el.prompt.style.transition = '';
    el.prompt.classList.remove('prompt-drag', 'prompt-moved');
  }

  /* ---------- screens ---------- */
  G.showTitle = (fromPop) => {
    if (ctx) { ctx.kill(); ctx = null; }
    boilPaused = false;
    clearTransient();
    resetPrompt();
    el.overlay.classList.add('hidden');
    el.overlay.innerHTML = '';
    el.level.classList.add('hidden');
    el.title.classList.remove('hidden');
    if (inLevelHistory && !fromPop) {
      inLevelHistory = false;
      try { history.back(); } catch (e) { /* ignore */ }
    }
    if (G.onTitle) G.onTitle();
  };

  G.startLevel = (def) => {
    level = def;
    U.store.set('bf.level', def.id);
    if (!inLevelHistory) {
      try { history.pushState({ bf: 'level', id: def.id }, ''); inLevelHistory = true; } catch (e) { /* ignore */ }
    }
    el.title.classList.add('hidden');
    el.level.classList.remove('hidden');
    el.levelNum.textContent = def.id;
    renderSlots();
    G.restart(true);
  };

  G.restart = (slam) => {
    if (ctx) ctx.kill();
    boilPaused = false;
    clearTransient();
    resetPrompt();
    el.overlay.classList.add('hidden');
    el.overlay.innerHTML = '';
    hintStage = 0;
    el.hintBtn.classList.remove('pulse');
    el.prompt.innerHTML = level.promptHTML;
    if (slam) { U.replay(el.prompt, 'slam'); A.play('slam'); }
    el.scene.innerHTML = '';
    ctx = makeCtx();
    level.build(ctx);
    layoutScene();
  };

  /* ---------- the context object a level talks to ---------- */
  function makeCtx() {
    const cleanups = [];
    let talkTimer = 0;
    const c = {
      alive: true,
      locked: false,
      attempts: 0,
      root: el.scene,
      promptEl: el.prompt,
      soundBtn: el.levelSound,
      found: () => foundEndings(),
      say: G.say,
      setBoilPaused: G.setBoilPaused,
      onCleanup: (fn) => cleanups.push(fn),
      /** Shared SVG speech bubble for Noodle, with automatic timer cleanup. */
      talk(layer, ax, ay, text, ms = 1800, bias = 0.5) {
        if (!c.alive || !layer) return;
        layer.innerHTML = '';
        const w = Math.max(70, text.length * 8.3 + 28), h = 36;
        const x = U.clamp(ax - w * bias, 8, 382 - w), y = ay - h - 12;
        const tx = U.clamp(ax, x + 14, x + w - 14);
        const g = U.svgEl('g', { class: 'fb-bottom popin' }, layer);
        U.svgEl('path', { d: `M${tx - 8},${y + h - 2} L${tx},${ay} L${tx + 8},${y + h - 2} Z`, fill: '#fff', stroke: '#1B1B2F', 'stroke-width': 3, 'stroke-linejoin': 'round' }, g);
        U.svgEl('rect', { x, y, width: w, height: h, rx: 16, fill: '#fff', stroke: '#1B1B2F', 'stroke-width': 3 }, g);
        U.svgEl('rect', { x: tx - 6, y: y + h - 5, width: 12, height: 6, fill: '#fff' }, g);
        const t = U.svgEl('text', { x: x + w / 2, y: y + 23.5, 'text-anchor': 'middle', 'font-family': 'Fredoka, sans-serif', 'font-weight': 600, 'font-size': 15.5, fill: '#1B1B2F' }, g);
        t.textContent = text;
        clearTimeout(talkTimer);
        talkTimer = setTimeout(() => { if (g.parentNode) g.remove(); }, ms);
      },
      /** a "wrong" poke: harmless, but after a few the hint button starts pulsing */
      attempt() {
        c.attempts++;
        if (c.attempts >= 4) el.hintBtn.classList.add('pulse');
      },
      win: (endingId) => win(endingId),
      kill() { c.alive = false; clearTimeout(talkTimer); cleanups.forEach((f) => { try { f(); } catch (e) { /* ignore */ } }); },
      stagePoint: (x, y) => ({ x, y: y + SCENE_TOP }),
      /** client (screen) px → scene coords, for hints that point at HTML (the prompt) */
      sceneFromClient(x, y) {
        const r = el.stage.getBoundingClientRect(), k = r.width / STAGE_W;
        return { x: (x - r.left) / k, y: (y - r.top) / k - SCENE_TOP };
      },
    };
    return c;
  }

  /* ---------- narrator (the Game talking to you) ---------- */
  G.say = (text, ms = 2300) => {
    if (!text) return;
    el.narr.querySelector('.ntext').textContent = text;
    el.narr.classList.toggle('big', text.length > 34);
    el.narr.classList.add('show');
    clearTimeout(narrTimer);
    narrTimer = setTimeout(() => el.narr.classList.remove('show'), ms);
  };

  /* ---------- endings ---------- */
  const key = () => `bf.l${level.id}.found`;
  function foundEndings() {
    const valid = new Set(level.endings.map((e) => e.id));
    return U.store.get(key(), []).filter((id) => valid.has(id));
  }
  function renderSlots(newId) {
    const found = foundEndings();
    el.endings.innerHTML = level.endings.map((e) => {
      const f = found.includes(e.id);
      return `<div class="slot ${f ? 'found' : ''} ${newId === e.id ? 'new' : ''}" title="${f ? e.name : 'Secret ending'}">${f ? ART.stickers[e.icon]('s' + e.id) : ''}</div>`;
    }).join('');
  }

  async function win(endingId) {
    if (!ctx || !ctx.alive) return;
    const myCtx = ctx;
    myCtx.locked = true;
    clearDemos();
    const found = foundEndings();
    const isNew = !found.includes(endingId);
    let bonusBulb = false;
    if (isNew) {
      found.push(endingId);
      U.store.set(key(), found);
      // Secret endings (anything other than the first/main ending) award +1 Hint Bulb!
      if (level.endings[0] && endingId !== level.endings[0].id) {
        hints++;
        U.store.set('bf.hints', hints);
        el.hintCount.textContent = hints;
        bonusBulb = true;
      }
    }
    // Unlock the next level in Chapter 1 progression.
    const nextId = level.id + 1;
    if (BF.levels[nextId] && U.store.get('bf.unlocked', 1) < nextId) {
      U.store.set('bf.unlocked', nextId);
    }
    // Politely invite an Android In-App Review once after clearing Level 6.
    if (level.id === 6 && !U.store.get('bf.reviewAsked6', false)) {
      U.store.set('bf.reviewAsked6', true);
      if (BF.native) BF.native.requestInAppReview();
    }
    renderSlots(isNew ? endingId : null);
    el.hintBtn.classList.remove('pulse');
    A.play('win');
    U.haptic([40, 60, 80]);
    confetti();
    const ed = level.endings.find((x) => x.id === endingId);
    stamp((ed && ed.stamp) || 'AWAKE!');
    await U.wait(1000);
    if (!myCtx.alive) return;
    showCard(endingId, isNew, found, bonusBulb);
  }

  function showCard(endingId, isNew, found, bonusBulb) {
    const e = level.endings.find((x) => x.id === endingId);
    const all = found.length === level.endings.length;
    const isFinalLevel = !BF.levels[level.id + 1];
    const kicker = all ? `ALL ${level.endings.length} ENDINGS FOUND!` : `LEVEL ${level.id} · ENDING ${found.length}/${level.endings.length}`;
    const slots = level.endings.map((x) => found.includes(x.id)
      ? `<div class="bigslot found" title="${x.name}">${ART.stickers[x.icon]('c' + x.id)}</div>`
      : '<div class="bigslot">?</div>').join('');
    el.overlay.innerHTML = `
      <div class="card" role="dialog" aria-label="Ending found">
        <span class="card-kicker">${kicker}</span>
        <div class="sticker">${ART.stickers[e.icon]('big')}</div>
        <h2>${e.name}</h2>
        <p class="quote">“${e.line}”</p>
        ${bonusBulb ? '<div class="bonus-pill">+1 💡 Secret ending bonus!</div>' : ''}
        <p class="rarity">${isNew ? 'New ending! ' : ''}<b>${e.rarity}%</b> of players found this one.</p>
        <div class="slots">${slots}</div>
        <div class="row">
          <button class="btn btn-yellow" id="c-more">${all ? 'Replay' : 'Find more'}</button>
          <button class="btn btn-pink" id="c-next">${isFinalLevel ? 'Finale ▸' : 'Next ▸'}</button>
        </div>
        <button class="btn btn-share" id="c-share">Share this ending</button>
      </div>`;
    el.overlay.classList.remove('hidden');
    U.$('#c-more').onclick = () => { A.play('tap'); G.restart(true); };
    U.$('#c-next').onclick = () => {
      A.play('tap');
      const next = BF.levels[level.id + 1];
      if (next) G.startLevel(next); else showChapter1Finale();
    };
    U.$('#c-share').onclick = () => { A.play('tap'); share(e, found.length); };
  }

  function showChapter1Finale() {
    const p = G.getProgress();
    const missing = Math.max(0, p.maxTotal - p.foundTotal);
    const crownNoodle = `
      <svg viewBox="-100 -122 200 218" xmlns="http://www.w3.org/2000/svg" aria-label="Noodle wearing the golden crown">
        <ellipse cx="0" cy="84" rx="54" ry="9" fill="#1B1B2F" opacity=".14"/>
        <g class="float">${ART.noodle({ y: 8, scale: 0.96, eyes: 'happy', mouth: 'grin', armType: 'up', withLegs: true })}
          <g transform="translate(0,-66) rotate(-6)">
            <path d="M-24,8 L-28,-14 L-10,-2 L0,-20 L10,-2 L28,-14 L24,8 Z" fill="#FFC93C" stroke="#1B1B2F" stroke-width="3.6" stroke-linejoin="round"/>
            <circle cx="-16" cy="-1" r="2.8" fill="#FF5D8F"/><circle cx="0" cy="-5" r="3.2" fill="#5BC0EB"/><circle cx="16" cy="-1" r="2.8" fill="#3DDC97"/>
          </g>
        </g>
      </svg>`;
    A.play('win');
    confetti();
    el.overlay.innerHTML = `
      <div class="card card-finale" role="dialog" aria-label="Chapter 1 Conquered">
        <span class="card-kicker">CHAPTER 1 CONQUERED!</span>
        <div class="finale-hero">${crownNoodle}</div>
        <h2>You Beat Brainflip!</h2>
        <div class="finale-stats">
          <span>${p.foundTotal}/${p.maxTotal} Endings</span>
          <span class="fs-rank">${p.rank}</span>
        </div>
        <div class="finale-cta-box">
          <p>Our tiny indie team is already sketching <b>Chapter 2</b>! Want more tricky levels faster? Rate us &amp; comment <b>“Chapter 2!”</b> on Google Play.</p>
          <button class="btn btn-pink btn-rate" id="f-rate">${ART.icons.star}<span>Rate &amp; Ask for Chapter 2</span></button>
        </div>
        <div class="row">
          <button class="btn btn-yellow" id="f-hunt">${missing > 0 ? `Hunt ${missing} More` : 'Replay Ch. 1'}</button>
          <button class="btn btn-mint" id="f-share">Share Score</button>
        </div>
        <button class="btn" id="f-title" style="width:100%;margin-top:10px;font-size:17px;padding:8px 10px">Back to Home</button>
      </div>`;
    el.overlay.classList.remove('hidden');
    U.$('#f-rate').onclick = () => {
      A.play('pop');
      U.store.set('bf.ratedClick', true);
      if (BF.native) BF.native.openStoreReview();
    };
    U.$('#f-hunt').onclick = () => {
      A.play('tap');
      G.startLevel(BF.levels[missing > 0 ? p.firstIncomplete : 1]);
    };
    U.$('#f-share').onclick = async () => {
      A.play('tap');
      const url = (BF.config && BF.config.storeUrl) || location.href;
      const text = `I conquered Brainflip Chapter 1 (${p.foundTotal}/${p.maxTotal} endings · ${p.rank})! Can you beat Boss Level 15? 🧠👑`;
      const res = BF.native ? await BF.native.share('Brainflip', text, url) : 'failed';
      if (res === 'copied') G.say('Score copied! Paste it to a friend.');
      else if (res === 'failed') G.say('Try sharing on your phone!');
    };
    U.$('#f-title').onclick = () => { A.play('tap'); G.showTitle(); };
  }

  async function share(e, count) {
    const url = (BF.config && BF.config.storeUrl) || location.href;
    const text = `I found the “${e.name}” ending in Brainflip Level ${level.id} (${count}/${level.endings.length}). Can you find all ${level.endings.length}? 🧠`;
    const res = BF.native ? await BF.native.share('Brainflip', text, url) : 'failed';
    if (res === 'copied') G.say('Copied! Paste it to a friend.');
    else if (res === 'failed') G.say('Sharing is unavailable here — try on your phone.');
  }

  /* ---------- hints: text first, then a ghost-hand or sensor demo ---------- */
  function useHint() {
    if (!level || !ctx || ctx.locked) return;
    const found = foundEndings();
    const stages = level.hints(found, ctx);
    const allFound = found.length >= level.endings.length;
    const idx = Math.min(hintStage, stages.length - 1);
    const h = stages[idx];
    const shouldCharge = !allFound && hintStage < stages.length;
    if (shouldCharge) {
      if (hints <= 0) {
        A.play('pop');
        hints = 3;
        U.store.set('bf.hints', hints);
        el.hintCount.textContent = hints;
        G.say('Free Chapter 1 refill (+3 💡)! Tip: secret endings give +1 💡 too.', 3400);
        return;
      }
      hints--; U.store.set('bf.hints', hints); el.hintCount.textContent = hints;
    }
    A.play('hint');
    el.hintBtn.classList.remove('pulse');
    G.say(h.text, 3600);
    clearDemos();
    if (h.demo && level.demo) {
      const path = level.demo(h.demo, ctx);
      if (path && path.tilt) tiltDemo(path.tilt);
      else if (path && path.shake) shakeDemo();
      else if (path && path.flip) flipDemo();
      else if (path && path.upsideDown) upsideDownDemo();
      else if (path && path.rock) rockDemo();
      else if (path && path.landscape) landscapeDemo();
      else if (path && path.hold) holdDemo(path.hold);
      else if (path && path.pinch) pinchDemo(path.pinch);
      else if (path) ghostHand(path);
    }
    hintStage++;
  }

  async function ghostHand(points) {
    const seq = demoSeq;
    const hand = document.createElement('div');
    hand.className = 'ghost-hand';
    hand.innerHTML = ART.icons.hand;
    el.level.appendChild(hand);
    const place = (p) => { hand.style.left = p.x + 'px'; hand.style.top = (p.y + SCENE_TOP) + 'px'; };
    for (let rep = 0; rep < 2 && seq === demoSeq; rep++) {
      place(points[0]);
      await U.wait(30);
      if (seq !== demoSeq) break;
      hand.classList.add('on');
      await U.wait(350);
      for (let i = 1; i < points.length && seq === demoSeq; i++) {
        const a = points[i - 1], b = points[i];
        await U.tween(points.length > 3 ? 160 : 800, (t) => {
          if (seq === demoSeq) place({ x: U.lerp(a.x, b.x, t), y: U.lerp(a.y, b.y, t) });
        }, U.ease.inOutCubic);
      }
      if (seq !== demoSeq) break;
      await U.wait(250);
      hand.classList.remove('on');
      await U.wait(300);
    }
    hand.remove();
  }

  /** hint for zoom puzzles: two fingertips spreading apart */
  async function pinchDemo(p) {
    const seq = demoSeq;
    const dots = [0, 1].map(() => { const d = document.createElement('div'); d.className = 'pinch-dot'; el.level.appendChild(d); return d; });
    for (let rep = 0; rep < 2 && seq === demoSeq; rep++) {
      await U.tween(900, (t) => {
        if (seq !== demoSeq) return;
        dots.forEach((d, i) => {
          const k = (i ? 1 : -1) * (10 + 46 * t);
          d.style.left = (p.x + k * 0.8) + 'px'; d.style.top = (p.y + SCENE_TOP + k * 0.6) + 'px'; d.style.opacity = t < 0.85 ? 1 : (1 - t) * 6;
        });
      }, U.ease.inOutCubic);
      await U.wait(250);
    }
    dots.forEach((d) => d.remove());
  }

  /** hint for hold-down puzzles: pulsing ring + fingertip */
  async function holdDemo(p) {
    const seq = demoSeq;
    const ring = document.createElement('div');
    ring.className = 'hold-demo';
    ring.style.left = p.x + 'px'; ring.style.top = (p.y + SCENE_TOP) + 'px';
    ring.innerHTML = ART.icons.hand;
    el.level.appendChild(ring);
    await U.wait(2600);
    if (seq === demoSeq || ring.parentNode) ring.remove();
  }

  /** hint for sensor puzzles: a phone rocking, shaking, or flipping */
  async function tiltDemo(dir) {
    const d = document.createElement('div');
    d.className = 'tilt-demo';
    d.innerHTML = ART.icons.tilt;
    d.style.setProperty('--dir', dir > 0 ? 1 : -1);
    el.level.appendChild(d);
    await U.wait(2600);
    d.remove();
  }
  async function shakeDemo() {
    const d = document.createElement('div');
    d.className = 'shake-demo';
    d.innerHTML = ART.icons.shake;
    el.level.appendChild(d);
    await U.wait(2200);
    d.remove();
  }
  async function flipDemo() {
    const d = document.createElement('div');
    d.className = 'flip-demo';
    d.innerHTML = ART.icons.flip;
    el.level.appendChild(d);
    await U.wait(2600);
    d.remove();
  }
  async function upsideDownDemo() {
    const d = document.createElement('div');
    d.className = 'upside-demo';
    d.innerHTML = ART.icons.upsideDown;
    el.level.appendChild(d);
    await U.wait(2800);
    d.remove();
  }
  async function rockDemo() {
    const d = document.createElement('div');
    d.className = 'rock-demo';
    d.innerHTML = ART.icons.tilt;
    el.level.appendChild(d);
    await U.wait(2800);
    d.remove();
  }
  async function landscapeDemo() {
    const d = document.createElement('div');
    d.className = 'landscape-demo';
    d.innerHTML = ART.icons.landscape;
    el.level.appendChild(d);
    await U.wait(2600);
    d.remove();
  }

  /* ---------- juice ---------- */
  function stamp(text) {
    const s = document.createElement('div');
    s.className = 'stamp';
    s.textContent = text;
    el.level.appendChild(s);
    setTimeout(() => s.remove(), 1400);
  }

  function confetti() {
    if (confettiRAF) { cancelAnimationFrame(confettiRAF); confettiRAF = 0; }
    const cv = el.fx, c2 = cv.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const STAGE_H = stageH;
    cv.width = STAGE_W * dpr; cv.height = STAGE_H * dpr;
    c2.setTransform(dpr, 0, 0, dpr, 0, 0);
    const colors = ['#FFC93C', '#FF5D8F', '#3DDC97', '#5BC0EB', '#FF6B35', '#ffffff'];
    const parts = Array.from({ length: 90 }, () => ({
      x: STAGE_W / 2 + U.rand(-40, 40), y: 330, vx: U.rand(-7, 7), vy: U.rand(-13, -4),
      w: U.rand(7, 13), h: U.rand(4, 8), r: U.rand(0, 6), vr: U.rand(-0.3, 0.3), c: U.pick(colors),
    }));
    const t0 = performance.now();
    (function frame(now) {
      const t = now - t0;
      c2.clearRect(0, 0, STAGE_W, STAGE_H);
      parts.forEach((p) => {
        p.vy += 0.38; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        c2.save(); c2.translate(p.x, p.y); c2.rotate(p.r);
        c2.fillStyle = p.c; c2.strokeStyle = '#1B1B2F'; c2.lineWidth = 1.6;
        c2.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); c2.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h);
        c2.restore();
      });
      if (t < 2600) confettiRAF = requestAnimationFrame(frame);
      else { confettiRAF = 0; c2.clearRect(0, 0, STAGE_W, STAGE_H); }
    })(t0);
  }
  G.confetti = confetti;
  G.stamp = stamp;
})(window.BF);

</script>
<script>
/* Brainflip — Level 1: "Wake him up!"
   Main ending : drag the sleepy sun up from behind the hill  (verb: drag)
   Secret #1   : shake the phone — or grab the bed and wiggle it fast  (verb: shake)
   Secret #2   : pull the blanket off  (verb: drag)
   Every other object reacts with a joke so no tap is ever dead. */
(function (BF) {
  'use strict';
  const U = BF.U, A = BF.audio, I = BF.input, ART = BF.art;
  const INK = '#1B1B2F', YELLOW = '#FFC93C', ICE = '#A8DDF7';
  const NIGHT = '#2B2D6E', DAY = '#7FD3F7';
  const SUN0 = { x: 125, y: 206 }, SUN1 = { x: 125, y: 86 };
  const LIE = { x: 220, y: 392, rot: -78 };
  const SIT = { x: 204, y: 366, rot: 0 };
  const SIT_BARE = { x: 212, y: 368, rot: 0 };
  const W = 'stroke-linecap="round" stroke-linejoin="round"';
  const S = `stroke="${INK}" stroke-width="3.4" ${W}`;

  const star = (x, y, s = 5) => `<path d="M${x},${y - s} Q${x},${y} ${x + s},${y} Q${x},${y} ${x},${y + s} Q${x},${y} ${x - s},${y} Q${x},${y} ${x},${y - s} Z"/>`;
  const moonFace = (wink) => wink
    ? `<path d="M-9,-4 Q-6,-8 -3,-4" fill="none" stroke="${INK}" stroke-width="2.2" ${W}/><path d="M-9,4 Q-5,7 -2,4" fill="none" stroke="${INK}" stroke-width="2.2" ${W}/>`
    : `<path d="M-9,-5 Q-6,-2 -3,-5" fill="none" stroke="${INK}" stroke-width="2.2" ${W}/><path d="M-8,4 Q-5,6 -2,4" fill="none" stroke="${INK}" stroke-width="2.2" ${W}/>`;

  function sceneSVG() {
    return `
<svg viewBox="0 0 390 630" xmlns="http://www.w3.org/2000/svg" aria-label="Noodle asleep in his bedroom at night">
  <defs>
    <clipPath id="l1-glass"><rect x="52" y="42" width="146" height="176" rx="4"/></clipPath>
    <pattern id="l1-wallp" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M14,9 v10 M9,14 h10" stroke="#F3C88E" stroke-width="2.4" stroke-linecap="round"/></pattern>
    <pattern id="l1-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="3.4" fill="#fff" opacity=".9"/><circle cx="18" cy="18" r="3.4" fill="#fff" opacity=".9"/></pattern>
    <linearGradient id="l1-beamg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF1A8" stop-opacity=".9"/><stop offset="1" stop-color="#FFF1A8" stop-opacity="0"/></linearGradient>
  </defs>
  <g id="l1-shake">
    <!-- wall + floor (only these darken at night: characters and props stay readable) -->
    <rect data-tap="wall" x="-30" y="-200" width="450" height="682" fill="#FFE1B3"/>
    <rect x="-30" y="-200" width="450" height="682" fill="url(#l1-wallp)" pointer-events="none"/>
    <rect data-tap="floor" x="-30" y="482" width="450" height="520" fill="#F2A65A"/>
    <path d="M0,522 H120 M150,522 H390 M0,562 H70 M100,562 H300 M330,562 H390 M0,602 H200 M230,602 H390 M0,642 H90 M120,642 H390 M0,682 H260 M290,682 H390 M0,722 H150 M180,722 H390" stroke="#C77D4A" stroke-width="2.6" pointer-events="none"/>
    <rect x="-30" y="474" width="450" height="12" fill="#fff" ${S}/>
    <rect id="l1-night" x="-30" y="-200" width="450" height="1200" fill="#1E2058" opacity=".55" pointer-events="none"/>
    <polygon id="l1-beam" points="52,218 198,218 340,760 100,760" fill="url(#l1-beamg)" opacity="0" pointer-events="none"/>

    <!-- window: sky, stars, moon, the sleepy sun, hill -->
    <g id="l1-window">
      <g clip-path="url(#l1-glass)">
        <rect id="l1-sky" data-tap="sky" x="52" y="42" width="146" height="176" fill="${NIGHT}"/>
        <g id="l1-stars" fill="#FFF4C2" stroke="${INK}" stroke-width="1.4" pointer-events="none">
          ${star(70, 62)}${star(104, 98, 4)}${star(150, 58, 6)}${star(186, 112, 4)}${star(78, 140, 4)}${star(134, 128, 5)}${star(178, 162, 4)}
        </g>
        <g id="l1-moon" transform="translate(168,80)"><g data-tap="moon" class="fb">
          <path d="M6,-17 A17,17 0 1,0 6,17 A13,13 0 1,1 6,-17 Z" fill="#FFF4C2" stroke="${INK}" stroke-width="2.8" ${W}/>
          <g id="l1-moonface">${moonFace(false)}</g>
        </g></g>
        <g id="l1-sun" transform="translate(${SUN0.x},${SUN0.y})"><g id="l1-sun-in" class="boil peek">${ART.sun('sleep')}</g></g>
        <g data-tap="hill">
          <path d="M44,214 C78,196 112,196 140,206 C160,213 180,206 206,198 L206,224 L44,224 Z" fill="#3DDC97" ${S}/>
          <path d="M176,204 V190" stroke="${INK}" stroke-width="3.4" ${W}/>
          <circle cx="176" cy="182" r="11" fill="#2EB57B" ${S}/>
        </g>
        <path d="M66,120 L98,60 M78,132 L104,84" stroke="#fff" stroke-width="4" opacity=".28" stroke-linecap="round" pointer-events="none"/>
      </g>

      <rect x="30" y="226" width="190" height="16" rx="6" fill="#fff" ${S}/>
    </g>
    <circle id="l1-sun-hit" cx="${SUN0.x}" cy="${SUN0.y}" r="40" fill="#000" fill-opacity="0" pointer-events="all"/>

    <!-- curtains + rod -->
    <g data-tap="curtain"><g class="fb-top boil">
      <path d="M18,26 H64 C62,70 54,120 60,170 C62,200 70,232 64,258 C52,262 38,256 26,262 C30,220 20,170 22,120 C24,80 16,50 18,26 Z" fill="#FF5D8F" ${S}/>
      <path d="M34,40 C36,100 30,170 36,250 M50,40 C48,110 54,180 50,252" fill="none" stroke="#C93A6B" stroke-width="2.4" ${W}/>
    </g></g>
    <g data-tap="curtain"><g class="fb-top boil">
      <path d="M232,26 H186 C188,70 196,120 190,170 C188,200 180,232 186,258 C198,262 212,256 224,262 C220,220 230,170 228,120 C226,80 234,50 232,26 Z" fill="#FF5D8F" ${S}/>
      <path d="M216,40 C214,100 220,170 214,250 M200,40 C202,110 196,180 200,252" fill="none" stroke="#C93A6B" stroke-width="2.4" ${W}/>
    </g></g>
    <path d="M12,24 H238" stroke="${INK}" stroke-width="4.5" ${W}/>
