      U.svgEl('path', { d: d + 'Z', fill: color, stroke: INK, 'stroke-width': 3, 'stroke-linejoin': 'round' }, inner);
      const t = U.svgEl('text', { y: 6, 'text-anchor': 'middle', 'font-family': '"Lilita One", sans-serif', 'font-size': 16.5, fill: INK }, inner);
      t.textContent = text;
      setTimeout(() => g.remove(), 750);
    }

    /* ---------- boombox beat + floating music notes ---------- */
    const activeNotes = new Set();
    function pulseBeat() {
      if (!st.playing || !alive() || document.hidden) return;
      st.beat++;
      if (!st.done) A.play('beat', st.beat);
      [spkL, spkR].forEach((s) => U.replay(s.firstElementChild, 'popin'));
      const glyphs = ['♪', '♫', '♬'];
      const sx = st.boxDragged ? 200 : BOX0.x + U.rand(-26, 20);
      const sy = st.boxDragged ? 260 : BOX0.y - 38;
      const n = U.svgEl('text', {
        x: sx.toFixed(1), y: sy.toFixed(1),
        'font-family': '"Lilita One", sans-serif', 'font-size': U.pick([20, 24, 19]),
        fill: U.pick([PINK, YELLOW, SKY]), stroke: INK, 'stroke-width': 2.4, 'paint-order': 'stroke',
      }, notesLayer);
      n.textContent = U.pick(glyphs);
      activeNotes.add(n);
      const driftX = U.rand(-52, -16);
      U.tween(1600, (t) => {
        if (!alive() || !st.playing) return;
        n.setAttribute('x', (sx + driftX * t + Math.sin(t * 7) * 6).toFixed(1));
        n.setAttribute('y', (sy - 78 * t).toFixed(1));
        n.setAttribute('opacity', (t < 0.15 ? t / 0.15 : 1 - (t - 0.15) / 0.85).toFixed(2));
      }, U.ease.linear).then(() => {
        if (st.playing) { activeNotes.delete(n); n.remove(); }
      });
    }
    const firstBeat = setTimeout(pulseBeat, 180);
    const beatTimer = setInterval(pulseBeat, 640);
    ctx.onCleanup(() => { clearTimeout(firstBeat); clearInterval(beatTimer); });

    /* ---------- MAIN ENDING: mute the whole game (HUD sound button OR hardware Volume Down) ---------- */
    let mutedByEnding = false;
    ctx.onCleanup(() => {
      if (mutedByEnding && !wasMuted) A.setMuted(false);
    });

    async function muteEnding() {
      if (st.done || !alive()) return;
      st.done = true; ctx.locked = true; st.playing = false;
      if (ctx.soundBtn) ctx.soundBtn.classList.remove('sound-blast');
      A.play('click');
      U.haptic(35);
      if (!A.muted) { mutedByEnding = true; A.setMuted(true); }
      activeNotes.forEach((n) => {
        n.setAttribute('fill', '#C9C3D4');
        U.tween(420, (t) => {
          n.setAttribute('opacity', (1 - t).toFixed(2));
          n.setAttribute('transform', `translate(0,${(18 * t * t).toFixed(1)})`);
        }).then(() => n.remove());
      });
      activeNotes.clear();
      const g = U.svgEl('g', { transform: `translate(${BOX0.x},${BOX0.y - 34})`, class: 'fb popin' }, fx);
      U.svgEl('circle', { r: 22, fill: '#fff', stroke: INK, 'stroke-width': 3 }, g);
      U.svgEl('path', { d: 'M-10,-6 H-4 L4,-12 V12 L-4,6 H-10 Z', fill: INK }, g);
      U.svgEl('path', { d: 'M7,-6 L15,6 M15,-6 L7,6', stroke: PINK, 'stroke-width': 3.5, 'stroke-linecap': 'round' }, g);

      sweat.setAttribute('opacity', '0');
      setFace('wide', 'grin'); setArms('up');
      babyFaceEl.innerHTML = babyFace('happy');
      talk('Wait… you muted the WHOLE GAME?!', 2400);
      ctx.say('Galaxy brain move. Total silence.', 2600);
      await U.wait(1250);
      if (alive()) ctx.win('mute');
    }

    ctx.onSoundButton = () => {
      muteEnding();
      return true;
    };
    ctx.onCleanup(I.onVolumeDown(() => muteEnding()));

    /* ---------- SECRET ENDING #1: 2-step combo — open window, then toss boombox out! ---------- */
    async function toggleWindow(forceOpen) {
      if (st.winBusy || st.done) return;
      const next = forceOpen !== undefined ? forceOpen : !st.winOpen;
      if (next === st.winOpen) return;
      st.winBusy = true;
      st.winOpen = next;
      A.play('creak');
      const from = next ? 0 : -54, to = next ? -54 : 0;
      await U.tween(320, (t) => {
        if (!alive()) return;
        sash.setAttribute('transform', `translate(0,${U.lerp(from, to, t).toFixed(1)})`);
      }, U.ease.outBack);
      st.winBusy = false;
      ctx.say(next ? 'Fresh night air! Also a very convenient drop…' : 'Window closed.');
    }
    I.drag(winHit, svg, {
      onStart() { st.lastTouch = performance.now(); },
      onMove(pt, d) {
        if (st.done || st.winBusy) return;
        if (!st.winOpen && d.dy < -24) toggleWindow(true);
        else if (st.winOpen && d.dy > 24) toggleWindow(false);
      },
      onEnd() {},
      onTap() { if (!ctx.locked && !st.done) toggleWindow(); },
    });

    let boxGrab = null;
    I.drag(box, svg, {
      onStart(pt) {
        if (ctx.locked || st.done) return;
        st.lastTouch = performance.now();
        st.boxDragged = true;
        const m = /translate\(([-\d.]+),([-\d.]+)/.exec(box.getAttribute('transform'));
        boxGrab = { dx: pt.x - parseFloat(m[1]), dy: pt.y - parseFloat(m[2]) };
        A.play('tap');
      },
      onMove(pt) {
        if (!boxGrab) return;
        const x = U.clamp(pt.x - boxGrab.dx, 36, 354);
        const y = U.clamp(pt.y - boxGrab.dy, 48, 520);
        box.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${U.clamp((x - BOX0.x) * 0.06, -16, 16).toFixed(1)})`);
        if (!st.batteryJoke && Math.hypot(x - BOX0.x, y - BOX0.y) > 55) {
          st.batteryJoke = true;
          ctx.say('No cord to unplug — it’s battery powered!');
        }
      },
      onEnd() {
        if (!boxGrab) return;
        boxGrab = null;
        st.boxDragged = false;
        const m = /translate\(([-\d.]+),([-\d.]+)/.exec(box.getAttribute('transform'));
        const x0 = parseFloat(m[1]), y0 = parseFloat(m[2]);
        const nearWin = x0 < 178 && y0 < 235;
        if (nearWin && st.winOpen) {
          tossEnding(x0, y0);
        } else {
          if (nearWin && !st.winOpen) {
            A.play('bonk'); U.haptic(35);
            burst('BONK!', WIN.x, WIN.y + 24, '#FF8FB1');
            ctx.say('The window is closed! Open it first.');
            ctx.attempt();
          } else {
            A.play('bonk');
          }
          U.tween(460, (t) => {
            if (!alive() || st.done) return;
            box.setAttribute('transform', `translate(${U.lerp(x0, BOX0.x, t).toFixed(1)},${U.lerp(y0, BOX0.y, t).toFixed(1)})`);
          }, U.ease.outBounce);
        }
      },
      onTap() {
        boxGrab = null; st.boxDragged = false;
        if (!ctx.locked && !st.done) taps.boombox();
      },
    });

    async function tossEnding(x0, y0) {
      if (st.done || !alive()) return;
      st.done = true; ctx.locked = true; st.playing = false;
      if (ctx.soundBtn) ctx.soundBtn.classList.remove('sound-blast');
      notesLayer.innerHTML = '';
      A.play('whoosh'); U.haptic(30);
      await U.tween(320, (t) => {
        if (!alive()) return;
        const x = U.lerp(x0, WIN.x, t), y = U.lerp(y0, WIN.y + 32, t) - Math.sin(t * Math.PI) * 28;
        box.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(140 * t).toFixed(1)}) scale(${U.lerp(1, 0.45, t).toFixed(2)})`);
      }, U.ease.inCubic);
      box.style.display = 'none';
      const tiny = U.svgEl('g', { transform: `translate(${WIN.x},${WIN.y + 18}) scale(.35)` }, winFx);
      tiny.innerHTML = boomboxSVG();
      await U.tween(520, (t) => {
        if (!alive()) return;
        const y = U.lerp(WIN.y + 14, 166, t * t);
        tiny.setAttribute('transform', `translate(${(WIN.x - 3 * t).toFixed(1)},${y.toFixed(1)}) rotate(${(140 + 420 * t).toFixed(1)}) scale(${U.lerp(0.35, 0.16, t).toFixed(2)})`);
      }, U.ease.linear);
      tiny.remove();
      A.play('crash'); U.haptic(50);
      await U.wait(180);
      if (!alive()) return;
      A.play('carAlarm');
      const yell = U.svgEl('text', { x: WIN.x, y: 158, 'text-anchor': 'middle', 'font-family': '"Lilita One", sans-serif', 'font-size': 12.5, fill: YELLOW, stroke: INK, 'stroke-width': 2.4, 'paint-order': 'stroke' }, winFx);
      yell.textContent = 'MY CAR!!';
      U.tween(1200, (t) => { yell.setAttribute('y', (158 - 20 * t).toFixed(1)); yell.setAttribute('opacity', (1 - t * 0.4).toFixed(2)); });

      sweat.setAttribute('opacity', '0');
      setFace('happy', 'grin'); setArms('relax');
      babyFaceEl.innerHTML = babyFace('happy');
      talk('Well… that’s one way to do it!', 2400);
      ctx.say('Problem yeeted. Peaceful silence.', 2400);
      await U.wait(1250);
      if (alive()) ctx.win('toss');
    }

    /* ---------- SECRET ENDING #2: Rock-a-Bye (gentle phone tilt OR smooth cradle drag) ---------- */
    function registerGentleRock(side) {
      if (st.done || !alive() || side === st.lastRockSide) return;
      const now = performance.now();
      if (now - st.lastRockAt < 260) return;
      if (st.lastRockAt && now - st.lastRockAt > 3800) st.rocks = 0;
      st.lastRockSide = side;
      st.lastRockAt = now;
      st.rocks++;
      A.play('lullaby', st.rocks - 1);
      const sym = U.svgEl('text', {
        x: (CRADLE.x + U.rand(-30, 30)).toFixed(1), y: (CRADLE.y - 98).toFixed(1),
        'font-family': '"Lilita One", sans-serif', 'font-size': 18,
        fill: YELLOW, stroke: INK, 'stroke-width': 2.2, 'paint-order': 'stroke',
      }, lullabyLayer);
      sym.textContent = st.rocks % 2 ? '✦' : 'Z';
      U.tween(1200, (t) => {
        if (!alive()) return;
        sym.setAttribute('y', (CRADLE.y - 98 - 54 * t).toFixed(1));
        sym.setAttribute('opacity', (1 - t).toFixed(2));
      }, U.ease.linear).then(() => sym.remove());

      if (st.rocks === 2) ctx.say('Ooh, nice and gentle… keep rocking!');
      if (st.rocks >= 4) rockEnding();
    }

    ctx.onCleanup(I.onShake(() => {
      if (st.done || !alive()) return;
      st.rocks = 0; st.lastRockSide = 0;
      U.replay(cradle, 'jolt');
      babyFaceEl.innerHTML = babyFace('wide');
      A.play('squeak');
      talk('GENTLY! Not an earthquake!', 1800);
      ctx.say('Easy! Rock it softly, don’t shake!');
      setTimeout(() => { if (alive() && !st.done) babyFaceEl.innerHTML = babyFace('sleep'); }, 750);
    }));

    let cDrag = null;
    I.drag(cradle, svg, {
      onStart(pt) {
        if (ctx.locked || st.done) return;
        st.lastTouch = performance.now();
        st.dragCradle = true;
        cDrag = { x0: pt.x, lastX: pt.x, lastT: performance.now(), tooFast: false };
      },
      onMove(pt, d) {
        if (!cDrag || st.done) return;
        const now = performance.now(), dt = Math.max(8, now - cDrag.lastT);
        const speed = Math.abs(pt.x - cDrag.lastX) / (dt / 1000);
        cDrag.lastX = pt.x; cDrag.lastT = now;
        st.cradleA = U.clamp(d.dx * 0.28, -16, 16);
        cradlePivot.setAttribute('transform', `translate(${CRADLE.x},${CRADLE.y}) rotate(${st.cradleA.toFixed(1)})`);
        if (speed > 1350 && !cDrag.tooFast) {
          cDrag.tooFast = true; st.rocks = 0;
          A.play('wobble');
          ctx.say('Slower! Gently rock the cradle.');
        } else if (!cDrag.tooFast) {
          if (st.cradleA <= -8) registerGentleRock(-1);
          else if (st.cradleA >= 8) registerGentleRock(1);
        }
      },
      onEnd() { st.dragCradle = false; cDrag = null; },
      onTap() {
        st.dragCradle = false; cDrag = null;
        if (!ctx.locked && !st.done) taps.baby();
      },
    });

    async function rockEnding() {
      if (st.done || !alive()) return;
      st.done = true; ctx.locked = true;
      if (ctx.soundBtn) ctx.soundBtn.classList.remove('sound-blast');
      babyFaceEl.innerHTML = babyFace('happy');
      sweat.setAttribute('opacity', '0');
      setFace('happy', 'grin'); setArms('up');
      A.play('lullaby', 3); U.haptic([25, 40, 25]);
      const b = U.svgEl('circle', { cx: CRADLE.x - 4, cy: CRADLE.y - 62, r: 9, fill: '#CFEFFF', 'fill-opacity': '.85', stroke: INK, 'stroke-width': 2.2 }, fx);
      U.tween(900, (t) => { if (alive()) b.setAttribute('r', (6 + 5 * Math.sin(t * Math.PI * 2)).toFixed(1)); });
      talk('Out like a light! Nothing can wake them!', 2500);
      ctx.say('Deep sleep achieved. Even loud music can’t wake them now.', 2600);
      await U.wait(1350);
      if (alive()) ctx.win('rock');
    }

    /* ---------- animation loop: gentle phone tilt rocking, cradle spring, sweat bob ---------- */
    const t0 = performance.now();
    (function loop(now) {
      if (!alive()) return;
      const t = (now - t0) / 1000;
      if (st.playing && !st.done) {
        sweat.setAttribute('transform', `translate(0,${(Math.sin(t * 6) * 2.5).toFixed(1)})`);
      }
      if (!st.dragCradle) {
        let targetA = 0;
        if (I.hasMotion && !st.done) {
          const tilt = I.tilt;
          targetA = U.clamp(tilt * 0.45, -16, 16);
          if (Math.abs(tilt) < 52) {
            if (tilt <= -12) registerGentleRock(-1);
            else if (tilt >= 12) registerGentleRock(1);
          }
        }
        st.cradleA += (targetA - st.cradleA) * 0.14;
        cradlePivot.setAttribute('transform', `translate(${CRADLE.x},${CRADLE.y}) rotate(${st.cradleA.toFixed(1)})`);
      }
      if (!st.done && now - st.lastTouch > 8500) {
        st.lastTouch = now;
        ctx.say(U.pick([
          'Psst… look at the sound button up top.',
          'That window looks like it opens…',
          'Maybe gently rocking the baby helps?',
        ]));
      }
      requestAnimationFrame(loop);
    })(t0);
    svg.addEventListener('pointerdown', () => { st.lastTouch = performance.now(); });

    /* ---------- cuckoo clock gag ---------- */
    async function cuckooTap() {
      if (st.cuckooBusy || st.done) return;
      st.cuckooBusy = true; ctx.attempt();
      A.play('cuckoo');
      await U.tween(180, (t) => bird.setAttribute('transform', `translate(0,${U.lerp(18, 0, t).toFixed(1)})`), U.ease.outBack);
      if (!alive() || st.done) { st.cuckooBusy = false; return; }
      const d = `M${ND.x + 20},${ND.y - 24} C${ND.x + 70},${ND.y - 120} 310,170 324,96`;
      const armInk = U.svgEl('path', { d, fill: 'none', stroke: INK, 'stroke-width': 11, 'stroke-linecap': 'round' }, fx);
      const armCol = U.svgEl('path', { d, fill: 'none', stroke: YELLOW, 'stroke-width': 5.5, 'stroke-linecap': 'round' }, fx);
      const len = armInk.getTotalLength();
      [armInk, armCol].forEach((a) => { a.style.strokeDasharray = len; a.style.strokeDashoffset = len; });
      await U.tween(150, (t) => [armInk, armCol].forEach((a) => (a.style.strokeDashoffset = len * (1 - t))));
      A.play('smack'); U.haptic(25);
      burst('SHHH!', 314, 72, MINT);
      await U.tween(140, (t) => bird.setAttribute('transform', `translate(0,${(18 * t).toFixed(1)})`));
      await U.tween(150, (t) => [armInk, armCol].forEach((a) => (a.style.strokeDashoffset = len * t)));
      armInk.remove(); armCol.remove();
      ctx.say('Not now, bird!');
      st.cuckooBusy = false;
    }

    /* ---------- reactions (no dead taps!) ---------- */
    const noodleLines = ['Turn that thing OFF!!', 'I JUST got them to sleep!', 'Use your inside taps!'];
    const taps = {
      boombox() {
        const n = count('boombox');
        A.play('bonk'); U.replay(boxIn, 'wiggle');
        ctx.say(n === 1 ? 'Volume is welded to 11. Power button is jammed!' : 'If ONLY there were another sound button on this screen…', 2800);
        ctx.attempt();
      },
      baby() {
        A.play('wobble'); U.replay(cradle, 'wiggle');
        ctx.say('Careful! Try rocking them gently, not poking.');
        ctx.attempt();
      },
      noodle() {
        const n = count('noodle');
        A.play('shhh'); U.replay(ndBoil, 'wiggle');
        talk(noodleLines[(n - 1) % noodleLines.length]);
        ctx.attempt();
      },
      cuckoo: cuckooTap,
      duck(node) {
        A.play('squeak'); U.haptic(30); U.replay(node, 'hop');
        burst('SQUEAK!', 216, 474, YELLOW);
        babyFaceEl.innerHTML = babyFace('wide');
        talk('DON’T TOUCH THE DUCK!', 1600);
        ctx.say('That was WAY too close!');
        ctx.attempt();
        setTimeout(() => { if (alive() && !st.done) babyFaceEl.innerHTML = babyFace('sleep'); }, 550);
      },
      mobile(node) { A.play('lullaby', 0); U.replay(node, 'sway'); ctx.say('Cute, but not louder than that stereo.'); ctx.attempt(); },
      table() { A.play('tap'); ctx.say('Vibrating to the bass.'); ctx.attempt(); },
      rug() { A.play('tap'); ctx.say('Soft rug. Quiet footsteps.'); ctx.attempt(); },
      wall() { A.play('bonk'); ctx.say(U.pick(['Shhh!', 'Quietly…', 'Think outside the room.'])); ctx.attempt(); },
      floor() { A.play('creak'); ctx.say('Careful! Creaky floorboards!'); ctx.attempt(); },
    };
    I.taps(svg, (name, node) => { if (ctx.locked || st.done) return; if (taps[name]) taps[name](node); });

    const shh = ctx.promptEl.querySelector('#pw-shh');
    ctx.promptEl.onclick = (e) => {
      if (ctx.locked) return;
      if (e.target === shh) { U.replay(shh, 'hop'); A.play('shhh'); talk('SHHHHHH!', 1200); ctx.say('Shushing doesn’t stop a boombox.'); }
      else { A.play('tap'); ctx.say('Keep it down!'); }
    };
  }

  BF.levels = BF.levels || {};
  BF.levels[8] = L;
})(window.BF);

</script>
<script>
/* Brainflip — Level 9 (redesigned, indoor Home Sweet Home): "Stop the rain!"
   Cozy living room: it's 100% sunny outside the window, yet ONE grumpy personal storm cloud
   has moved into Noodle's living room and is soaking him in his favorite armchair.
   Main ending : turn the phone SIDEWAYS (landscape) — gravity slides the indoor cloud out
                 of the room! (dev key L; desktop/no-sensor fallback: rotate the crooked
                 "HOME" wall frame 90° sideways)                                  (verb: rotate phone)
   Secret #1   : drag the living room Vacuum Cleaner nozzle up onto the rain cloud
                 to suck the entire storm straight into the dust bag!              (verb: drag appliance)
   Secret #2   : put TWO fingers on the cloud and push together in one direction
                 (desktop fallback: scroll wheel / trackpad pinch on the cloud)    (verb: two-finger push)
   Decoys: tapping or 1-finger dragging the cloud makes it rain HARDER, inside-out umbrella,
           sunny outdoor window, overflowing floor bucket, living-room puddle rubber duck,
           delighted potted fern, soggy magazines, armchair. */
(function (BF) {
  'use strict';
  const U = BF.U, A = BF.audio, I = BF.input, ART = BF.art;
  const INK = '#1B1B2F', YELLOW = '#FFC93C', PINK = '#FF5D8F', MINT = '#3DDC97', SKY = '#5BC0EB', RED = '#FF5964', ORANGE = '#FF6B35';
  const W = 'stroke-linecap="round" stroke-linejoin="round"';
  const S = `stroke="${INK}" stroke-width="3.4" ${W}`;

  const ND0 = { x: 195, y: 408 };
  const CLOUD0 = { x: 195, y: 202 };
  const FRAME_NAIL = { x: 314, y: 58 };
  const VAC0 = { x: 332, y: 458 };
  const NOZZLE0 = { x: 312, y: 378 };

  function cloudSVG(mood = 'angry') {
    const face = mood === 'panic'
      ? `<circle cx="-16" cy="-4" r="7" fill="#fff" stroke="${INK}" stroke-width="2.6"/><circle cx="-16" cy="-4" r="2.6" fill="${INK}"/>` +
        `<circle cx="16" cy="-4" r="7" fill="#fff" stroke="${INK}" stroke-width="2.6"/><circle cx="16" cy="-4" r="2.6" fill="${INK}"/>` +
        `<ellipse cx="0" cy="11" rx="7" ry="9" fill="${INK}"/>`
      : mood === 'happy'
        ? `<path d="M-24,-4 Q-16,-12 -8,-4 M8,-4 Q16,-12 24,-4" fill="none" stroke="${INK}" stroke-width="3.2" ${W}/>` +
          `<path d="M-12,9 Q0,18 12,9" fill="none" stroke="${INK}" stroke-width="3" ${W}/>`
        : `<circle cx="-17" cy="-2" r="3.6" fill="${INK}"/><circle cx="16" cy="-2" r="3.6" fill="${INK}"/>` +
          `<path d="M-30,-16 L-12,-9 M14,-9 L31,-16" stroke="${INK}" stroke-width="3.4" ${W}/>` +
          `<path d="M-13,13 Q0,5 13,13" fill="none" stroke="${INK}" stroke-width="3" ${W}/>`;
    return `
      <path d="M-62,16 C-80,16 -88,2 -80,-12 C-88,-30 -69,-44 -52,-38 C-48,-59 -16,-63 -9,-42 C3,-61 34,-58 37,-38 C55,-44 72,-29 64,-12 C78,-4 68,16 50,16 Z"
            fill="#8EA0B8" stroke="${INK}" stroke-width="3.5" ${W}/>
      <path d="M-46,3 C-40,-13 -19,-21 -5,-12" fill="none" stroke="#C5D1E0" stroke-width="6" ${W} opacity=".85"/>
      ${face}`;
  }

  function vacuumBodySVG() {
    return `
      <!-- chunky retro canister vacuum -->
      <rect x="-32" y="-14" width="64" height="36" rx="18" fill="${PINK}" ${S}/>
      <path d="M-20,-14 Q0,-24 20,-14" fill="none" stroke="${INK}" stroke-width="5.5" ${W}/>
      <path d="M-20,-14 Q0,-24 20,-14" fill="none" stroke="#FFF4DC" stroke-width="2.4" ${W}/>
      <!-- dust bag window -->
      <rect id="l9-vac-bag" x="-22" y="-6" width="24" height="16" rx="6" fill="#FFFDF6" stroke="${INK}" stroke-width="2.4"/>
      <path d="M-16,2 H-4" stroke="#B8C4D4" stroke-width="3" stroke-linecap="round"/>
      <!-- power button -->
      <circle id="l9-vac-btn" cx="15" cy="2" r="7.5" fill="${YELLOW}" stroke="${INK}" stroke-width="2.4"/>

  const L = {
    id: 9,
    promptHTML: '<span class="pw" id="pw-rain">Stop the rain</span>!',
    endings: [

      if (kind === 'push') return [{ x: CLOUD0.x - 34, y: CLOUD0.y }, { x: CLOUD0.x + 86, y: CLOUD0.y }];

  function build(ctx) {
    ctx.root.innerHTML = sceneSVG();
    const svg = ctx.root.querySelector('svg');
    const q = (s) => svg.querySelector(s);

    const world = q('#l9-world');
    const ndAnim = q('#l9-nd-anim'), ndFace = q('#l9-nd-face'), ndArms = q('#l9-nd-arms'), ndDrops = q('#l9-nd-drops'), umbrellaWrap = q('#l9-umbrella-wrap');
    const cloudWrap = q('#l9-cloud-wrap'), cloudEl = q('#l9-cloud'), cloudArt = q('#l9-cloud-art');
    const rainLayer = q('#l9-rain'), windLayer = q('#l9-wind'), puddle = q('#l9-puddle');
    const frameEl = q('#l9-frame'), bubble = q('#l9-bubble');
    const vacIn = q('#l9-vac-in'), vacBag = q('#l9-vac-bag'), vacBtn = q('#l9-vac-btn');
    const hoseInk = q('#l9-hose-ink'), hoseCore = q('#l9-hose-core');
    const nozzleEl = q('#l9-nozzle'), nozzleRot = q('#l9-nozzle-rot'), nozzleIn = q('#l9-nozzle-in');
    const fx = q('#l9-fx'), talkLayer = q('#l9-talk');

    const st = {
      done: false,
      cloudPos: { ...CLOUD0 },
      heldCloud: false,
      rainRate: 1,
      angry: 0,
      nozzle: { ...NOZZLE0 },
      holdingNozzle: false,
      frameAng: 0,
      holdingFrame: false,
      lastIdle: performance.now(),
    };

    const alive = () => ctx.alive;
    const setFace = (o) => { ndFace.innerHTML = ART.noodleFace(o); };
    const setArms = (t) => { ndArms.innerHTML = ART.noodleArms(t, YELLOW); };
    const talk = (text, ms = 1900) => ctx.talk(talkLayer, ND0.x, ND0.y - 72, text, ms);

    function pop(x, y, text, color = YELLOW, size = 18) {
      const el = U.svgEl('text', {
        x, y, 'text-anchor': 'middle', 'font-family': 'Lilita One, sans-serif', 'font-size': size,
        fill: color, stroke: INK, 'stroke-width': 3.6, 'paint-order': 'stroke',
      }, fx);
      el.textContent = text;
      U.tween(720, (t) => {
        el.setAttribute('y', (y - t * 42).toFixed(1));
        el.setAttribute('opacity', (1 - t * t).toFixed(2));
      }, U.ease.outCubic).then(() => el.remove());
    }

    /* ---------- vacuum hose renderer ---------- */
    function renderHose() {
      const ax = VAC0.x - 16, ay = VAC0.y - 10;
      const nx = st.nozzle.x, ny = st.nozzle.y + 14;
      const mx = (ax + nx) / 2 + 16;
      const my = Math.max(ay, ny) + 22;
      const d = `M${ax},${ay} Q${mx.toFixed(1)},${my.toFixed(1)} ${nx.toFixed(1)},${ny.toFixed(1)}`;
      hoseInk.setAttribute('d', d);
      hoseCore.setAttribute('d', d);
      nozzleEl.setAttribute('transform', `translate(${st.nozzle.x.toFixed(1)},${st.nozzle.y.toFixed(1)})`);
      const ang = st.holdingNozzle ? U.clamp((st.nozzle.x - CLOUD0.x) * -0.22, -38, 38) : -14;
      nozzleRot.setAttribute('transform', `rotate(${ang.toFixed(1)})`);
    }

    /* ---------- indoor rain drops ---------- */
    const drops = [];
    for (let i = 0; i < 16; i++) {
      const el = U.svgEl('ellipse', { rx: 2.5, ry: 6.5, fill: '#9CE0FF', stroke: '#3FA4D6', 'stroke-width': 1.2 }, rainLayer);
      drops.push({ el, x: 0, y: 0, v: 0 });
    }
    function seed(d, randomY = false) {
      d.x = st.cloudPos.x + U.rand(-52, 52);
      d.y = st.cloudPos.y + (randomY ? U.rand(18, 250) : U.rand(18, 34));
      d.v = U.rand(230, 345) * st.rainRate;
    }
    drops.forEach((d) => seed(d, true));

    function celebrateDry(talkLine) {
      ndDrops.setAttribute('opacity', '0');
      umbrellaWrap.setAttribute('opacity', '0');
      setFace({ eyes: 'happy', mouth: 'grin' });
      setArms('up');
      U.replay(ndAnim, 'hop');
      talk(talkLine, 2200);
    }

    /* ---------- ENDING 1 (MAIN): SIDEWAYS EXIT (Landscape rotate OR rotate wall frame!) ---------- */
    async function winSlide(dir = 1) {
      if (st.done || !alive()) return;
      st.done = true; ctx.locked = true;
      A.play('whoosh'); U.haptic([20, 40, 20]);
      ctx.say('Gravity just went sideways!');
      const from = { ...st.cloudPos };
      windLayer.setAttribute('opacity', '.9');
      await U.tween(720, (t) => {
        if (!alive()) return;
        cloudWrap.setAttribute('transform', `translate(${U.lerp(from.x, from.x + dir * 480, t).toFixed(1)},${(from.y + Math.sin(t * Math.PI) * -18).toFixed(1)}) rotate(${(dir * t * 18).toFixed(1)})`);
        rainLayer.setAttribute('transform', `translate(${U.lerp(0, dir * 480, t).toFixed(1)},0)`);
        puddle.setAttribute('opacity', (1 - t * 0.7).toFixed(2));
      }, U.ease.inCubic);
      if (!alive()) return;
      cloudWrap.setAttribute('opacity', '0'); rainLayer.setAttribute('opacity', '0'); windLayer.setAttribute('opacity', '0');
      const bow = U.svgEl('g', { opacity: 0 }, fx);
      [PINK, YELLOW, MINT, SKY].forEach((c, i) => {
        U.svgEl('path', { d: `M${78 + i * 9},326 A${117 - i * 9},${117 - i * 9} 0 0 1 ${312 - i * 9},326`, fill: 'none', stroke: c, 'stroke-width': 7.5, 'stroke-linecap': 'round' }, bow);
      });
      A.play('chirp');
      await U.tween(480, (t) => bow.setAttribute('opacity', t.toFixed(2)));
      if (!alive()) return;
      celebrateDry('FINALLY DRY!!');
      ctx.say('Even indoor weather obeys sideways gravity.');
      await U.wait(820);
      if (alive()) ctx.win('slide');
    }

    /* ---------- ENDING 2 (SECRET #1): STORM VACUUMED! ---------- */
    async function winVacuum() {
      if (st.done || !alive()) return;
      st.done = true; ctx.locked = true;
      st.holdingNozzle = false;
      vacBtn.setAttribute('fill', MINT);
      cloudArt.innerHTML = cloudSVG('panic');
      A.play('rumble'); A.play('whoosh'); U.haptic([24, 30, 60]);
      pop(st.cloudPos.x, st.cloudPos.y - 64, 'WAIT—NO!!', '#fff', 19);

      // Park nozzle right beside the panicked cloud
      const targetNoz = { x: st.cloudPos.x + 54, y: st.cloudPos.y + 18 };
      const fromNoz = { ...st.nozzle };
      await U.tween(180, (t) => {
        if (!alive()) return;
        st.nozzle = { x: U.lerp(fromNoz.x, targetNoz.x, t), y: U.lerp(fromNoz.y, targetNoz.y, t) };
        renderHose();
        nozzleRot.setAttribute('transform', 'rotate(-52)');
      });
      if (!alive()) return;

      // Suction wind streaks + taffy-stretch cloud straight into the nozzle!
      const fromC = { ...st.cloudPos };
      const suckX = targetNoz.x - 10, suckY = targetNoz.y - 14;
      await U.tween(860, (t) => {
        if (!alive()) return;
        const cx = U.lerp(fromC.x, suckX, t);
        const cy = U.lerp(fromC.y, suckY, t);
        const sx = Math.max(0.05, 1 - t * 0.94);
        const sy = Math.max(0.05, (1 - t * 0.94) * (1 - Math.sin(t * Math.PI) * 0.35));
        cloudWrap.setAttribute('transform', `translate(${cx.toFixed(1)},${cy.toFixed(1)}) rotate(${(t * 28).toFixed(1)}) scale(${sx.toFixed(3)},${sy.toFixed(3)})`);
        rainLayer.setAttribute('opacity', (1 - t).toFixed(2));
        puddle.setAttribute('opacity', (1 - t * 0.65).toFixed(2));
      }, U.ease.inCubic);
      if (!alive()) return;

      cloudWrap.setAttribute('opacity', '0');
      rainLayer.setAttribute('opacity', '0');
      A.play('pop');
      vacBag.setAttribute('fill', '#8EA0B8');
      U.replay(vacIn, 'hop');
      pop(VAC0.x, VAC0.y - 44, 'SCHLURP!!', MINT, 19);
      celebrateDry('HOUSEKEEPING WINS!!');
      ctx.say('2000 watts of pure indoor weather control.');
      await U.wait(860);
      if (alive()) ctx.win('vacuum');
    }

    /* ---------- ENDING 3 (SECRET #2): TWO-HAND EVICTION! ---------- */

      if (st.done || !alive()) return;
      st.done = true; ctx.locked = true;
      A.play('whoosh'); U.haptic([25, 50, 25]);
      cloudArt.innerHTML = cloudSVG('panic');
      await U.tween(150, (t) => {
        if (!alive()) return;
        cloudArt.setAttribute('transform', `scale(${(1 - t * .22).toFixed(2)},${(1 + t * .14).toFixed(2)})`);
      });
      if (!alive()) return;
      cloudArt.setAttribute('transform', '');
      A.play('thunder'); U.replay(world, 'quake');
      const from = { ...st.cloudPos };
      await U.tween(600, (t) => {
        if (!alive()) return;
        cloudWrap.setAttribute('transform', `translate(${U.lerp(from.x, from.x + dir * 520, t).toFixed(1)},${(from.y - Math.sin(t * Math.PI) * 90).toFixed(1)}) rotate(${(dir * t * 65).toFixed(1)})`);
        rainLayer.setAttribute('opacity', (1 - t).toFixed(2));
      }, U.ease.outCubic);
      if (!alive()) return;
      cloudWrap.setAttribute('opacity', '0'); rainLayer.setAttribute('opacity', '0');
      celebrateDry('OUT OF MY HOUSE!!');
      ctx.say('One finger annoyed it. Two fingers evicted it.');
      await U.wait(820);
      if (alive()) ctx.win('shove');
    }

    /* ---------- DRAG: Grumpy Cloud with 1 finger = DECOY (rains harder & snaps back!) ---------- */
    I.drag(cloudEl, svg, {
      onStart() {
        if (ctx.locked || st.done) return;
        st.heldCloud = true;
        A.play('tap'); ctx.attempt();
      },
      onMove(p, d) {
        if (ctx.locked || st.done || !st.heldCloud || fingers.size >= 2) return;
        // Rubbery resistance — refuses to leave with just 1 finger!
        const x = CLOUD0.x + U.clamp(d.dx * 0.36, -54, 54);
        const y = CLOUD0.y + U.clamp(d.dy * 0.28, -28, 34);
        st.cloudPos = { x, y };
        cloudWrap.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)})`);
        if (Math.hypot(d.dx, d.dy) > 26 && st.angry < 3) {
          st.angry++;
          st.rainRate = Math.min(2.2, st.rainRate + 0.35);
          A.play('thunder'); U.haptic(16);
          pop(x, y - 62, U.pick(['GRRR!', 'TOO HEAVY!', 'RAIN HARDER!']), '#DCE6F2', 18);
          talk('One finger just made it angrier!');
          ctx.say('Too stubborn for one finger — now it is raining harder.');
        }
      },
      onTap() {
        st.heldCloud = false;
        if (ctx.locked || st.done) return;

        pop(CLOUD0.x, CLOUD0.y - 62, 'POUR!', SKY, 17);
        ctx.say('Great. Tapping it just boosted the indoor downpour.');

      },
      async onEnd() {
        st.heldCloud = false;
        if (ctx.locked || st.done) return;
        const sx = st.cloudPos.x, sy = st.cloudPos.y;
        await U.tween(300, (t) => {
          if (!alive() || st.done || st.heldCloud) return;
          cloudWrap.setAttribute('transform', `translate(${U.lerp(sx, CLOUD0.x, t).toFixed(1)},${U.lerp(sy, CLOUD0.y, t).toFixed(1)})`);
        }, U.ease.outBack);
        st.cloudPos = { ...CLOUD0 };
      },
    });

    /* ---------- TWO-FINGER PUSH on Cloud (Secret #2) + desktop wheel fallback ---------- */
    const fingers = new Map();
    let gesture = null;
    const onPtrDown = (e) => {
      if (ctx.locked || st.done || !e.target.closest('#l9-cloud')) return;
      fingers.set(e.pointerId, U.svgPoint(svg, e.clientX, e.clientY));
      if (fingers.size === 2) {
        st.heldCloud = false;
        const [a, b] = [...fingers.values()];
        gesture = { cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
      }
    };
    const onPtrMove = (e) => {
      if (!gesture || ctx.locked || st.done || !fingers.has(e.pointerId)) return;
      fingers.set(e.pointerId, U.svgPoint(svg, e.clientX, e.clientY));
      if (fingers.size !== 2) return;
      const [a, b] = [...fingers.values()];
      const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      if (Math.hypot(cx - gesture.cx, cy - gesture.cy) > 58) {
        const dir = cx >= gesture.cx ? 1 : -1;
        gesture = null; fingers.clear();
        winShove(dir);
      }
    };
    const onPtrUp = (e) => { fingers.delete(e.pointerId); if (fingers.size < 2) gesture = null; };
    const onWheel = (e) => {
      if (ctx.locked || st.done || !e.target.closest('#l9-cloud')) return;
      e.preventDefault();
      winShove(e.deltaX !== 0 ? Math.sign(e.deltaX) : 1);
    };
    svg.addEventListener('pointerdown', onPtrDown);
    svg.addEventListener('pointermove', onPtrMove);
    svg.addEventListener('pointerup', onPtrUp);
    svg.addEventListener('pointercancel', onPtrUp);
    svg.addEventListener('wheel', onWheel, { passive: false });
    ctx.onCleanup(() => {
      svg.removeEventListener('pointerdown', onPtrDown);
      svg.removeEventListener('pointermove', onPtrMove);
      svg.removeEventListener('pointerup', onPtrUp);
      svg.removeEventListener('pointercancel', onPtrUp);
      svg.removeEventListener('wheel', onWheel);
    });

    /* ---------- DRAG: Vacuum Cleaner Nozzle (Secret #1: Storm Vacuum!) ---------- */
    I.drag(nozzleEl, svg, {
      onStart() {
        if (ctx.locked || st.done) return;

        vacBtn.setAttribute('fill', MINT);

      onMove(p) {
        if (!st.holdingNozzle || ctx.locked || st.done) return;

        renderHose();
        if (Math.hypot(st.nozzle.x - st.cloudPos.x, st.nozzle.y - st.cloudPos.y) < 68) {
          winVacuum();
        }
      },
      onTap() {
        st.holdingNozzle = false;
        if (ctx.locked || st.done) return;
        vacBtn.setAttribute('fill', YELLOW);
        st.nozzle = { ...NOZZLE0 };

        A.play('whoosh'); U.replay(nozzleIn, 'wiggle');
        ctx.say('High-power vacuum nozzle. Drag it toward something messy!');
      },
      async onEnd() {
        if (!st.holdingNozzle || st.done) return;
        st.holdingNozzle = false;
        vacBtn.setAttribute('fill', YELLOW);
        const from = { ...st.nozzle };
        await U.tween(280, (t) => {
          if (!alive() || st.done || st.holdingNozzle) return;
          st.nozzle = { x: U.lerp(from.x, NOZZLE0.x, t), y: U.lerp(from.y, NOZZLE0.y, t) };
          renderHose();
        }, U.ease.outBack);
      },
    });

    /* ---------- DRAG: Crooked "HOME" Frame (Diegetic sideways-gravity desktop fallback!) ---------- */
    I.drag(frameEl, svg, {
      onStart() {
        if (ctx.locked || st.done) return;
        st.holdingFrame = true;
        A.play('creak'); ctx.attempt();
      },
      onMove(p) {
        if (!st.holdingFrame || ctx.locked || st.done) return;
        const ang = (Math.atan2(p.y - FRAME_NAIL.y, p.x - FRAME_NAIL.x) * 180) / Math.PI - 90;
        const norm = ((ang + 540) % 360) - 180;
        st.frameAng = U.clamp(norm, -100, 100);
        frameEl.setAttribute('transform', `rotate(${st.frameAng.toFixed(1)})`);
        bubble.setAttribute('cx', U.clamp(-st.frameAng * 0.25, -20, 20).toFixed(1));
        if (Math.abs(st.frameAng) > 68) {
          st.holdingFrame = false;
          winSlide(st.frameAng > 0 ? -1 : 1);
        }
      },
      onTap() {
        st.holdingFrame = false;
        if (ctx.locked || st.done) return;
        A.play('creak');
        U.tween(320, (t) => {
          if (!alive() || st.holdingFrame || st.done) return;
          frameEl.setAttribute('transform', `rotate(${(Math.sin(t * Math.PI * 2) * 14).toFixed(1)})`);
        });
        ctx.say('A wall level! Swings sideways if you turn it — or turn your phone.');
      },
      async onEnd() {
        if (!st.holdingFrame || st.done) return;
        st.holdingFrame = false;
        const from = st.frameAng;
        await U.tween(300, (t) => {
          if (!alive() || st.holdingFrame || st.done) return;
          st.frameAng = U.lerp(from, 0, t);
          frameEl.setAttribute('transform', `rotate(${st.frameAng.toFixed(1)})`);
          bubble.setAttribute('cx', U.clamp(-st.frameAng * 0.25, -20, 20).toFixed(1));
        }, U.ease.outBack);
      },
    });

    ctx.onCleanup(I.onLandscape((dir) => { if (!ctx.locked && !st.done) winSlide(dir || 1); }));
    ctx.onCleanup(() => I.clearLandscape());

    /* ---------- ANIMATION LOOP ---------- */
    let last = performance.now();
    (function loop(now) {
      if (!alive()) return;
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (!st.done) {
        drops.forEach((d) => {
          d.y += d.v * dt;

          d.el.setAttribute('cy', d.y.toFixed(1));

          bubble.setAttribute('cx', U.clamp(tilt * 0.35, -20, 20).toFixed(1));
        }
        windLayer.setAttribute('opacity', (I.landscapeProgress * 0.85).toFixed(2));

        if (now - st.lastIdle > 11000) {
          st.lastIdle = now;
          ctx.say(U.pick([
            'Sunny outside. Torrential inside.',
            'My living room rug is legally a swamp now.',
            'Who invited a thundercloud indoors?',
          ]));
        }
      }
      requestAnimationFrame(loop);
    })(last);
    svg.addEventListener('pointerdown', () => { st.lastIdle = performance.now(); });

    /* ---------- TAP REACTIONS (all inner .fb, zero jump-to-(0,0)!) ---------- */
    const taps = {
      noodle() {

      },
      umbrella(node) {
        ctx.attempt(); A.play('drip'); U.replay(node, 'wiggle');
        ctx.say('Inside-out umbrella. Basically a portable soup bowl now.');
      },
      window() {
        ctx.attempt(); A.play('chirp'); U.replay(q('#l9-sun'), 'wiggle');
        ctx.say('Blue skies and sunshine outside. The storm chose the living room.');
      },
      vacuum(node) {
        ctx.attempt(); A.play('whoosh'); U.replay(node, 'wiggle');
        ctx.say('2000-watt living room vacuum. Grab the nozzle on top!');
      },
      fern(node) {
        ctx.attempt(); A.play('chirp'); U.replay(node, 'hop');
        ctx.say('The houseplant is thriving. Literally nobody else is.');
      },
      bucket(node) {
        ctx.attempt(); A.play('splash'); U.replay(node, 'wiggle');
        pop(102, 456, 'FULL!', SKY, 15);
        ctx.say('Bucket is already overflowing.');
      },
      duck(node) {
        ctx.attempt(); A.play('squeak'); U.replay(node, 'hop');
        pop(242, 502, 'QUACK!', YELLOW, 15);
        ctx.say('The rubber duck rates this living room five stars.');
      },
      puddle() { ctx.attempt(); A.play('splash'); ctx.say('Congratulations, your hardwood floor is now a pond.'); },
      chair() { ctx.attempt(); A.play('boing'); ctx.say('Soggy cushion. Squish, squish.'); },
      tableL() { ctx.attempt(); A.play('thud'); ctx.say('Dry oak table… mostly.'); },
      rug() { ctx.attempt(); A.play('splash'); ctx.say('Wet rug. Nature’s cold socks.'); },
      wall() { ctx.attempt(); A.play('tap'); ctx.say('Cozy indoor wallpaper. Not rated for thunderstorms.'); },
      floor() { ctx.attempt(); A.play('thud'); ctx.say('Slippery when rained on indoors.'); },
    };
    I.taps(svg, (name, node) => { if (ctx.locked || st.done) return; if (taps[name]) taps[name](node); });

    const onPromptClick = (e) => {
      if (ctx.locked || st.done) return;
      if (e.target.id === 'pw-rain') {
        U.replay(e.target, 'wiggle'); A.play('drip');
        ctx.say('The indoor cloud heard that as encouragement.');
      } else {
        A.play('tap');
        ctx.say('Home sweet soggy home.');
      }
    };
    ctx.promptEl.addEventListener('click', onPromptClick);
    ctx.onCleanup(() => ctx.promptEl.removeEventListener('click', onPromptClick));

    renderHose();
  }

  BF.levels = BF.levels || {};
  BF.levels[9] = L;
})(window.BF);

    function pop(x, y, text, color = YELLOW, size = 18) {
      const el = U.svgEl('text', {
        x, y, 'text-anchor': 'middle', 'font-family': 'Lilita One, sans-serif', 'font-size': size,
        fill: color, stroke: INK, 'stroke-width': 3.6, 'paint-order': 'stroke',
      }, fx);
      el.textContent = text;
      U.tween(740, (t) => {
        el.setAttribute('y', (y - t * 42).toFixed(1));
        el.setAttribute('opacity', (1 - t * t).toFixed(2));
      }, U.ease.outCubic).then(() => el.remove());
    }

    function sparkBurst(x, y, count = 8, color = YELLOW) {
      for (let i = 0; i < count; i++) {
        const a = (i / count) * Math.PI * 2 + U.rand(-0.22, 0.22);
        const r0 = 32;
        const r1 = U.rand(52, 76);
        const dot = U.svgEl('circle', { cx: x + Math.cos(a) * r0, cy: y + Math.sin(a) * r0, r: U.rand(3, 5), fill: i % 2 ? color : '#fff', stroke: INK, 'stroke-width': 1.8 }, fx);
        U.tween(480, (t) => {
          const r = U.lerp(r0, r1, t);
          dot.setAttribute('cx', (x + Math.cos(a) * r).toFixed(1));
          dot.setAttribute('cy', (y + Math.sin(a) * r).toFixed(1));
          dot.setAttribute('opacity', (1 - t).toFixed(2));
        }, U.ease.outCubic).then(() => dot.remove());
      }
    }

    function paintPhone(bossDead = false) {
      phoneG.innerHTML = phoneInnerSVG(st.level, bossDead);
      glow.setAttribute('fill', st.level > 20 ? MINT : RED);
      glow.setAttribute('opacity', st.level > 20 ? '.26' : '.18');

    function outletAnchor() {
      return { x: st.outlet.x + 2, y: st.outlet.y + 12 };
    }

    function renderOutletAndCord(taut = false) {
      const rot = st.outletMoved ? 0 : -4;
      outletEl.setAttribute('transform', `translate(${st.outlet.x.toFixed(1)},${st.outlet.y.toFixed(1)}) rotate(${rot})`);

      const movedDist = Math.hypot(st.outlet.x - OUTLET0.x, st.outlet.y - OUTLET0.y);
      const showWires = movedDist > 8;
      wallHole.setAttribute('opacity', showWires ? '1' : '0');
      crack.setAttribute('opacity', showWires ? '0' : '1');
      [wireR, wireRi, wireB, wireBi].forEach((w) => w.setAttribute('opacity', showWires ? '1' : '0'));
      if (showWires) {
        const mx = (OUTLET0.x + st.outlet.x) / 2;
        const my = (OUTLET0.y + st.outlet.y) / 2;
        const d1 = `M${OUTLET0.x - 4},${OUTLET0.y - 6} Q${mx.toFixed(1)},${(my - 26).toFixed(1)} ${st.outlet.x.toFixed(1)},${(st.outlet.y - 4).toFixed(1)}`;
        const d2 = `M${OUTLET0.x + 4},${OUTLET0.y + 8} Q${mx.toFixed(1)},${(my + 28).toFixed(1)} ${st.outlet.x.toFixed(1)},${(st.outlet.y + 6).toFixed(1)}`;
        wireR.setAttribute('d', d1); wireRi.setAttribute('d', d1);
        wireB.setAttribute('d', d2); wireBi.setAttribute('d', d2);
      }

      const a = outletAnchor();
      const dx = st.plug.x - a.x, dy = st.plug.y - a.y;
      const dist = Math.hypot(dx, dy);
      const sag = taut ? 0 : Math.max(0, (MAX_CORD - dist) * 0.36);
      const cx = (a.x + st.plug.x) / 2;
      const cy = (a.y + st.plug.y) / 2 + sag;
      const d = `M${a.x.toFixed(1)},${a.y.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${st.plug.x.toFixed(1)},${st.plug.y.toFixed(1)}`;
      cordInk.setAttribute('d', d);
      cordCore.setAttribute('d', d);

      const angle = (Math.atan2(st.plug.y - cy, st.plug.x - cx) * 180) / Math.PI + 90;
      plugEl.setAttribute('transform', `translate(${st.plug.x.toFixed(1)},${st.plug.y.toFixed(1)})`);
      plugRot.setAttribute('transform', `rotate(${angle.toFixed(1)})`);
    }

    function nearPhonePort(p, r = 44) {
      return Math.hypot(p.x - PHONE_PORT.x, p.y - PHONE_PORT.y) < r || Math.hypot(p.x - PHONE.x, p.y - PHONE.y) < r;
    }

    /* ---------- shared charging finale ---------- */
    async function finishCharge(endingId, talkLine, narrLine) {
      let lastStep = -1;
      const boltEl = U.svgEl('g', { transform: `translate(${PHONE.x},${PHONE.y - 60})`, opacity: 0 }, fx);

        if (!alive()) return;
        st.level = U.lerp(1, 100, t);
        paintPhone(t > 0.88);
        const step = Math.floor(t * 7);
        if (step > lastStep) { lastStep = step; A.play('charge', step); }
      }, U.ease.inOutCubic);
      if (!alive()) return;
      paintPhone(true);
      sparkBurst(PHONE.x, PHONE.y, 12, MINT);
      sweat.setAttribute('opacity', '0');
      setFace({ eyes: 'happy', mouth: 'grin' });
      setArms('up');
      U.replay(ndAnim, 'hop');
      talk(talkLine, 2200);
      ctx.say(narrLine);
      await U.wait(880);
      if (alive()) ctx.win(endingId);
    }

    function triggerTooShort() {
      const now = performance.now();
      if (now - st.lastTautAt < 700) return;
      st.lastTautAt = now;
      st.tautPulls++;
      A.play('creak'); U.haptic(14);
      // Visual clue: rattle the crooked wall outlet!
      const baseR = st.outletMoved ? 0 : -4;
      U.tween(260, (t) => {

        const j = Math.sin(t * Math.PI * 4) * 8 * (1 - t);
        outletEl.setAttribute('transform', `translate(${(st.outlet.x + j * 0.4).toFixed(1)},${st.outlet.y.toFixed(1)}) rotate(${(baseR + j).toFixed(1)})`);
      });
      pop(st.plug.x, st.plug.y - 26, 'TOO SHORT!', RED, 16);
      if (st.tautPulls === 1) {
        talk('Just two more inches!!');
        ctx.say('So close! The cord is two inches too short.');

        talk('Wait—the wall outlet just wiggled!');

    /* ---------- DRAG: Charger Plug (hits 2-inch wall unless outlet moved!) ---------- */
    let plugHitTaut = false;
    I.drag(plugEl, svg, {
      onStart() {
        if (ctx.locked || st.done) return;
        st.holdingPlug = true;
        plugHitTaut = false;
        A.play('tap');
        ctx.attempt();
      },
      onMove(p) {
        if (!st.holdingPlug || ctx.locked || st.done) return;
        const a = outletAnchor();
        let dx = p.x - a.x, dy = p.y - a.y;
        const dist = Math.hypot(dx, dy);
        let taut = false;
        if (dist > MAX_CORD) {
          taut = true;
          const k = MAX_CORD / dist;
          dx *= k; dy *= k;
        }
        st.plug = { x: U.clamp(a.x + dx, 14, 376), y: U.clamp(a.y + dy, 40, 590) };
        renderOutletAndCord(taut);

        if (st.outletMoved && nearPhonePort(st.plug, 42)) {
          winWallOutlet();
          return;
        }

        if (taut && dx > 35) {
          plugHitTaut = true;
          triggerTooShort();
        }
      },
      onTap() {
        st.holdingPlug = false;
        if (ctx.locked || st.done) return;
        A.play('tap');
        ctx.say(st.outletMoved ? 'Drag the plug right into Noodle’s phone!' : 'A real charger! Drag the plug over to his phone.');
      },
      async onEnd(p) {
        if (!st.holdingPlug || st.done) return;
        st.holdingPlug = false;
        const a = outletAnchor();
        if (!st.outletMoved && (plugHitTaut || (p.x - a.x > 65 && Math.hypot(p.x - a.x, p.y - a.y) > MAX_CORD - 14))) {
          triggerTooShort();
        }
        const from = { ...st.plug };
        const rest = { x: U.clamp(a.x + 48, 24, 366), y: U.clamp(a.y + 42, 80, 560) };
        await U.tween(280, (t) => {
          if (!alive() || st.done || st.holdingPlug) return;
          st.plug = { x: U.lerp(from.x, rest.x, t), y: U.lerp(from.y, rest.y, t) };
          renderOutletAndCord(false);
        }, U.ease.outBack);
      },
    });

    /* ---------- DRAG: Crooked Wall Outlet (Secret #1!) ---------- */
    I.drag(outletEl, svg, {
      onStart() {
        if (ctx.locked || st.done) return;
        st.holdingOutlet = true;
        A.play('creak'); U.haptic(14);
        ctx.attempt();
      },
      onMove(p) {
        if (!st.holdingOutlet || ctx.locked || st.done) return;
        const nx = U.clamp(p.x, 30, 354), ny = U.clamp(p.y, 180, 470);
        const dx = nx - st.outlet.x, dy = ny - st.outlet.y;
        st.outlet = { x: nx, y: ny };
        if (!st.outletMoved && Math.hypot(nx - OUTLET0.x, ny - OUTLET0.y) > 22) {
          st.outletMoved = true;

          pop(OUTLET0.x + 12, OUTLET0.y - 34, 'RIP!!', PINK, 17);
          talk('Wait… ARE YOU MOVING THE WALL?!');

        // Carry the plug smoothly along with the moved outlet
        st.plug = {
          x: U.clamp(st.plug.x + dx, 18, 372),
          y: U.clamp(st.plug.y + dy, 80, 580),
        };
        renderOutletAndCord(false);

        // If dragged very close to Noodle's phone, auto-snap the dangling plug right in!
        const a = outletAnchor();
        if (Math.hypot(a.x - PHONE_PORT.x, a.y - PHONE_PORT.y) < 92 || nearPhonePort(st.plug, 36)) {
          winWallOutlet();
        }
      },
      onTap() {
        st.holdingOutlet = false;

        A.play('creak'); U.haptic(10);

        });
        ctx.say('Whoa… this wall outlet is completely loose!');
      },
      onEnd() {
        if (!st.holdingOutlet || st.done) return;
        st.holdingOutlet = false;
        A.play('thud');
        const distToPort = Math.hypot(outletAnchor().x - PHONE_PORT.x, outletAnchor().y - PHONE_PORT.y);
        if (distToPort <= MAX_CORD - 4) {
          ctx.say('Nice! Now the cord easily reaches the phone.');
        } else if (st.outletMoved) {
          ctx.say('Drag the outlet a little closer to Noodle!');

    });

    const lampHalo = q('#l11-lamp-halo'), lampBulb = q('#l11-lamp-bulb'), calTxt = q('#l11-cal-txt'), cocoaSteam = q('#l11-cocoa-steam');
    const fx = q('#l11-fx'), talkLayer = q('#l11-talk');

    const st = {
      done: false,
      dawn: 0,           // current visual dawn [0..1]
      clockRad: 0,       // accumulated clockwise radians on wall clock
      holdingClock: false,
      holdingMoon: false,
      lampOn: false,
      calCount: 0,
      lastTouchAt: performance.now(),
      patienceWhispered: false,
      lastTickIdx: 0,
    };

    const alive = () => ctx.alive;
    const setFace = (o) => { ndFace.innerHTML = ART.noodleFace(o); };
    const setArms = (t) => { ndArms.innerHTML = ART.noodleArms(t, YELLOW); };
    const talk = (text, ms = 1950) => ctx.talk(talkLayer, ND0.x, ND0.y - 68, text, ms);

    function pop(x, y, text, color = YELLOW, size = 18) {
      const el = U.svgEl('text', {
        x, y, 'text-anchor': 'middle', 'font-family': 'Lilita One, sans-serif', 'font-size': size,
        fill: color, stroke: INK, 'stroke-width': 3.6, 'paint-order': 'stroke',
      }, fx);
      el.textContent = text;
      U.tween(720, (t) => {
        el.setAttribute('y', (y - t * 42).toFixed(1));
        el.setAttribute('opacity', (1 - t * t).toFixed(2));
      }, U.ease.outCubic).then(() => el.remove());
    }

    /* ---------- smoothly morphs night -> dawn -> bright sunrise ---------- */
    function applyDawn(p) {
      p = U.clamp(p, 0, 1);
      st.dawn = p;
      const topC = p < 0.5 ? U.lerpColor('#171A48', '#52448F', p * 2) : U.lerpColor('#52448F', '#5BC0EB', (p - 0.5) * 2);
      const midC = p < 0.5 ? U.lerpColor('#282C6A', '#B85C8A', p * 2) : U.lerpColor('#B85C8A', '#9DE2FF', (p - 0.5) * 2);
      const botC = p < 0.55 ? U.lerpColor('#3B3D82', '#FF9666', p / 0.55) : U.lerpColor('#FF9666', '#FFF3B0', (p - 0.55) / 0.45);
      skyTop.setAttribute('stop-color', topC);
      skyMid.setAttribute('stop-color', midC);
      skyBot.setAttribute('stop-color', botC);

      wall.setAttribute('fill', U.lerpColor('#2F336E', '#FFF4DC', Math.pow(p, 1.15)));
      floor.setAttribute('fill', U.lerpColor('#9A6845', '#E8A86C', p));
      hillBack.setAttribute('fill', U.lerpColor('#233754', '#72D17E', p));
      hillFront.setAttribute('fill', U.lerpColor('#1D4B4E', '#3EB868', p));

      stars.setAttribute('opacity', U.clamp(1 - p * 1.8, 0, 1).toFixed(2));
      if (!st.holdingMoon) {
        const mx = MOON0.x - p * 34;
        const my = MOON0.y + p * 110;
        moonWrap.setAttribute('transform', `translate(${mx.toFixed(1)},${my.toFixed(1)})`);
        moonWrap.setAttribute('opacity', U.clamp(1 - p * 1.4, 0, 1).toFixed(2));
      }

      const sunT = U.clamp((p - 0.35) / 0.65, 0, 1);
      const sy = U.lerp(238, 108, sunT);
      sunWrap.setAttribute('transform', `translate(166,${sy.toFixed(1)})`);
      sunWrap.setAttribute('opacity', (sunT > 0.02 ? 1 : 0).toString());
      rays.setAttribute('opacity', (U.clamp((p - 0.65) / 0.35, 0, 1) * 0.24).toFixed(2));
    }

    function updateClockVisuals(progress) {
      // progress 0 = 11:55 PM, progress 1 = 6:00 AM (365 minutes)
      const totalMins = Math.round(progress * 365);
      const minsFromMidnight = (23 * 60 + 55 + totalMins) % (24 * 60);
      const h24 = Math.floor(minsFromMidnight / 60);
      const m = minsFromMidnight % 60;
      const ampm = h24 >= 12 ? 'PM' : 'AM';
      const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
      clockTxt.textContent = `${h12}:${String(m).padStart(2, '0')} ${ampm}`;
      const hDeg = ((h24 % 12) + m / 60) * 30;
      const mDeg = m * 6;
      handH.setAttribute('transform', `rotate(${hDeg.toFixed(1)})`);
      handM.setAttribute('transform', `rotate(${mDeg.toFixed(1)})`);
    }

    /* ---------- SHARED SUNRISE CELEBRATION ---------- */
    async function winSunrise(endingId, talkLine, narrLine) {
      if (st.done || !alive()) return;
      st.done = true; ctx.locked = true;
      st.holdingClock = false; st.holdingMoon = false;
      const startDawn = st.dawn;
      A.play('chirp'); U.haptic([18, 36, 22]);
      await U.tween(Math.max(420, (1 - startDawn) * 1100), (t) => {
        if (!alive()) return;
        const p = U.lerp(startDawn, 1, t);
        applyDawn(p);
        updateClockVisuals(p);
      }, U.ease.inOutCubic);
      if (!alive()) return;
      applyDawn(1);
      updateClockVisuals(1);
      calTxt.textContent = 'DAWN!';
      setFace({ eyes: 'happy', mouth: 'grin' });
      setArms('up');
      U.replay(ndAnim, 'hop');
      pop(ND0.x, ND0.y - 78, 'GOOD MORNING!', YELLOW, 20);
      talk(talkLine, 2200);
      ctx.say(narrLine);
      await U.wait(860);
      if (alive()) ctx.win(endingId);
    }

    /* ---------- ENDING 1 (MAIN): LEAVE APP & RETURN ---------- */
    ctx.onCleanup(I.onAppReturn(() => {
      if (ctx.locked || st.done) return;
      winSunrise('brb', "OH! YOU'RE BACK — IT'S MORNING!!", 'You left the game. Time kept moving without you.');
    }));

    /* ---------- ENDING 3 (SECRET #2): SPIN WALL CLOCK TO 6:00 AM ---------- */
    let prevAngle = null;
    I.drag(clockEl, svg, {
      onStart(p) {
        if (ctx.locked || st.done) return;
        st.holdingClock = true;
        prevAngle = Math.atan2(p.y - CLOCK.y, p.x - CLOCK.x);
        A.play('tap'); ctx.attempt();
      },
      onMove(p) {
        if (!st.holdingClock || ctx.locked || st.done) return;
        const a = Math.atan2(p.y - CLOCK.y, p.x - CLOCK.x);
        let da = a - prevAngle;
        while (da > Math.PI) da -= Math.PI * 2;
        while (da < -Math.PI) da += Math.PI * 2;
        prevAngle = a;

        st.clockRad = U.clamp(st.clockRad + da, -1.1, NEED_RAD);
        if (st.clockRad < -0.75) {
          A.play('wobble');
          talk('Whoa—that is YESTERDAY!!');
          ctx.say('Wrong way! Spin clockwise toward 6:00 AM.');
          st.clockRad = -0.3;
        }
        const prog = U.clamp(st.clockRad / NEED_RAD, 0, 1);
        updateClockVisuals(prog);
        applyDawn(prog);

        const tickIdx = Math.floor(st.clockRad / (Math.PI / 3));
        if (tickIdx !== st.lastTickIdx) {
          st.lastTickIdx = tickIdx;
          A.play('click');
        }
        if (prog >= 0.98) {
          winSunrise('clock', 'WAIT—DID YOU FAST-FORWARD TIME?!', 'Why wait for 6:00 AM when you own the clock?');
        }
      },
      onTap() {
        st.holdingClock = false;
        if (ctx.locked || st.done) return;
        A.play('click'); U.replay(clockEl, 'wiggle');
        ctx.say('11:55 PM. Sunrise is at 6:00 AM. If only the hands moved faster…');
      },
      onEnd() {
        st.holdingClock = false;
        prevAngle = null;
      },
    });

    /* ---------- DECOY: DRAGGING THE MOON DOWN (Level 1 Callback!) ---------- */
    I.drag(moonEl, svg, {
      onStart() {
        if (ctx.locked || st.done) return;
        st.holdingMoon = true;
        A.play('tap'); ctx.attempt();
      },
      onMove(p, d) {
        if (!st.holdingMoon || ctx.locked || st.done) return;
        const x = MOON0.x + U.clamp(d.dx * 0.4, -24, 24);
        const y = MOON0.y + U.clamp(d.dy * 0.45, -16, 46);
        moonWrap.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)})`);
      },
      onTap() {
        st.holdingMoon = false;
        if (ctx.locked || st.done) return;
        A.play('giggle'); U.replay(moonEl, 'wiggle');
        ctx.say('The moon is on night shift until 6:00 AM.');
      },
      async onEnd(p, d) {
        if (!st.holdingMoon || st.done) return;
        st.holdingMoon = false;
        A.play('boing');
        const fromX = MOON0.x + U.clamp(d.dx * 0.4, -24, 24);
        const fromY = MOON0.y + U.clamp(d.dy * 0.45, -16, 46);
        await U.tween(320, (t) => {
          if (!alive() || st.done || st.holdingMoon) return;
          moonWrap.setAttribute('transform', `translate(${U.lerp(fromX, MOON0.x, t).toFixed(1)},${U.lerp(fromY, MOON0.y, t).toFixed(1)})`);
        }, U.ease.outBack);
        pop(MOON0.x + 20, MOON0.y + 10, 'NOPE!', '#FFF3B0', 16);
        ctx.say('That worked on the sun in Level 1 — the moon refuses to clock out early.');
      },
    });

    /* ---------- RESET PATIENCE TIMER ON ANY INTERACTION ---------- */
    const onAnyTouch = () => {
      if (st.done || ctx.locked) return;
      const idleMs = performance.now() - st.lastTouchAt;
      st.lastTouchAt = performance.now();
      // If player was partway through Patience and poked something (not the clock!), notify gently
      if (idleMs > 6500 && st.clockRad < 0.25 && !st.holdingClock) {
        st.patienceWhispered = false;
        ctx.say('Oops! You startled the sunrise back into midnight.');
      }
    };
    svg.addEventListener('pointerdown', onAnyTouch);
    ctx.promptEl.addEventListener('pointerdown', onAnyTouch);
    ctx.onCleanup(() => ctx.promptEl.removeEventListener('pointerdown', onAnyTouch));

    /* ---------- ANIMATION LOOP (Ending 2: Pure Patience after 15s untouched!) ---------- */
    (function loop(now) {
      if (!alive()) return;
      if (!st.done) {
        cocoaSteam.setAttribute('transform', `translate(${(Math.sin(now / 420) * 1.4).toFixed(1)},${(Math.cos(now / 360) * 1.5).toFixed(1)})`);

        const idleMs = now - st.lastTouchAt;
        const clockProg = U.clamp(st.clockRad / NEED_RAD, 0, 1);

        if (!st.holdingClock && !st.holdingMoon) {
          // After 3.5s hands-off, night gently begins melting into dawn!
          const patienceProg = U.clamp((idleMs - 3500) / (IDLE_WIN_MS - 3500), 0, 1);
          const targetDawn = Math.max(clockProg, patienceProg);
          // Smoothly ease visual dawn toward targetDawn (so resetting patience glides back softly)
          const nextDawn = st.dawn + (targetDawn - st.dawn) * 0.08;
          if (Math.abs(nextDawn - st.dawn) > 0.0005) {
            applyDawn(nextDawn);
            if (patienceProg > clockProg) updateClockVisuals(nextDawn);
          }

          if (patienceProg > 0.35 && !st.patienceWhispered) {
            st.patienceWhispered = true;
            talk('Shhh… stay still… the sky is brightening!', 2400);
          }
          if (idleMs >= IDLE_WIN_MS) {
            winSunrise('patient', 'PATIENCE ACTUALLY PAID OFF!!', 'Fifteen seconds of doing literally nothing. Zen master.');
            return;
          }
        }
      }
      requestAnimationFrame(loop);
    })(performance.now());

    /* ---------- TAP REACTIONS (all inner .fb, zero jump-to-(0,0)!) ---------- */
    const taps = {
      noodle() {
        ctx.attempt(); A.play('wobble'); U.replay(ndAnim, 'hop');
        talk(U.pick(['Is it morning yet?', 'I hate waiting…', 'Six hours to go!']));
        ctx.say('Watching the clock makes time slower. Proven science.');
      },
      lamp(node) {
        ctx.attempt(); A.play('click'); U.replay(node, 'wiggle');
        st.lampOn = !st.lampOn;
        lampHalo.setAttribute('opacity', st.lampOn ? '.95' : '0');
        lampBulb.setAttribute('opacity', st.lampOn ? '1' : '.3');
        ctx.say(st.lampOn ? 'Nice try. A bedside lamp is not a sunrise.' : 'Back to dramatic midnight lighting.');
      },
      calendar(node) {
        ctx.attempt(); A.play('swish'); U.replay(node, 'wiggle');
        st.calCount++;
        const labels = ['STILL', 'NIGHT', 'NOPE', '11:55'];
        calTxt.textContent = labels[st.calCount % labels.length];
        ctx.say('Flipped a page. Still midnight.');
      },
      brbSign(node) {
        ctx.attempt(); A.play('creak'); U.replay(node, 'wiggle');
        ctx.say('“B.R.B. — Back At Dawn.” Sometimes walking away is the fastest wait.');
      },
      cocoa(node) {
        ctx.attempt(); A.play('clink'); U.replay(node, 'wiggle');
        ctx.say('Warm midnight cocoa. Keeps Noodle awake for the sunrise.');
      },
      pillow(node) {
        ctx.attempt(); A.play('boing'); U.replay(node, 'wiggle');
        ctx.say('No hidden sun under the pillow.');
      },
      slippers(node) {
        ctx.attempt(); A.play('squeak'); U.replay(node, 'hop');
        ctx.say('Cozy bunny slippers. Ready for morning.');
      },
      sky() { ctx.attempt(); A.play('tap'); ctx.say('Still midnight out there.'); },
      bench() { ctx.attempt(); A.play('thud'); ctx.say('Front-row seat for sunrise.'); },
      nightstand() { ctx.attempt(); A.play('thud'); ctx.say('Just a lamp and a stubborn calendar.'); },
      rug() { ctx.attempt(); A.play('swish'); ctx.say('Soft rug. Zero time machines underneath.'); },
      wall() { ctx.attempt(); A.play('tap'); ctx.say('Waiting… waiting…'); },
      floor() { ctx.attempt(); A.play('thud'); ctx.say('Creaky midnight floorboards.'); },
    };
    I.taps(svg, (name, node) => { if (ctx.locked || st.done) return; if (taps[name]) taps[name](node); });

    const onPromptClick = (e) => {
      if (ctx.locked || st.done) return;
      if (e.target.id === 'pw-wait') { U.replay(e.target, 'wiggle'); A.play('tap'); ctx.say('Waiting is the hardest verb in gaming.'); }
      else if (e.target.id === 'pw-sun') { U.replay(e.target, 'wiggle'); A.play('tap'); ctx.say('Scheduled for 6:00 AM sharp.'); }
    };
    ctx.promptEl.addEventListener('click', onPromptClick);
    ctx.onCleanup(() => ctx.promptEl.removeEventListener('click', onPromptClick));

    applyDawn(0);
    updateClockVisuals(0);
  }

  BF.levels = BF.levels || {};
  BF.levels[11] = L;
})(window.BF);

</script>
<script>

                 into the 5 FT–6 FT green zone, then release! (desktop: scroll wheel UP)  (verb: object pinch)
   Secret #1   : keep stretching Noodle PAST 6 FT into the ceiling so his spaghetti body
                 snaps into a giant pretzel knot!                                         (verb: over-stretch)
   Secret #2   : attach the bicycle air-pump hose to Noodle and pump the handle 3 times
                 to inflate him into a towering 5 FT balloon-Noodle!                      (verb: attach + pump)

(function (BF) {

  const INK = '#1B1B2F', YELLOW = '#FFC93C', PINK = '#FF5D8F', MINT = '#3DDC97', SKY = '#5BC0EB', ORANGE = '#FF6B35', RED = '#FF5964';

        <path d="M-44,12 C-66,-22 -32,-62 0,-36 C32,-62 66,-22 44,12 C28,36 -28,36 -44,12 Z" fill="none" stroke="${YELLOW}" stroke-width="23" ${W}/>
        <path d="M-26,-16 C-6,-42 18,-10 0,14 C-18,36 22,42 36,16" fill="none" stroke="${INK}" stroke-width="24" ${W}/>
        <path d="M-26,-16 C-6,-42 18,-10 0,14 C-18,36 22,42 36,16" fill="none" stroke="${YELLOW}" stroke-width="17" ${W}/>
        <!-- dizzy Noodle face peeking out of the knot! -->
        <circle cx="0" cy="-12" r="28" fill="${YELLOW}" stroke="${INK}" stroke-width="3.4"/>
        <path d="${HAIR_D}" transform="translate(0,18) scale(.76)" fill="none" stroke="${INK}" stroke-width="8" ${W}/>
        <path d="${HAIR_D}" transform="translate(0,18) scale(.76)" fill="none" stroke="#FFE6A0" stroke-width="3.6" ${W}/>
        <g transform="translate(0,-12) scale(.85)">${ART.noodleFace({ eyes: 'spiral', mouth: 'o' })}</g>
        <!-- tiny tangled feet poking out -->
        <ellipse cx="-26" cy="48" rx="10" ry="5.5" fill="${YELLOW}" stroke="${INK}" stroke-width="3"/>
        <ellipse cx="26" cy="48" rx="10" ry="5.5" fill="${YELLOW}" stroke="${INK}" stroke-width="3"/>
      </g>`;
  }

  function sceneSVG() {
    return `

    <!-- ============ HOME DOORWAY GROWTH CHART (Center Wall) ============ -->
    <g id="l12-chart" data-tap="chart">
      <rect x="128" y="40" width="134" height="448" rx="10" fill="#FFFDF6" ${S}/>

      <rect x="142" y="54" width="106" height="26" rx="6" fill="${SKY}" stroke="${INK}" stroke-width="2.6"/>
      <text x="195" y="72" text-anchor="middle" font-family="Lilita One, sans-serif" font-size="12.5" fill="#fff">TALL CLUB</text>

      <!-- green target sweet-spot band between 5 FT and 6 FT -->
      <rect id="l12-zone" x="138" y="${Y_6FT}" width="114" height="${Y_5FT - Y_6FT}" fill="${MINT}" opacity=".16" pointer-events="none"/>

      <!-- ruler ticks & labels -->
      <g stroke="${INK}" stroke-width="2.4" stroke-linecap="round">
        <path d="M138,${Y_6FT} H162 M228,${Y_6FT} H252"/>
        <path d="M138,${Y_5FT} H164 M226,${Y_5FT} H252"/>
        <path d="M138,${Y_4FT} H156 M234,${Y_4FT} H252"/>
        <path d="M138,${Y_3FT} H156 M234,${Y_3FT} H252"/>
        <path d="M138,${Y_2FT} H152 M238,${Y_2FT} H252"/>
        <!-- half-foot mini ticks -->
        <path d="M138,${Y_5FT - 28} H148 M138,${Y_4FT - 28} H148 M138,${Y_3FT - 28} H148 M138,${Y_2FT - 28} H148" stroke-width="1.8" opacity=".55"/>
      </g>
      <text x="166" y="${Y_6FT + 4}" font-family="Fredoka, sans-serif" font-weight="700" font-size="11.5" fill="${INK}">6ft</text>
      <text x="162" y="${Y_4FT + 4}" font-family="Fredoka, sans-serif" font-weight="700" font-size="11.5" fill="${INK}">4ft</text>
      <text x="162" y="${Y_3FT + 4}" font-family="Fredoka, sans-serif" font-weight="700" font-size="11.5" fill="${INK}">3ft</text>
      <text x="160" y="${Y_2FT + 4}" font-family="Fredoka, sans-serif" font-weight="700" font-size="11.5" fill="${INK}">2ft</text>

      <!-- ceiling warning line at 6 FT -->
      <path d="M138,${Y_6FT} H252" stroke="${ORANGE}" stroke-width="2" stroke-dasharray="4 5" opacity=".6"/>

      <!-- bold 5 FT TARGET LINE -->

  const L = {
    id: 12,
    promptHTML: 'Make him <span class="pw" id="pw-tall">taller</span>!',
    endings: [
      { id: 'stretch', name: 'Growth Spurt', line: 'Two fingers, zero milk required.', rarity: 48, icon: 'l12stretch', stamp: 'TALL ENOUGH!' },
      { id: 'knot', name: 'Over-Noodled', line: 'Pulled too far. Officially a pretzel now.', rarity: 26, icon: 'l12knot', stamp: 'KNOTTED!' },

  function build(ctx) {
    ctx.root.innerHTML = sceneSVG();
    const svg = ctx.root.querySelector('svg');
    const q = (s) => svg.querySelector(s);

    const ndWrap = q('#l12-noodle-wrap'), ndAnim = q('#l12-nd-anim'), ndNormal = q('#l12-nd-normal'), ndKnot = q('#l12-nd-knot');
    const ndTorso = q('#l12-nd-torso'), ndShine = q('#l12-nd-shine'), ndHead = q('#l12-nd-head'), ndFace = q('#l12-nd-face'), ndArms = q('#l12-nd-arms');
    const targetLine = q('#l12-target-line'), targetPill = q('#l12-target-pill'), targetTxt = q('#l12-target-txt'), zone = q('#l12-zone');
    const hatEl = q('#l12-hat'), hatIn = q('#l12-hat-in');
    const milkEl = q('#l12-milk'), milkIn = q('#l12-milk-in');
    const pumpHandle = q('#l12-pump-handle'), gauge = q('#l12-gauge');
    const hoseInk = q('#l12-hose-ink'), hoseCore = q('#l12-hose-core'), hoseTip = q('#l12-hose-tip'), hoseTipIn = q('#l12-hose-tip-in');
    const fx = q('#l12-fx'), talkLayer = q('#l12-talk');

    const st = {
      done: false,
      stretch: 1.0,       // 1.0 = 3 FT (headTop 364), 2.08 = 5 FT (252), 2.65+ = ceiling knot!
      inflate: 0,         // 0..3 pumps from bicycle pump!
      milkBonus: 0,       // tiny +2px joke from drinking milk
      holdingNoodle: false,
      jumping: false,
      holdingHat: false,
      hatBusy: false,
      holdingMilk: false,
      milkBusy: false,
      hoseAttached: false,
      holdingHose: false,
      hosePos: { ...NOZ0 },
      pumping: false,
      wheelTimer: 0,
      lastIdle: performance.now(),
    };

    const alive = () => ctx.alive;
    const setFace = (o) => { ndFace.innerHTML = ART.noodleFace(o); };
    const setArms = (t) => { ndArms.innerHTML = ART.noodleArms(t, YELLOW); };
    const talk = (text, ms = 1900) => {
      const topY = ND0.y + currentTopY() - 26;
      ctx.talk(talkLayer, ND0.x, Math.max(20, topY), text, ms);
    };

    function pop(x, y, text, color = YELLOW, size = 18) {
      const el = U.svgEl('text', {
        x, y, 'text-anchor': 'middle', 'font-family': 'Lilita One, sans-serif', 'font-size': size,
        fill: color, stroke: INK, 'stroke-width': 3.6, 'paint-order': 'stroke',
      }, fx);
      el.textContent = text;
      U.tween(720, (t) => {
        el.setAttribute('y', (y - t * 42).toFixed(1));
        el.setAttribute('opacity', (1 - t * t).toFixed(2));
      }, U.ease.outCubic).then(() => el.remove());
    }

    function currentTopY() {
      const baseH = 104 * st.stretch + st.inflate * 39 + st.milkBonus;
      return 52 - baseH;
    }

    /* ---------- renders stretchy AND/OR inflated Noodle cleanly without distorting face! ---------- */
    function renderNoodle() {
      const baseH = 104 * st.stretch + st.inflate * 39 + st.milkBonus;
      const topY = 52 - baseH;
      // Stretching slims him slightly like a noodle; pumping widens him like a balloon!
      const halfW = U.clamp(38 - (st.stretch - 1) * 7 + st.inflate * 13, 25, 76);
      const rx = Math.min(halfW, baseH / 2);

      ndTorso.setAttribute('x', (-halfW).toFixed(1));
      ndTorso.setAttribute('y', topY.toFixed(1));
      ndTorso.setAttribute('width', (halfW * 2).toFixed(1));
      ndTorso.setAttribute('height', baseH.toFixed(1));
      ndTorso.setAttribute('rx', rx.toFixed(1));

      const shineX = -halfW + 12;
      ndShine.setAttribute('d', `M${shineX.toFixed(1)},${(topY + 26).toFixed(1)} Q${(shineX - 4).toFixed(1)},${(topY + baseH * 0.45).toFixed(1)} ${shineX.toFixed(1)},${(topY + baseH - 26).toFixed(1)}`);

      const headShift = topY + 52; // 0 when baseH=104
      ndHead.setAttribute('transform', `translate(0,${headShift.toFixed(1)})`);
      ndArms.setAttribute('transform', `translate(0,${(headShift * 0.72).toFixed(1)})`);

      const worldHeadTop = ND0.y + topY;
      const inGreen = worldHeadTop <= Y_5FT + 4 && worldHeadTop >= Y_6FT - 4;
      const tooHigh = worldHeadTop < Y_6FT - 4;

      targetLine.setAttribute('stroke', inGreen ? MINT : tooHigh ? ORANGE : PINK);
      targetPill.setAttribute('fill', inGreen ? MINT : tooHigh ? ORANGE : PINK);
      targetTxt.textContent = inGreen ? '5 FT ✓' : tooHigh ? 'TOO TALL!' : '5 FT ★';
      zone.setAttribute('opacity', inGreen ? '.38' : '.16');

      if (st.hoseAttached) {
        st.hosePos = { x: ND0.x + halfW + 6, y: ND0.y + 12 };
        renderHose();
      }
    }

    function renderHose() {
      const ax = PUMP.x - 14, ay = PUMP.y + 38;
      const nx = st.hosePos.x, ny = st.hosePos.y;
      const mx = (ax + nx) / 2;
      const my = Math.max(ay, ny) + 28;
      const d = `M${ax},${ay} Q${mx.toFixed(1)},${my.toFixed(1)} ${nx.toFixed(1)},${ny.toFixed(1)}`;
      hoseInk.setAttribute('d', d);
      hoseCore.setAttribute('d', d);
      hoseTip.setAttribute('transform', `translate(${nx.toFixed(1)},${ny.toFixed(1)})`);
    }

    /* ---------- ENDING 1 (MAIN): GROWTH SPURT (Stretch into 5 FT – 6 FT Green Zone!) ---------- */
    async function winStretch() {
      if (st.done || !alive()) return;
      st.done = true; ctx.locked = true;
      clearTimeout(st.wheelTimer);
      A.play('boing'); U.haptic([18, 36, 20]);
      setFace({ eyes: 'happy', mouth: 'grin' });
      setArms('up');

      talk('WHOA! I CAN SEE THE TOP SHELF!', 2200);

      await U.wait(840);
      if (alive()) ctx.win('stretch');

    /* ---------- ENDING 2 (SECRET #1): OVER-NOODLED (Stretched past 6 FT -> Pretzel Knot!) ---------- */
    async function winKnot() {
      if (st.done || !alive()) return;

      ctx.talk(talkLayer, ND0.x, ND0.y - 68, 'Officially a pretzel now…', 2200);

      if (alive()) ctx.win('knot');

    /* ---------- ENDING 3 (SECRET #2): PUMPED UP! (Bicycle Air Pump!) ---------- */
    async function doPumpStroke() {
      if (st.done || ctx.locked || st.pumping) return;
      st.pumping = true;
      ctx.attempt();
      A.play('puff'); U.haptic(18);

      // Plunge yellow T-handle smoothly down & back up!
      await U.tween(150, (t) => {
        if (!alive()) return;
        pumpHandle.setAttribute('transform', `translate(0,${(t * 28).toFixed(1)})`);
      }, U.ease.inCubic);
      if (!alive()) return;

      if (!st.hoseAttached) {
        // Funny decoy puff into empty air if hose isn't attached yet!
        pop(st.hosePos.x - 16, st.hosePos.y - 16, 'PSSSH!', SKY, 16);
        ctx.say('Great workout! Maybe connect the hose to Noodle first?');
        await U.tween(180, (t) => {
          if (!alive()) return;
          pumpHandle.setAttribute('transform', `translate(0,${U.lerp(28, 0, t).toFixed(1)})`);
        }, U.ease.outBack);
        st.pumping = false;
        return;
      }

      const nextInf = st.inflate + 1;
      const startInf = st.inflate;
      gauge.setAttribute('transform', `translate(-18,18) rotate(${(-55 + nextInf * 38).toFixed(0)})`);

      await Promise.all([
        U.tween(240, (t) => {
          if (!alive()) return;
          st.inflate = U.lerp(startInf, nextInf, t);
          renderNoodle();
        }, U.ease.outBack),
        U.tween(200, (t) => {
          if (!alive()) return;
          pumpHandle.setAttribute('transform', `translate(0,${U.lerp(28, 0, t).toFixed(1)})`);
        }, U.ease.outBack),
      ]);
      if (!alive()) return;
      st.inflate = nextInf;
      renderNoodle();
      st.pumping = false;

      if (nextInf === 1) {
        A.play('squeak');
        setFace({ eyes: 'wide', mouth: 'o' });
        pop(ND0.x, ND0.y + currentTopY() - 20, 'PUFF!', SKY, 18);
        talk('WHOA—I AM EXPANDING!');
        ctx.say('1 pump! Keep pumping!');
      } else if (nextInf === 2) {
        A.play('squeak');
        setFace({ eyes: 'wide', mouth: 'bigO' });
        setArms('shrug');
        pop(ND0.x, ND0.y + currentTopY() - 20, 'BIGGER!!', YELLOW, 19);

      } else {

        setFace({ eyes: 'happy', mouth: 'grin' });
