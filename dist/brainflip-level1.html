          renderNoodle();
          pop(ND0.x + 48, ND0.y - 10, 'CONNECTED!', MINT, 16);
          talk('Wait… why did you plug a pump into me?!');
          ctx.say('Hose connected! Now push the yellow pump handle!');
        }
      },
      onTap() {
        st.holdingHose = false;
        if (ctx.locked || st.done) return;
        if (st.hoseAttached) {
          A.play('tap'); ctx.say('Already hooked up! Push the yellow pump handle!');
          return;
        }
        st.hosePos = { ...NOZ0 }; renderHose();
        A.play('tap'); U.replay(hoseTipIn, 'wiggle');
        ctx.say('Air pump nozzle. Wonder what happens if you connect it…');
      },
      async onEnd() {
        if (!st.holdingHose || st.done || st.hoseAttached) return;
        st.holdingHose = false;
        const from = { ...st.hosePos };
        await U.tween(260, (t) => {
          if (!alive() || st.done || st.holdingHose || st.hoseAttached) return;
          st.hosePos = { x: U.lerp(from.x, NOZ0.x, t), y: U.lerp(from.y, NOZ0.y, t) };
          renderHose();
        }, U.ease.outBack);
      },
    });

    /* ---------- NOODLE: 1-Finger Vertical Drag = DECOY JUMP! ---------- */
    I.drag(ndAnim, svg, {
      onStart() {
        if (ctx.locked || st.done || fingers.size >= 2) return;
        st.holdingNoodle = true;
        ctx.attempt();
      },
      onMove(p, d) {
        if (!st.holdingNoodle || ctx.locked || st.done || st.jumping || fingers.size >= 2) return;
        if (d.dy < -28) {
          st.holdingNoodle = false;
          st.jumping = true;
          A.play('boing'); U.haptic(14);
          setFace({ eyes: 'wide', mouth: 'o' });
          setArms('up');
          U.tween(480, (t) => {
            if (!alive() || st.done) return;
            const jumpY = -Math.sin(t * Math.PI) * 76;
            ndWrap.setAttribute('transform', `translate(${ND0.x},${(ND0.y + jumpY).toFixed(1)})`);
          }, U.ease.linear).then(() => {
            if (!alive() || st.done) return;
            ndWrap.setAttribute('transform', `translate(${ND0.x},${ND0.y})`);
            setFace({ eyes: 'open', mouth: 'frown' });
            setArms('relax');
            A.play('thud');
            pop(ND0.x, ND0.y + currentTopY() - 24, 'NO JUMPING!', RED, 17);
            talk('Jumping doesn’t count! Feet on the floor!');
            ctx.say('One finger only makes him jump. Try stretching with two.');
            st.jumping = false;
          });
        }
      },
      onTap() {
        st.holdingNoodle = false;
        if (ctx.locked || st.done || st.jumping) return;
        A.play('squeak'); U.replay(ndAnim, 'hop');
        pop(ND0.x, ND0.y + currentTopY() - 20, '3 FT!', PINK, 18);
        talk(U.pick(['Tippy-toes! …okay, still 3 feet.', 'I am very tall on the inside!']));
        ctx.say('Still three feet tall.');
      },
      onEnd() { st.holdingNoodle = false; },
    });

    /* ---------- TWO-FINGER PINCH-OUT ON NOODLE (Main + Over-Stretch Secret #1!) ---------- */
    function checkStretchThresholds(isRelease = false) {
      const worldHeadTop = ND0.y + currentTopY();
      if (worldHeadTop < Y_6FT - 6) {
        winKnot();
        return;
      }
      if (isRelease && worldHeadTop <= Y_5FT + 6 && worldHeadTop >= Y_6FT - 6) {
        winStretch();
        return;
      }
      if (isRelease && st.stretch > 1.04 && !st.done) {
        // Released too early (below 5 FT) -> boings back down!
        const from = st.stretch;
        A.play('boing');
        ctx.say('Almost! Stretch him all the way into the 5 FT zone before letting go!');
        U.tween(320, (t) => {
          if (!alive() || st.done || fingers.size >= 2) return;
          st.stretch = U.lerp(from, 1.0, t);
          renderNoodle();
        }, U.ease.outBack).then(() => {
          if (!st.done) { setFace({ eyes: 'open', mouth: 'frown' }); setArms('relax'); }
        });
      }
    }

    const fingers = new Map();
    let pinch = null;
    const onPtrDown = (e) => {
      if (ctx.locked || st.done || st.inflate > 0) return;
      const pt = U.svgPoint(svg, e.clientX, e.clientY);
      // Generous pinch zone around Noodle & the growth chart!
      if (pt.x < 95 || pt.x > 295 || pt.y < 140 || pt.y > 510) return;
      fingers.set(e.pointerId, pt);
      if (fingers.size === 2) {
        st.holdingNoodle = false;
        const [a, b] = [...fingers.values()];
        pinch = { d0: Math.max(24, Math.hypot(a.x - b.x, a.y - b.y)), s0: st.stretch };
        setFace({ eyes: 'wide', mouth: 'o' });
        A.play('wobble');
      }
    };
    const onPtrMove = (e) => {
      if (!pinch || ctx.locked || st.done || !fingers.has(e.pointerId)) return;
      fingers.set(e.pointerId, U.svgPoint(svg, e.clientX, e.clientY));
      if (fingers.size !== 2) return;
      const [a, b] = [...fingers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const ratio = d / pinch.d0;
      st.stretch = U.clamp(pinch.s0 + (ratio - 1) * 1.35, 0.92, 2.75);
      renderNoodle();
      const headTop = ND0.y + currentTopY();
      if (headTop <= Y_5FT + 6 && headTop >= Y_6FT - 6) setFace({ eyes: 'happy', mouth: 'grin' });
      else if (headTop < Y_6FT - 6) { pinch = null; fingers.clear(); winKnot(); }
    };
    const onPtrUp = (e) => {
      if (!fingers.has(e.pointerId)) return;
      const wasPinch = fingers.size === 2 && !!pinch;
      fingers.delete(e.pointerId);
      if (fingers.size < 2) {
        pinch = null;
        if (wasPinch && !st.done) checkStretchThresholds(true);
      }
    };

    /* Desktop fallback: Mouse Wheel UP over Noodle stretches him smoothly! */
    const onWheel = (e) => {
      if (ctx.locked || st.done || st.inflate > 0) return;
      const pt = U.svgPoint(svg, e.clientX, e.clientY);
      if (pt.x < 105 || pt.x > 285 || pt.y < 140 || pt.y > 510) return;
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.16 : -0.14;
      st.stretch = U.clamp(st.stretch + delta, 1.0, 2.75);
      renderNoodle();
      const headTop = ND0.y + currentTopY();
      if (headTop < Y_6FT - 6) { winKnot(); return; }
      if (headTop <= Y_5FT + 6) setFace({ eyes: 'happy', mouth: 'grin' });
      else setFace({ eyes: 'wide', mouth: 'o' });
      clearTimeout(st.wheelTimer);
      st.wheelTimer = setTimeout(() => {
        if (alive() && !st.done) checkStretchThresholds(true);
      }, 650);
    };

    svg.addEventListener('pointerdown', onPtrDown);
    svg.addEventListener('pointermove', onPtrMove);
    svg.addEventListener('pointerup', onPtrUp);
    svg.addEventListener('pointercancel', onPtrUp);
    svg.addEventListener('wheel', onWheel, { passive: false });
    ctx.onCleanup(() => {
      clearTimeout(st.wheelTimer);
      svg.removeEventListener('pointerdown', onPtrDown);
      svg.removeEventListener('pointermove', onPtrMove);
      svg.removeEventListener('pointerup', onPtrUp);
      svg.removeEventListener('pointercancel', onPtrUp);
      svg.removeEventListener('wheel', onWheel);
    });

    /* ---------- DECOY: TALL TOP HAT ("NO HATS!") ---------- */
    I.drag(hatEl, svg, {
      onStart() {
        if (ctx.locked || st.done || st.hatBusy) return;
        st.holdingHat = true; A.play('swish'); ctx.attempt();
      },
      onMove(p) {
        if (!st.holdingHat || ctx.locked || st.done) return;
        const x = U.clamp(p.x, 26, 364), y = U.clamp(p.y, 44, 540);
        hatEl.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)})`);
      },
      onTap() {
        st.holdingHat = false;
        if (ctx.locked || st.done || st.hatBusy) return;
        hatEl.setAttribute('transform', `translate(${HAT0.x},${HAT0.y})`);
        A.play('tap'); U.replay(hatIn, 'wiggle');
        ctx.say('A very tall top hat. Surely nobody will notice…');
      },
      async onEnd(p) {
        if (!st.holdingHat || st.done) return;
        st.holdingHat = false;
        const x = U.clamp(p.x, 26, 364), y = U.clamp(p.y, 44, 540);
        const headY = ND0.y + currentTopY();
        if (Math.hypot(x - ND0.x, y - headY) < 68) {
          st.hatBusy = true;
          hatEl.setAttribute('transform', `translate(${ND0.x},${(headY - 12).toFixed(1)})`);
          setFace({ eyes: 'happy', mouth: 'grin' });
          A.play('pop');
          talk('Does this count?!', 950);
          await U.wait(650);
          if (!alive() || st.done) return;
          A.play('bonk'); U.haptic(16);
          setFace({ eyes: 'open', mouth: 'frown' });
          pop(ND0.x, headY - 56, 'NO HATS!!', RED, 19);
          ctx.say('Nice try! Top hats are strictly banned by the Tall Club.');
          await U.tween(320, (t) => {
            if (!alive() || st.done) return;
            hatEl.setAttribute('transform', `translate(${U.lerp(ND0.x, HAT0.x, t).toFixed(1)},${U.lerp(headY - 12, HAT0.y, t).toFixed(1)})`);
          }, U.ease.outBack);
          st.hatBusy = false;
        } else {
          await U.tween(260, (t) => {
            if (!alive() || st.done || st.holdingHat) return;
            hatEl.setAttribute('transform', `translate(${U.lerp(x, HAT0.x, t).toFixed(1)},${U.lerp(y, HAT0.y, t).toFixed(1)})`);
          }, U.ease.outBack);
        }
      },
    });

    /* ---------- DECOY: GLASS OF MILK ("+2mm — takes 12 years!") ---------- */
    I.drag(milkEl, svg, {
      onStart() {
        if (ctx.locked || st.done || st.milkBusy) return;
        st.holdingMilk = true; A.play('clink'); ctx.attempt();
      },
      onMove(p) {
        if (!st.holdingMilk || ctx.locked || st.done) return;
        const x = U.clamp(p.x, 24, 366), y = U.clamp(p.y, 44, 540);
        milkEl.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)})`);
      },
      onTap() {
        st.holdingMilk = false;
        if (ctx.locked || st.done || st.milkBusy) return;
        milkEl.setAttribute('transform', `translate(${MILK0.x},${MILK0.y})`);
        A.play('clink'); U.replay(milkIn, 'wiggle');
        ctx.say('Fresh calcium! Mom says it makes you grow tall.');
      },
      async onEnd(p) {
        if (!st.holdingMilk || st.done) return;
        st.holdingMilk = false;
        const x = U.clamp(p.x, 24, 366), y = U.clamp(p.y, 44, 540);
        if (Math.hypot(x - ND0.x, y - ND0.y) < 70) {
          st.milkBusy = true;
          A.play('pour', 0.4);
          await U.tween(240, (t) => {
            if (!alive()) return;
            milkEl.setAttribute('transform', `translate(${U.lerp(x, ND0.x - 28, t).toFixed(1)},${U.lerp(y, ND0.y - 16, t).toFixed(1)}) rotate(${(t * 58).toFixed(0)})`);
          });
          if (!alive() || st.done) return;
          st.milkBonus = Math.min(6, st.milkBonus + 2);
          renderNoodle();
          A.play('pop');
          pop(ND0.x, ND0.y + currentTopY() - 22, '+2mm!', SKY, 17);
          talk('3 feet and… two millimeters!');
          ctx.say('Milk takes 12 years. We have 30 seconds.');
          await U.tween(300, (t) => {
            if (!alive() || st.done) return;
            milkEl.setAttribute('transform', `translate(${U.lerp(ND0.x - 28, MILK0.x, t).toFixed(1)},${U.lerp(ND0.y - 16, MILK0.y, t).toFixed(1)})`);
          }, U.ease.outBack);
          st.milkBusy = false;
        } else {
          await U.tween(260, (t) => {
            if (!alive() || st.done || st.holdingMilk) return;
            milkEl.setAttribute('transform', `translate(${U.lerp(x, MILK0.x, t).toFixed(1)},${U.lerp(y, MILK0.y, t).toFixed(1)})`);
          }, U.ease.outBack);
        }
      },
    });

    /* ---------- IDLE COMEDY ---------- */
    (function loop(now) {
      if (!alive()) return;
      if (!st.done && now - st.lastIdle > 11000) {
        st.lastIdle = now;
        ctx.say(U.pick([
          'Three feet of pure determination.',
          'His name is literally Noodle. He is very stretchy.',
          'The Tall Club line is not going to reach itself.',
        ]));
      }
      requestAnimationFrame(loop);
    })(performance.now());
    svg.addEventListener('pointerdown', () => { st.lastIdle = performance.now(); });

    /* ---------- TAP REACTIONS (all inner .fb, zero jump-to-(0,0)!) ---------- */
    const taps = {
      poster(node) { ctx.attempt(); A.play('tap'); U.replay(node, 'wiggle'); ctx.say('“DREAM BIG.” Easy for a giraffe to say.'); },
      trophy(node) { ctx.attempt(); A.play('clink'); U.replay(node, 'wiggle'); ctx.say('Tall Club trophy. Minimum height: 5 feet.'); },
      pumpBody() { ctx.attempt(); A.play('puff'); ctx.say(st.hoseAttached ? 'Push the yellow handle on top!' : 'A bicycle air pump. Grab the nozzle on the left!'); },
      chart() { ctx.attempt(); A.play('tap'); ctx.say('Home growth chart. Noodle has been 3 feet tall since 2021.'); },
      rack() { ctx.attempt(); A.play('thud'); ctx.say('Hallway coat rack.'); },
      stool() { ctx.attempt(); A.play('thud'); ctx.say('Too tiny to stand on — and besides, that is cheating.'); },
      rug() { ctx.attempt(); A.play('swish'); ctx.say('Cozy hallway rug.'); },
      wall() { ctx.attempt(); A.play('tap'); ctx.say('Minty fresh hallway wall.'); },
      floor() { ctx.attempt(); A.play('thud'); ctx.say('Solid oak floor. Feet must stay right here.'); },
    };
    I.taps(svg, (name, node) => { if (ctx.locked || st.done) return; if (taps[name]) taps[name](node); });

    const onPromptClick = (e) => {
      if (ctx.locked || st.done) return;
      if (e.target.id === 'pw-tall') {
        U.replay(e.target, 'wiggle'); A.play('boing');
        ctx.say('Good stretch on the word. Now try Noodle.');
      }
    };
    ctx.promptEl.addEventListener('click', onPromptClick);
    ctx.onCleanup(() => ctx.promptEl.removeEventListener('click', onPromptClick));

    renderNoodle();
    renderHose();
  }

  BF.levels = BF.levels || {};
  BF.levels[12] = L;
})(window.BF);

</script>

    <g id="l13-shelf-l">

  const L = {
    id: 13,
    promptHTML: 'Open the <span class="pw" id="pw-jar">jar</span>!',
    endings: [
      { id: 'twist', name: 'Lefty Loosey', line: 'Two fingers and a tiny bit of physics.', rarity: 50, icon: 'l13twist', stamp: 'POPPED!' },
      { id: 'teeth', name: 'Noodle Jaws', line: 'Dentists hate this one weird trick.', rarity: 26, icon: 'l13teeth', stamp: 'CHOMP!' },
      { id: 'hotwater', name: 'Hot Water Trick', line: 'Grandma’s thermal expansion never misses.', rarity: 18, icon: 'l13hot', stamp: 'STEAM POP!' },
    ],
    hints(found) {
      if (!found.includes('twist')) return [
        { text: 'One finger cannot get enough grip on that stubborn metal lid.' },
        { text: 'Put TWO fingers on the red lid and twist counter-clockwise! (Desktop: scroll wheel UP on the lid.)', demo: 'twistLid' },
      ];
      if (!found.includes('teeth')) return [
        { text: 'Noodle really wants those pickles… maybe hand him the whole jar?' },
        { text: 'Drag the pickle jar body directly over to Noodle!', demo: 'toNoodle' },
      ];
      if (!found.includes('hotwater')) return [
        { text: 'Remember Grandma’s trick for stuck metal lids? Heat makes metal expand!' },
        { text: 'Turn on the RED hot tap (H) and hold the pickle jar under the steaming water!', demo: 'toSink' },
      ];
      return [{ text: 'All three endings found! Pickle feast!' }];
    },
    demo(kind) {
      if (kind === 'twistLid') return [{ x: JAR0.x + 26, y: JAR0.y - 44 }, { x: JAR0.x, y: JAR0.y - 58 }, { x: JAR0.x - 26, y: JAR0.y - 44 }];
      if (kind === 'toNoodle') return [{ x: JAR0.x, y: JAR0.y }, { x: ND0.x, y: ND0.y }];
      if (kind === 'toSink') return [{ x: JAR0.x, y: JAR0.y }, { x: SINK_SPOT.x, y: SINK_SPOT.y }];
      return null;
    },
    build,
  };

  function build(ctx) {
    ctx.root.innerHTML = sceneSVG();
    const svg = ctx.root.querySelector('svg');
    const q = (s) => svg.querySelector(s);

    const ndAnim = q('#l13-nd-anim'), ndFace = q('#l13-nd-face'), ndArms = q('#l13-nd-arms');
    const jarEl = q('#l13-jar'), jarIn = q('#l13-jar-in'), jarBody = q('#l13-jar-body');
    const lidWrap = q('#l13-lid-wrap'), lidEl = q('#l13-lid'), lidCap = q('#l13-lid-cap'), lidRidges = q('#l13-lid-ridges');
    const streamHot = q('#l13-stream-hot'), hotSteam = q('#l13-hot-steam'), streamCold = q('#l13-stream-cold');
    const spoonEl = q('#l13-spoon'), spoonIn = q('#l13-spoon-in');
    const mittEl = q('#l13-mitt'), mittIn = q('#l13-mitt-in');
    const fx = q('#l13-fx'), talkLayer = q('#l13-talk');

    const st = {
      done: false,
      jarPos: { ...JAR0 },
      inSink: false,
      holdingJar: false,
      twistProg: 0,       // 0..1 counter-clockwise unscrew progress
      hotOn: false,
      coldOn: false,
      holdingSpoon: false,
      holdingMitt: false,
      lastCreakAt: 0,
      lastIdle: performance.now(),
    };

    const alive = () => ctx.alive;
    const setFace = (o) => { ndFace.innerHTML = ART.noodleFace(o); };
    const setArms = (t) => { ndArms.innerHTML = ART.noodleArms(t, YELLOW); };
    const talk = (text, ms = 1900) => ctx.talk(talkLayer, ND0.x, ND0.y - 68, text, ms);

    function pop(x, y, text, color = YELLOW, size = 18) {
      const el = U.svgEl('text', {
        x, y, 'text-anchor': 'middle', 'font-family': 'Lilita One, sans-serif', 'font-size': size,
        fill: color, stroke: INK, 'stroke-width': 3.6, 'paint-order': 'stroke',
      }, fx);
      el.textContent = text;
      U.tween(720, (t) => {
        el.setAttribute('y', (y - t * 42).toFixed(1));
        el.setAttribute('opacity', (1 - t * t).toFixed(2));
      }, U.ease.outCubic).then(() => el.remove());
    }

    function renderLidTwist() {
      const lift = st.twistProg * 11;
      const shift = (st.twistProg * 28) % 11;
      lidWrap.setAttribute('transform', `translate(0,${(-42 - lift).toFixed(1)})`);
      lidRidges.setAttribute('transform', `translate(${(-shift).toFixed(1)},0)`);
    }

    function renderStreams() {
      streamHot.setAttribute('opacity', st.hotOn ? '1' : '0');
      streamCold.setAttribute('opacity', st.coldOn ? '1' : '0');
    }

    /* ---------- SHARED LID-POP FINALE ---------- */
    async function popLidAndWin(endingId, talkLine, narrLine, dir = 1) {
      A.play('pop'); A.play('boing'); U.haptic([24, 38, 22]);
      pop(st.jarPos.x, st.jarPos.y - 74, 'POP!!', MINT, 24);
      // Lid launches dramatically off the jar!
      await U.tween(540, (t) => {
        if (!alive()) return;
        const lx = dir * t * 92;
        const ly = -52 - Math.sin(t * Math.PI) * 110 + t * 34;
        lidWrap.setAttribute('transform', `translate(${lx.toFixed(1)},${ly.toFixed(1)}) rotate(${(dir * t * 240).toFixed(0)})`);
      }, U.ease.outCubic);
      if (!alive()) return;

      setFace({ eyes: 'happy', mouth: 'grin' });
      setArms('up');
      U.replay(ndAnim, 'hop');
      talk(talkLine, 2200);
      ctx.say(narrLine);
      await U.wait(820);
      if (alive()) ctx.win(endingId);
    }

    /* ---------- ENDING 1 (MAIN): TWO-FINGER TWIST ---------- */
    function winTwist() {
      if (st.done || !alive()) return;
      st.done = true; ctx.locked = true;
      popLidAndWin('twist', 'YES!! PICKLE TIME!!', 'Two fingers and a tiny bit of physics.', 1);
    }

    /* ---------- ENDING 2 (SECRET #1): NOODLE BITES IT OPEN! ---------- */
    async function winTeeth() {
      if (st.done || !alive()) return;
      st.done = true; ctx.locked = true;
      st.holdingJar = false;
      const from = { ...st.jarPos };
      const bitePos = { x: ND0.x + 28, y: ND0.y + 42 };
      await U.tween(220, (t) => {
        if (!alive()) return;
        st.jarPos = { x: U.lerp(from.x, bitePos.x, t), y: U.lerp(from.y, bitePos.y, t) };
        jarEl.setAttribute('transform', `translate(${st.jarPos.x.toFixed(1)},${st.jarPos.y.toFixed(1)}) rotate(${(-18 * t).toFixed(1)})`);
      }, U.ease.outCubic);
      if (!alive()) return;

      setFace({ eyes: 'squint', mouth: 'chatter' });
      setArms('hold');
      talk('STAND BACK. I HAVE TEETH.', 1200);
      A.play('crunch'); U.haptic([20, 25, 20, 25]);
      // Comical head-shake wrestling the metal lid!
      await U.tween(540, (t) => {
        if (!alive()) return;
        const sh = Math.sin(t * Math.PI * 10) * 6;
        jarEl.setAttribute('transform', `translate(${(bitePos.x + sh).toFixed(1)},${bitePos.y.toFixed(1)}) rotate(${(-18 + sh).toFixed(1)})`);
      });
      if (!alive()) return;
      jarEl.setAttribute('transform', `translate(${bitePos.x},${bitePos.y}) rotate(-12)`);
      await popLidAndWin('teeth', 'OW!! TOTALLY WORTH IT!!', 'Dentists hate this one weird trick.', 1);
    }

    /* ---------- ENDING 3 (SECRET #2): HOT WATER TRICK! ---------- */
    async function winHotWater() {
      if (st.done || !alive()) return;
      st.done = true; ctx.locked = true;
      st.holdingJar = false;
      const from = { ...st.jarPos };
      const under = { x: 308, y: 392 };
      await U.tween(220, (t) => {
        if (!alive()) return;
        st.jarPos = { x: U.lerp(from.x, under.x, t), y: U.lerp(from.y, under.y, t) };
        jarEl.setAttribute('transform', `translate(${st.jarPos.x.toFixed(1)},${st.jarPos.y.toFixed(1)})`);
      }, U.ease.outCubic);
      if (!alive()) return;

      A.play('pour', 0.6); A.play('shhh');
      pop(under.x, under.y - 78, 'STEAMING!', ORANGE, 18);
      // Heat expands the metal lid before popping!
      await U.tween(740, (t) => {
        if (!alive()) return;
        lidCap.setAttribute('fill', U.lerpColor(RED, ORANGE, t));
        lidEl.setAttribute('transform', `scale(${(1 + t * 0.14).toFixed(3)},${(1 + t * 0.08).toFixed(3)})`);
      }, U.ease.inOutCubic);
      if (!alive()) return;
      lidEl.setAttribute('transform', '');
      await popLidAndWin('hotwater', 'SCIENCE!! THERMAL EXPANSION!!', 'Grandma’s thermal expansion never misses.', -1);
    }

    function checkSinkReaction() {
      if (st.done || ctx.locked || !st.inSink) return;
      if (st.hotOn) {
        winHotWater();
      } else if (st.coldOn) {
        A.play('brrr'); U.haptic(14);
        U.replay(lidEl, 'wiggle');
        pop(SINK_SPOT.x, SINK_SPOT.y - 74, 'SHRUNK!', SKY, 17);
        talk('Cold water shrinks metal! Wrong tap!');
        ctx.say('Cold water shrinks metal — that made the lid even tighter!');
      }
    }

    /* ---------- DRAG: JAR BODY (Move whole jar to Noodle OR Sink!) ---------- */
    I.drag(jarBody, svg, {
      onStart() {
        if (ctx.locked || st.done || fingers.size >= 2) return;
        st.holdingJar = true;
        A.play('tap'); ctx.attempt();
      },
      onMove(p) {
        if (!st.holdingJar || ctx.locked || st.done || fingers.size >= 2) return;
        const x = U.clamp(p.x, 42, 348), y = U.clamp(p.y, 120, 412);
        st.jarPos = { x, y };
        jarEl.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)})`);
        if (Math.hypot(x - ND0.x, y - ND0.y) < 62) {
          winTeeth();
          return;
        }
        if (st.hotOn && Math.hypot(x - 308, y - 386) < 48) {
          st.inSink = true;
          winHotWater();
        }
      },
      onTap() {
        st.holdingJar = false;
        if (ctx.locked || st.done) return;
        A.play('clink'); U.replay(jarIn, 'wiggle');
        ctx.say('Crisp kosher dill pickles. Trapped behind impenetrable metal.');
      },
      async onEnd() {
        if (!st.holdingJar || st.done) return;
        st.holdingJar = false;
        const x = st.jarPos.x, y = st.jarPos.y;
        // Let the player park the jar neatly in the sink!
        if (Math.hypot(x - 314, y - 392) < 62) {
          st.inSink = true;
          const dest = { x: 308, y: 392 };
          await U.tween(220, (t) => {
            if (!alive() || st.done || st.holdingJar) return;
            st.jarPos = { x: U.lerp(x, dest.x, t), y: U.lerp(y, dest.y, t) };
            jarEl.setAttribute('transform', `translate(${st.jarPos.x.toFixed(1)},${st.jarPos.y.toFixed(1)})`);
          }, U.ease.outBack);
          A.play('thud');
          if (!st.hotOn && !st.coldOn) ctx.say('Jar is in the sink. Which tap loosens a metal lid?');
          else checkSinkReaction();
          return;
        }
        // Otherwise return to counter spot
        st.inSink = false;
        await U.tween(260, (t) => {
          if (!alive() || st.done || st.holdingJar) return;
          st.jarPos = { x: U.lerp(x, JAR0.x, t), y: U.lerp(y, JAR0.y, t) };
          jarEl.setAttribute('transform', `translate(${st.jarPos.x.toFixed(1)},${st.jarPos.y.toFixed(1)})`);
        }, U.ease.outBack);
        A.play('thud');
      },
    });

    /* ---------- DRAG: JAR LID with 1 finger = DECOY ("Too tight!") ---------- */
    I.drag(lidEl, svg, {
      onStart() {
        if (ctx.locked || st.done || fingers.size >= 2) return;
        ctx.attempt();
      },
      onMove(p, d) {
        if (ctx.locked || st.done || fingers.size >= 2) return;
        const now = performance.now();
        if (Math.hypot(d.dx, d.dy) > 16 && now - st.lastCreakAt > 800) {
          st.lastCreakAt = now;
          A.play('creak'); U.haptic(12);
          U.replay(lidEl, 'wiggle');
          pop(st.jarPos.x, st.jarPos.y - 68, 'TOO TIGHT!', RED, 16);
          ctx.say('One finger cannot twist it — try gripping with two fingers!');
        }
      },
      onTap() {
        if (ctx.locked || st.done || fingers.size >= 2) return;
        A.play('clink'); U.replay(lidEl, 'wiggle');
        pop(st.jarPos.x, st.jarPos.y - 68, 'CLINK!', SKY, 15);
        ctx.say('Tapping the lid only makes a nice clink sound.');
      },
      onEnd() {},
    });

    /* ---------- TWO-FINGER TWIST ON JAR LID (Main Ending!) + Desktop Wheel Fallback ---------- */
    const fingers = new Map();
    let prevAngle = null;
    function applyTwistDelta(deltaCCW) {
      if (st.done || ctx.locked) return;
      if (deltaCCW < -0.18) {
        const now = performance.now();
        if (now - st.lastCreakAt > 650) {
          st.lastCreakAt = now;
          A.play('creak'); U.replay(lidEl, 'wiggle');
          pop(st.jarPos.x, st.jarPos.y - 70, 'WRONG WAY!', ORANGE, 16);
          ctx.say('Lefty-loosey! Twist counter-clockwise!');
        }
        st.twistProg = Math.max(0, st.twistProg - 0.08);
        renderLidTwist();
        return;
      }
      if (deltaCCW > 0) {
        const prevTick = Math.floor(st.twistProg * 5);
        st.twistProg = U.clamp(st.twistProg + deltaCCW, 0, 1);
        renderLidTwist();
        if (Math.floor(st.twistProg * 5) > prevTick) { A.play('creak'); U.haptic(10); }
        if (st.twistProg >= 0.98) winTwist();
      }
    }

    const onPtrDown = (e) => {
      if (ctx.locked || st.done) return;
      const pt = U.svgPoint(svg, e.clientX, e.clientY);
      if (Math.hypot(pt.x - st.jarPos.x, pt.y - (st.jarPos.y - 18)) > 95) return;
      fingers.set(e.pointerId, pt);
      if (fingers.size === 2) {
        st.holdingJar = false;
        const [a, b] = [...fingers.values()];
        prevAngle = Math.atan2(b.y - a.y, b.x - a.x);
      }
    };
    const onPtrMove = (e) => {
      if (prevAngle === null || ctx.locked || st.done || !fingers.has(e.pointerId)) return;
      fingers.set(e.pointerId, U.svgPoint(svg, e.clientX, e.clientY));
      if (fingers.size !== 2) return;
      const [a, b] = [...fingers.values()];
      const aNow = Math.atan2(b.y - a.y, b.x - a.x);
      let da = aNow - prevAngle;
      while (da > Math.PI) da -= Math.PI * 2;
      while (da < -Math.PI) da += Math.PI * 2;
      prevAngle = aNow;
      // In SVG coords (+X right, +Y down), counter-clockwise is negative da!
      applyTwistDelta(-da / 1.05);
    };
    const onPtrUp = (e) => { fingers.delete(e.pointerId); if (fingers.size < 2) prevAngle = null; };

    /* Desktop fallback: scroll UP/LEFT over the jar unscrews the lid counter-clockwise! */
    const onWheel = (e) => {
      if (ctx.locked || st.done) return;
      const pt = U.svgPoint(svg, e.clientX, e.clientY);
      if (Math.hypot(pt.x - st.jarPos.x, pt.y - (st.jarPos.y - 20)) > 84) return;
      e.preventDefault();
      const ccw = (e.deltaY < 0 || e.deltaX < 0) ? 0.22 : -0.22;
      applyTwistDelta(ccw);
    };

    svg.addEventListener('pointerdown', onPtrDown);
    svg.addEventListener('pointermove', onPtrMove);
    svg.addEventListener('pointerup', onPtrUp);
    svg.addEventListener('pointercancel', onPtrUp);
    svg.addEventListener('wheel', onWheel, { passive: false });
    ctx.onCleanup(() => {
      svg.removeEventListener('pointerdown', onPtrDown);
      svg.removeEventListener('pointermove', onPtrMove);
      svg.removeEventListener('pointerup', onPtrUp);
      svg.removeEventListener('pointercancel', onPtrUp);
      svg.removeEventListener('wheel', onWheel);
    });

    /* ---------- DECOY: WOODEN SPOON (bangs on lid!) ---------- */
    I.drag(spoonEl, svg, {
      onStart() { if (!ctx.locked && !st.done) { st.holdingSpoon = true; A.play('tap'); ctx.attempt(); } },
      onMove(p) {
        if (!st.holdingSpoon || ctx.locked || st.done) return;
        spoonEl.setAttribute('transform', `translate(${U.clamp(p.x, 24, 366).toFixed(1)},${U.clamp(p.y, 44, 520).toFixed(1)})`);
      },
      onTap() {
        st.holdingSpoon = false;
        if (ctx.locked || st.done) return;
        spoonEl.setAttribute('transform', `translate(${SPOON0.x},${SPOON0.y})`);
        A.play('thud'); U.replay(spoonIn, 'wiggle');
        ctx.say('Wooden spoon. Famous for noisy, unsuccessful jar-tapping.');
      },
      async onEnd(p) {
        if (!st.holdingSpoon || st.done) return;
        st.holdingSpoon = false;
        const x = U.clamp(p.x, 24, 366), y = U.clamp(p.y, 44, 520);
        if (Math.hypot(x - st.jarPos.x, y - (st.jarPos.y - 36)) < 68) {
          A.play('clink'); U.replay(lidEl, 'wiggle');
          pop(st.jarPos.x, st.jarPos.y - 72, 'BONK! CLINK!', YELLOW, 16);
          talk('Woke the whole street. Lid didn’t move.');
          ctx.say('Great rhythm! Zero unscrewing.');
        }
        await U.tween(260, (t) => {
          if (!alive() || st.done || st.holdingSpoon) return;
          spoonEl.setAttribute('transform', `translate(${U.lerp(x, SPOON0.x, t).toFixed(1)},${U.lerp(y, SPOON0.y, t).toFixed(1)})`);
        }, U.ease.outBack);
      },
    });

    /* ---------- DECOY: OVEN MITT (slips off lid!) ---------- */
    I.drag(mittEl, svg, {
      onStart() { if (!ctx.locked && !st.done) { st.holdingMitt = true; A.play('swish'); ctx.attempt(); } },
      onMove(p) {
        if (!st.holdingMitt || ctx.locked || st.done) return;
        mittEl.setAttribute('transform', `translate(${U.clamp(p.x, 24, 366).toFixed(1)},${U.clamp(p.y, 44, 520).toFixed(1)})`);
      },
      onTap() {
        st.holdingMitt = false;

      },
      async onEnd(p) {

        const x = U.clamp(p.x, 24, 366), y = U.clamp(p.y, 44, 520);

        }, U.ease.outBack);
      },
    });

    /* ---------- ANIMATION LOOP (steam + idle comedy) ---------- */
    (function loop(now) {
      if (!alive()) return;
      if (st.hotOn) {
        hotSteam.setAttribute('transform', `translate(${(Math.sin(now / 240) * 2).toFixed(1)},${((-(now / 35) % 14)).toFixed(1)})`);
      }
      if (!st.done && now - st.lastIdle > 11000) {
        st.lastIdle = now;
        ctx.say(U.pick([
          'Whoever tightened this jar at the factory is a supervillain.',
          'Just one crunchy pickle. Is that too much to ask?',
          'Sealed tighter than a submarine hatch.',
        ]));
      }
      requestAnimationFrame(loop);
    })(performance.now());
    svg.addEventListener('pointerdown', () => { st.lastIdle = performance.now(); });

    /* ---------- TAP REACTIONS (all inner .fb, zero jump-to-(0,0)!) ---------- */
    const taps = {
      hotTap(node) {
        ctx.attempt(); A.play('click'); U.replay(node, 'wiggle');
        st.hotOn = !st.hotOn;
        if (st.hotOn) { st.coldOn = false; A.play('pour', 0.5); }
        renderStreams();
        if (st.hotOn && st.inSink) { checkSinkReaction(); return; }
        ctx.say(st.hotOn ? 'Steaming hot water! Metal lids hate heat…' : 'Hot tap off.');

      coldTap(node) {
        ctx.attempt(); A.play('click'); U.replay(node, 'wiggle');

        if (st.coldOn) { st.hotOn = false; A.play('pour', 0.2); }

      },
      noodle() {

      basil(node) { ctx.attempt(); A.play('chirp'); U.replay(node, 'hop'); ctx.say('Fresh basil. Smells great, cannot open jars.'); },
      spice(node) { ctx.attempt(); A.play('shakeSalt'); U.replay(node, 'wiggle'); ctx.say('Those tiny lids open effortlessly. Pure mockery.'); },
      crock() { ctx.attempt(); A.play('clink'); ctx.say('Utensil crock.'); },

      counter() { ctx.attempt(); A.play('tap'); ctx.say('Smooth marble counter.'); },
      wall() { ctx.attempt(); A.play('tap'); ctx.say('Clean subway tiles.'); },
    };
    I.taps(svg, (name, node) => { if (ctx.locked || st.done) return; if (taps[name]) taps[name](node); });

      if (ctx.locked || st.done) return;

        ctx.say('Even the word “jar” is sealed shut.');
      }
    };
    ctx.promptEl.addEventListener('click', onPromptClick);
    ctx.onCleanup(() => ctx.promptEl.removeEventListener('click', onPromptClick));
  }

  BF.levels = BF.levels || {};
  BF.levels[13] = L;
})(window.BF);

    endings: [
      { id: 'realday', name: 'Real Calendar', line: 'Checked the real world. Bold move.', rarity: 52, icon: 'l14real', stamp: 'TODAY!' },
      { id: 'word', name: 'Technically Correct', line: 'What day is it today? Literally “today.”', rarity: 26, icon: 'l14word', stamp: 'LITERAL!' },
      { id: 'tear', name: 'Caught Up!', line: 'Three stale pages later, welcome to the present.', rarity: 18, icon: 'l14tear', stamp: 'UP TO DATE!' },
    ],
    hints(found) {
      if (!found.includes('realday')) return [
        { text: 'The wall calendar on the left is outdated. Do not trust it!' },
        { text: `Tap the sticky note on the corkboard for TODAY in real life (${FULL[new Date().getDay()]})!` },
      ];
      if (!found.includes('word')) return [
        { text: 'Read the question very, VERY literally.' },
        { text: 'Tap the actual word “today” right inside the question banner!', demo: 'tapToday' },
      ];
      if (!found.includes('tear')) return [
        { text: 'That red wall calendar on the left is stuck three days in the past…' },
        { text: 'Tear off 3 pages from the red wall calendar (drag down or tap it 3 times)!', demo: 'tearCal' },
      ];
      return [{ text: 'All three endings found! Never miss a day again.' }];
    },
    demo(kind) {
      if (kind === 'tapToday') return [{ x: 286, y: -32 }, { x: 286, y: -32 }];
      if (kind === 'tearCal') return [{ x: CAL0.x, y: CAL0.y + 10 }, { x: CAL0.x, y: CAL0.y + 92 }];
      return null;
    },
    build,
  };

  function build(ctx) {
    const now = new Date();
    const todayIdx = now.getDay();
    const pages = [3, 2, 1, 0].map((ago) => dateOffset(now, ago));
    const decoyIdx = pages[0].dayIdx;

    ctx.root.innerHTML = sceneSVG(pages[0], pages[1]);
    const svg = ctx.root.querySelector('svg');
    const q = (s) => svg.querySelector(s);

    const ndAnim = q('#l14-nd-anim'), ndFace = q('#l14-nd-face'), ndArms = q('#l14-nd-arms'), qmark = q('#l14-qmark');
    const calTop = q('#l14-cal-top'), calIn = q('#l14-cal-in'), calUnder = q('#l14-cal-under');
    const dclockTxt = q('#l14-dclock-txt');
    const fx = q('#l14-fx'), talkLayer = q('#l14-talk');

    const st = {
      done: false,
      pageStep: 0,      // 0 = 3 days ago, 1 = 2 days ago, 2 = yesterday, 3 = TODAY!
      tearing: false,
      holdingCal: false,
      wrongSet: new Set(),
      lastIdle: performance.now(),
    };

    const alive = () => ctx.alive;
    const setFace = (o) => { ndFace.innerHTML = ART.noodleFace(o); };
    const setArms = (t) => { ndArms.innerHTML = ART.noodleArms(t, YELLOW); };
    const talk = (text, ms = 1950) => ctx.talk(talkLayer, ND0.x, ND0.y - 68, text, ms);

    function pop(x, y, text, color = YELLOW, size = 18) {
      const el = U.svgEl('text', {
        x, y, 'text-anchor': 'middle', 'font-family': 'Lilita One, sans-serif', 'font-size': size,
        fill: color, stroke: INK, 'stroke-width': 3.6, 'paint-order': 'stroke',
      }, fx);
      el.textContent = text;
      U.tween(720, (t) => {
        el.setAttribute('y', (y - t * 42).toFixed(1));
        el.setAttribute('opacity', (1 - t * t).toFixed(2));
      }, U.ease.outCubic).then(() => el.remove());
    }

    function celebrate(talkLine, narrLine, endingId) {
      qmark.setAttribute('opacity', '0');
      setFace({ eyes: 'happy', mouth: 'grin' });
      setArms('up');
      U.replay(ndAnim, 'hop');
      dclockTxt.textContent = DAYS[todayIdx];
      talk(talkLine, 2200);
      ctx.say(narrLine);
      setTimeout(() => { if (alive()) ctx.win(endingId); }, 850);
    }

    /* ---------- ENDING 1 (MAIN): TAP TODAY'S REAL STICKY NOTE ---------- */
    function handleNoteTap(node) {
      const day = Number(node.getAttribute('data-day'));
      ctx.attempt();
      if (day === todayIdx) {
        if (st.done) return;
        st.done = true; ctx.locked = true;
        A.play('pop'); A.play('chirp'); U.haptic([18, 36, 22]);
        const star = q(`#l14-star-${day}`);
        if (star) star.setAttribute('opacity', '1');
        node.querySelector('rect').setAttribute('fill', MINT);
        U.replay(node, 'hop');
        const noteObj = NOTES.find((n) => n.day === day);
        pop(noteObj.x, noteObj.y - 34, `${FULL[day].toUpperCase()}!`, MINT, 18);
        celebrate(`OH RIGHT!! HAPPY ${FULL[day].toUpperCase()}!!`, 'Checked the real world. Bold move.', 'realday');
        return;
      }

      // Wrong day sticky note!
      A.play('bonk'); U.haptic(12);
      U.replay(node, 'wiggle');
      const xEl = q(`#l14-x-${day}`);
      if (xEl) xEl.setAttribute('opacity', '1');
      const noteObj = NOTES.find((n) => n.day === day);
      pop(noteObj.x, noteObj.y - 30, 'NOPE!', RED, 15);
      if (day === decoyIdx && st.pageStep === 0) {
        talk('That wall calendar is 3 days behind!');
        ctx.say('Do not trust that dusty wall calendar — it has not been torn in days.');
      } else if (st.wrongSet.has(day)) {
        ctx.say(`Still not ${FULL[day]}. Try checking real life!`);
      } else {
        st.wrongSet.add(day);
        ctx.say(day === 1 ? 'Feels like Monday, sure. Still wrong.' : `Nope, not ${FULL[day]} in the real world.`);
      }
    }

    /* ---------- ENDING 3 (SECRET #2): TEAR OFF 3 STALE CALENDAR PAGES ---------- */
    async function tearOnePage(startDy = 0) {
      if (st.done || ctx.locked || st.tearing || st.pageStep >= 3) return;
      st.tearing = true;
      ctx.attempt();
      A.play('swish'); U.haptic(14);

      const ripped = pages[st.pageStep];
      const nextStep = st.pageStep + 1;
      const isToday = nextStep === 3;

      // Spawn a fluttering torn page copy flying off downward!
      const fly = U.svgEl('g', { transform: `translate(${CAL0.x},${(CAL0.y + startDy).toFixed(1)})` }, fx);
      fly.innerHTML = calPageSVG(ripped, false);

      // Immediately advance calendar stack beneath!
      st.pageStep = nextStep;
      calTop.setAttribute('transform', 'translate(0,0)');
      calIn.innerHTML = `<rect x="-46" y="-50" width="92" height="110" fill="#000" fill-opacity="0" pointer-events="all"/>` + calPageSVG(pages[st.pageStep], isToday);
      calUnder.innerHTML = calPageSVG(pages[Math.min(3, st.pageStep + 1)], isToday);

      const rotDir = nextStep % 2 ? 1 : -1;
      await U.tween(480, (t) => {
        if (!alive()) return;
        const fxX = CAL0.x + rotDir * t * 48;
        const fxY = CAL0.y + startDy + t * 190;
        fly.setAttribute('transform', `translate(${fxX.toFixed(1)},${fxY.toFixed(1)}) rotate(${(rotDir * t * 38).toFixed(1)})`);
        fly.setAttribute('opacity', (1 - t).toFixed(2));
      }, U.ease.inCubic);
      fly.remove();
      if (!alive()) return;

      st.tearing = false;

      if (st.pageStep === 1) {
        pop(CAL0.x, CAL0.y - 54, 'RIP!', YELLOW, 16);
        ctx.say('Two days behind! Keep tearing…');
      } else if (st.pageStep === 2) {
        pop(CAL0.x, CAL0.y - 54, 'YESTERDAY!', ORANGE, 16);
        talk('Almost caught up to today!');
        ctx.say('Yesterday! Tear one more page!');
      } else {
        st.done = true; ctx.locked = true;
        A.play('pop'); A.play('chirp'); U.haptic([20, 40, 24]);
        U.replay(calIn, 'hop');
        pop(CAL0.x, CAL0.y - 58, `${pages[3].dayStr} ${pages[3].dateNum}!`, MINT, 19);
        celebrate(`WHOA! IT’S ${FULL[todayIdx].toUpperCase()}!!`, 'Three stale pages later, welcome to the present.', 'tear');
      }
    }

    I.drag(calTop, svg, {
      onStart() {
        if (ctx.locked || st.done || st.tearing) return;
        st.holdingCal = true;
      },
      onMove(p, d) {
        if (!st.holdingCal || ctx.locked || st.done || st.tearing) return;
        const dy = U.clamp(d.dy, 0, 56);
        calTop.setAttribute('transform', `translate(${(d.dx * 0.15).toFixed(1)},${dy.toFixed(1)}) rotate(${(dy * 0.18).toFixed(1)})`);
        if (dy > 38) {
          st.holdingCal = false;
          tearOnePage(dy);
        }
      },
      onTap() {
        st.holdingCal = false;
        if (ctx.locked || st.done || st.tearing) return;
        tearOnePage(0);
      },
      async onEnd(p, d) {
        if (!st.holdingCal || st.done || st.tearing) return;
        st.holdingCal = false;
        const dy = U.clamp(d.dy, 0, 56);
        if (dy > 24) { tearOnePage(dy); return; }
        await U.tween(220, (t) => {
          if (!alive() || st.done || st.holdingCal) return;
          calTop.setAttribute('transform', `translate(0,${U.lerp(dy, 0, t).toFixed(1)})`);
        }, U.ease.outBack);
      },
    });

    /* ---------- ENDING 2 (SECRET #1): TAP "today" IN THE PROMPT BANNER! ---------- */
    const todayWord = ctx.promptEl.querySelector('#pw-today');
    const onPromptClick = (e) => {
      if (ctx.locked || st.done) return;
      if (e.target === todayWord || e.target.id === 'pw-today') {
        st.done = true; ctx.locked = true;
        A.play('pop'); A.play('chirp'); U.haptic([18, 36, 22]);
        todayWord.style.color = PINK;
        U.replay(todayWord, 'hop');
        celebrate('WAIT… TODAY LITERALLY IS TODAY!!', 'What day is it today? Literally “today.”', 'word');
      } else {
        A.play('tap');
        ctx.say('Think outside the screen — or read the question very literally.');
      }
    };
    ctx.promptEl.addEventListener('click', onPromptClick);
    ctx.onCleanup(() => ctx.promptEl.removeEventListener('click', onPromptClick));

    /* ---------- ANIMATION LOOP ---------- */
    (function loop(nowMs) {
      if (!alive()) return;
      if (!st.done) {
        qmark.setAttribute('transform', `translate(0,${(Math.sin(nowMs / 340) * 3.2).toFixed(1)})`);
        dclockTxt.setAttribute('opacity', Math.sin(nowMs / 380) > -0.35 ? '1' : '.35');
        if (nowMs - st.lastIdle > 11000) {
          st.lastIdle = nowMs;
          ctx.say(U.pick([
            'Seven sticky notes. Only one matches real life.',
            'Noodle forgot to check the calendar for three days.',
            'What day IS it today, really?',
          ]));
        }
      }
      requestAnimationFrame(loop);
    })(performance.now());
    svg.addEventListener('pointerdown', () => { st.lastIdle = performance.now(); });

    /* ---------- TAP REACTIONS (all inner .fb, zero jump-to-(0,0)!) ---------- */
    const taps = {
      note(node) { handleNoteTap(node); },
      noodle() {
        ctx.attempt(); A.play('wobble'); U.replay(ndAnim, 'hop');
        talk(U.pick(['Is it Friday yet?', 'Every day feels like Tuesday…', 'I have lost all sense of time!']));
        ctx.say('He genuinely has no idea what day it is.');
      },
      paper(node) {
        ctx.attempt(); A.play('swish'); U.replay(node, 'wiggle');
        ctx.say('Headline: “Yesterday Happened.” Zero help for today.');
      },
      dclock(node) {
        ctx.attempt(); A.play('click'); U.replay(node, 'wiggle');
        ctx.say('Even the digital clock gave up on tracking days.');
      },
      plant(node) {
        ctx.attempt(); A.play('chirp'); U.replay(node, 'hop');
        ctx.say('Succulents do not care about weekdays.');
      },
      cork() { ctx.attempt(); A.play('tap'); ctx.say('Seven sticky notes, seven days of the week.'); },
      desk() { ctx.attempt(); A.play('thud'); ctx.say('Solid study desk.'); },
      wall() { ctx.attempt(); A.play('tap'); ctx.say('Warm study wallpaper.'); },
    };
    I.taps(svg, (name, node) => { if (ctx.locked || st.done) return; if (taps[name]) taps[name](node); });
  }

  BF.levels = BF.levels || {};
  BF.levels[14] = L;
})(window.BF);

</script>

    <g id="l15-box" transform="translate(${BOX.x},${BOX.y})">

      <g id="l15-breaker" data-tap="breaker" style="cursor:pointer;pointer-events:none">

        x, y, 'text-anchor': 'middle', 'font-family': 'Lilita One, sans-serif', 'font-size': size,
        fill: color, stroke: INK, 'stroke-width': 3.6, 'paint-order': 'stroke',
      }, fx);
      el.textContent = text;
      U.tween(720, (t) => {
        el.setAttribute('y', (y - t * 42).toFixed(1));
        el.setAttribute('opacity', (1 - t * t).toFixed(2));
      }, U.ease.outCubic).then(() => el.remove());
    }

    function burst(x, y, color = YELLOW, count = 10) {
      for (let i = 0; i < count; i++) {
        const a = (i / count) * Math.PI * 2 + U.rand(-0.2, 0.2);
        const r = U.rand(30, 68);
        const d = U.svgEl('circle', { cx: x, cy: y, r: U.rand(3, 5.5), fill: i % 2 ? color : '#fff', stroke: INK, 'stroke-width': 1.8 }, fx);
        U.tween(520, (t) => {
          d.setAttribute('cx', (x + Math.cos(a) * r * t).toFixed(1));
          d.setAttribute('cy', (y + Math.sin(a) * r * t).toFixed(1));
          d.setAttribute('opacity', (1 - t).toFixed(2));
        }, U.ease.outCubic).then(() => d.remove());
      }
    }

      await U.tween(320, (t) => {

    // Step 1: Draggable Prompt Banner -> remove .slam so CSS animation never locks transform!
    const promptEl = ctx.promptEl;
    const camHead = q('#l15-cam-head');
    promptEl.classList.add('prompt-drag');
    let prDrag = null, prOff = { x: 0, y: 0 };
    function placePrompt(rot = -2) {
      promptEl.style.transform = `translate(calc(-50% + ${prOff.x.toFixed(1)}px), ${prOff.y.toFixed(1)}px) rotate(${rot.toFixed(1)}deg)`;
    }
    function isPromptCoveringCamera() {
      const pr = promptEl.getBoundingClientRect();
      const cr = camHead.getBoundingClientRect();
      const cx = cr.left + cr.width / 2, cy = cr.top + cr.height / 2;
      return cx > pr.left - 14 && cx < pr.right + 14 && cy > pr.top - 14 && cy < pr.bottom + 14;
    }
    const onPrDown = (e) => {
      if (ctx.locked || st.done || prDrag) return;
      e.preventDefault();
      promptEl.classList.remove('slam');
      promptEl.style.transition = 'none';
      const p = ctx.sceneFromClient(e.clientX, e.clientY);
      prDrag = { id: e.pointerId, start: p, off0: { ...prOff }, maxMove: 0 };
      try { promptEl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    };
    const onPrMove = (e) => {
      if (!prDrag || e.pointerId !== prDrag.id || st.done) return;
      const p = ctx.sceneFromClient(e.clientX, e.clientY);
      const dx = p.x - prDrag.start.x, dy = p.y - prDrag.start.y;
      prDrag.maxMove = Math.max(prDrag.maxMove, Math.hypot(dx, dy));
      prOff = { x: U.clamp(prDrag.off0.x + dx, -180, 180), y: U.clamp(prDrag.off0.y + dy, -30, 440) };
      placePrompt(U.clamp(-2 + dx * 0.06, -12, 10));

      if (!st.camBlinded && isPromptCoveringCamera()) {
        st.camBlinded = true;
        camCone.setAttribute('opacity', '0');
        camRec.setAttribute('fill', '#555B70');
        camPupil.setAttribute('fill', '#555B70');
        camStat.textContent = 'NO SIGNAL';
        camStat.setAttribute('fill', '#9AA5B8');
        A.play('zap'); U.haptic(18);
        pop(CCTV.x, CCTV.y + 42, 'BLINDED!', MINT, 18);
        bossSay('HEY! WHY IS MY CAMERA BLACK?!', 2400);
        ctx.say('CCTV camera blinded! Now sneak behind his portrait!');
      }
    };
    const onPrUp = (e) => {
      if (!prDrag || e.pointerId !== prDrag.id) return;
      const moved = prDrag.maxMove;
      prDrag = null;
      if (moved < 8) {
        A.play('wobble');
        promptEl.style.transition = 'transform .2s cubic-bezier(.3,1.5,.5,1)';
        placePrompt(5);
        setTimeout(() => { if (alive() && !prDrag) placePrompt(-2); }, 180);
        ctx.say('You can drag this banner anywhere! Try covering the CCTV camera.');
      } else {
        promptEl.style.transition = 'transform .2s ease-out';
        placePrompt(-2);
        A.play('tap');
      }
    };
    promptEl.addEventListener('pointerdown', onPrDown);
    promptEl.addEventListener('pointermove', onPrMove);
    promptEl.addEventListener('pointerup', onPrUp);
    promptEl.addEventListener('pointercancel', onPrUp);
    ctx.onCleanup(() => {
      promptEl.removeEventListener('pointerdown', onPrDown);
      promptEl.removeEventListener('pointermove', onPrMove);
      promptEl.removeEventListener('pointerup', onPrUp);
      promptEl.removeEventListener('pointercancel', onPrUp);

      ctx.say('Boss muted! Sonic Lock disabled — grab the HOT pepper inside!');
      return true;
    }
    ctx.onSoundButton = triggerSonicMute;
    ctx.onCleanup(I.onVolumeDown(() => { triggerSonicMute(); }));

    // Step 2: Slide / Tap Open the Air Vent directly above Boss's shield!
    async function openVent() {
      if (st.done || ctx.locked || st.ventOpen) return;
      st.ventOpen = true;
      ctx.attempt();
      A.play('creak'); U.haptic(14);
      ventGrate.style.pointerEvents = 'none';
      await U.tween(300, (t) => {
        if (!alive()) return;
        ventGrate.setAttribute('transform', `translate(${(-t * 58).toFixed(1)},${(t * 14).toFixed(1)}) rotate(${(-t * 24).toFixed(0)})`);
        ventGrate.setAttribute('opacity', (1 - t).toFixed(2));
      }, U.ease.outCubic);
      ventGrate.setAttribute('display', 'none');
      pop(VENT.x, VENT.y - 26, 'VENT OPEN!', MINT, 16);
      ctx.say('Air vent open! It leads straight inside the Boss’s shield!');
    }
    I.drag(ventGrate, svg, {
      onStart() { if (!ctx.locked && !st.done && !st.ventOpen) st.holdingVent = true; },
      onMove(p, d) {
        if (!st.holdingVent || st.ventOpen || ctx.locked || st.done) return;
        if (Math.hypot(d.dx, d.dy) > 16) { st.holdingVent = false; openVent(); }
      },
      onTap() { st.holdingVent = false; openVent(); },
      onEnd() { st.holdingVent = false; },
    });

    // Step 3: Drag X-TRA HOT Pepper over open Air Vent & Shake/Wiggle 3 times!
    function sprinkleSuperPepper(px, py) {
      if (st.done || ctx.locked) return;
      const now = performance.now();
      if (now - st.lastPuffAt < 300) return;
      st.lastPuffAt = now;
      if (!st.ventOpen) {
        A.play('bonk');
        pop(VENT.x, VENT.y - 26, 'VENT CLOSED!', RED, 16);
        ctx.say('The air vent is closed! Slide the grate open first.');
        return;
      }
      st.pepPuffs++;
      A.play('shakeSalt'); U.haptic(18);
      for (let i = 0; i < 12; i++) {
        const sx = px + U.rand(-12, 12), sy = py + 10;
        const dot = U.svgEl('circle', { cx: sx, cy: sy, r: U.rand(2.5, 4.5), fill: i % 2 ? RED : ORANGE, stroke: INK, 'stroke-width': 1.2 }, fx);
        U.tween(460, (t) => {
          dot.setAttribute('cx', U.lerp(sx, st.bossPos.x + U.rand(-20, 20), t).toFixed(1));
          dot.setAttribute('cy', U.lerp(sy, st.bossPos.y, t).toFixed(1));
          dot.setAttribute('opacity', (1 - t * t).toFixed(2));
        }, U.ease.outCubic).then(() => dot.remove());
      }
      if (st.pepPuffs === 1) {
        setBossMood('panic');
        pop(st.bossPos.x, st.bossPos.y - 54, '*SNIFF* SPICY!', ORANGE, 17);
        ctx.say('Pepper is pouring INSIDE his shield! Shake again!');
      } else if (st.pepPuffs === 2) {
        pop(st.bossPos.x, st.bossPos.y - 58, 'AAAH… AAAH…!', RED, 20);
        ctx.say('One more shake — he is about to blow his own shield!');
      } else {
        winSpicyKO();
      }
    }

    async function winSpicyKO() {
      if (st.done || !alive()) return;
      st.done = true; ctx.locked = true;
      st.holdingPep = false;
      A.play('sneeze'); A.play('crash'); U.haptic([35, 45, 110]);
      U.replay(world, 'quake');
      shield.setAttribute('opacity', '0');
      lasers.setAttribute('opacity', '0');
      burst(st.bossPos.x, st.bossPos.y, ORANGE, 16);
      pop(st.bossPos.x, st.bossPos.y - 68, 'ACHOOO!!', YELLOW, 30);

      const from = { ...st.bossPos };
      await U.tween(560, (t) => {
        if (!alive()) return;
        bossWrap.setAttribute('transform', `translate(${(from.x + t * 240).toFixed(1)},${(from.y - t * 340).toFixed(1)}) rotate(${(t * 420).toFixed(0)}) scale(${(1 - t * 0.6).toFixed(2)})`);
        bossWrap.setAttribute('opacity', (1 - t).toFixed(2));
        glassDome.setAttribute('transform', `translate(${(-t * 120).toFixed(1)},${(-t * 140).toFixed(1)}) rotate(${(-t * 45).toFixed(0)})`);
        glassDome.setAttribute('opacity', (1 - t).toFixed(2));
        padlock.setAttribute('opacity', (1 - t).toFixed(2));
      }, U.ease.outCubic);
      if (!alive()) return;

      ndCrown.setAttribute('opacity', '1');
      setFace({ eyes: 'happy', mouth: 'grin' });
      setArms('up');
      U.replay(ndAnim, 'hop');
      noodleSay('BLESS YOU, BOSS!! HAHA!', 2200);
      ctx.say('Muted his lock, opened his vent, sneezed him out of his own shield!');
      await U.wait(880);
      if (alive()) ctx.win('spicy');
    }

    let pepPrev = null, pepTravel = 0;
    I.drag(pepperEl, svg, {
      onStart() {
        if (ctx.locked || st.done || !st.sonicOff) return;
        st.holdingPep = true; pepPrev = null; pepTravel = 0;
        A.play('pop'); ctx.attempt();
      },
      onMove(p) {
        if (!st.holdingPep || ctx.locked || st.done) return;
        const x = U.clamp(p.x, 30, 360), y = U.clamp(p.y, 44, 540);
        st.pepPos = { x, y };
        const overVent = Math.hypot(x - VENT.x, y - (VENT.y - 12)) < 74;
        const overUnshielded = st.powerOff && Math.hypot(x - st.bossPos.x, y - (st.bossPos.y - 24)) < 74;
        const over = overVent || overUnshielded;
        if (over && !st.pepOverVent) { st.pepOverSince = performance.now(); st.pepHinted = false; }
        st.pepOverVent = over;
        pepperEl.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${over ? 155 : -8})`);
        if (over) {
          if (pepPrev) {
            pepTravel += Math.hypot(x - pepPrev.x, y - pepPrev.y);
            if (pepTravel >= 48) {
              pepTravel = 0;
              if (overUnshielded && !st.ventOpen) {
                // Shield already off, pepper goes straight onto Boss!
                st.ventOpen = true;
              }
              sprinkleSuperPepper(x, y);
            }
          }
          pepPrev = { x, y };
        } else {
          pepPrev = null; pepTravel = 0;
        }
      },
      onTap() {
        st.holdingPep = false; st.pepOverVent = false;
        if (ctx.locked || st.done) return;
        pepperEl.setAttribute('transform', `translate(${PEP0.x},${PEP0.y})`);
        A.play('shakeSalt'); U.replay(pepperIn, 'wiggle');
        ctx.say('Confiscated X-TRA HOT Pepper! Drag it over the air vent and shake!');
      },
      async onEnd() {
        if (!st.holdingPep || st.done) return;
        st.holdingPep = false; st.pepOverVent = false;
        const from = { ...st.pepPos };
        await U.tween(260, (t) => {
          if (!alive() || st.done || st.holdingPep) return;
          pepperEl.setAttribute('transform', `translate(${U.lerp(from.x, PEP0.x, t).toFixed(1)},${U.lerp(from.y, PEP0.y, t).toFixed(1)})`);
        }, U.ease.outBack);
        st.pepPos = { ...PEP0 };
      },
    });

    // Shared real-phone SHAKE handler (works for BOTH Ending 1 Key Drop AND Ending 3 Pepper Vent!)
    function onDeviceShake() {
      if (ctx.locked || st.done) return;
      if (st.holdingPep && st.pepOverVent) {
        sprinkleSuperPepper(st.pepPos.x, st.pepPos.y);
      } else if (st.powerOff && !st.keyDropped) {
        dropKeyFromBoss();
      } else {
        st.perchVel = 14;
        A.play('rumble');
        bossSay('Ha! My shield is earthquake-proof!');
        ctx.say('His shield absorbs shakes! Cut his power first.');
      }
    }
    ctx.onCleanup(I.onShake(onDeviceShake));
    ctx.onCleanup(I.onJolt(() => {
      if (st.holdingPep && st.pepOverVent) sprinkleSuperPepper(st.pepPos.x, st.pepPos.y);
    }));

    /* =====================================================================
       LIVE POINTER TRACKING (CCTV Camera + Boss Eyes Follow You!) & LOOP
       ===================================================================== */
    const onTrack = (e) => {
      if (st.done) return;
      const pt = U.svgPoint(svg, e.clientX, e.clientY);
      if (!st.camBlinded) {
        const ang = Math.atan2(pt.y - CCTV.y, pt.x - CCTV.x);
        camPupil.setAttribute('cx', (Math.cos(ang) * 3.2).toFixed(1));
        camPupil.setAttribute('cy', (2 + Math.sin(ang) * 3.2).toFixed(1));
      }
      const elL = q('#l15-eye-l'), elR = q('#l15-eye-r');
      if (elL && elR) {
        const a = Math.atan2(pt.y - st.bossPos.y, pt.x - st.bossPos.x);
        const ex = Math.cos(a) * 2.4, ey = Math.sin(a) * 2.4;
        elL.setAttribute('cx', (-11 + ex).toFixed(1)); elL.setAttribute('cy', (3 + ey).toFixed(1));
        elR.setAttribute('cx', (11 + ex).toFixed(1)); elR.setAttribute('cy', (3 + ey).toFixed(1));
      }
    };
    window.addEventListener('pointermove', onTrack);
    ctx.onCleanup(() => window.removeEventListener('pointermove', onTrack));

    let prev = performance.now();
    (function loop(now) {
      if (!alive()) return;
      const dt = Math.min(0.05, (now - prev) / 1000);
      prev = now;

      if (Math.abs(st.perchAng) > 0.04 || Math.abs(st.perchVel) > 0.04) {
        st.perchVel += (-28 * st.perchAng - 2.8 * st.perchVel) * dt;
        st.perchAng += st.perchVel * dt;
        perchPivot.setAttribute('transform', `translate(${PERCH.x},86) rotate(${st.perchAng.toFixed(2)})`);
        if (st.powerOff && !st.done) {
          bossWrap.setAttribute('transform', `translate(${(PERCH.x - st.perchAng * 1.4).toFixed(1)},${PERCH.y + 42}) rotate(${(st.perchAng * 0.8).toFixed(1)}) scale(0.88)`);
        }
      }

      if (!st.done) {
        if (!st.powerOff) {
          const bob = Math.sin(now / 380) * 5;
          bossWrap.setAttribute('transform', `translate(${BOSS0.x},${(BOSS0.y + bob).toFixed(1)})`);
          pipeLaser.setAttribute('stroke-dashoffset', (-(now / 28) % 28).toFixed(1));
          pipeShield.setAttribute('stroke-dashoffset', (-(now / 24) % 28).toFixed(1));
        }
        if (!st.sonicOff) {
          pipeSonic.setAttribute('stroke-dashoffset', (-(now / 22) % 24).toFixed(1));
          soundWaves.setAttribute('opacity', (0.55 + Math.sin(now / 120) * 0.4).toFixed(2));
        }
        if (!st.camBlinded) {
          camRec.setAttribute('opacity', Math.sin(now / 260) > 0 ? '1' : '.25');
        }
        if (st.holdingPep && st.pepOverVent && !st.pepHinted && now - st.pepOverSince > 900) {
          st.pepHinted = true;
          ctx.say(st.ventOpen ? 'Now SHAKE or wiggle the pepper fast!' : 'The vent is closed! Tap the metal grate to open it first!');
        }
        if (now - st.lastIdle > 12000) {
          st.lastIdle = now;
          ctx.say(U.pick([
            'Three defenses: Power Shield, CCTV Camera, and Sonic Lock.',
            'Everything you learned in Levels 1–14 works in this room.',
            'Noodle is counting on you to outsmart the Narrator!',
          ]));
        }
      }
      requestAnimationFrame(loop);
    })(prev);
    svg.addEventListener('pointerdown', () => { st.lastIdle = performance.now(); });

    /* =====================================================================
       TAP REACTIONS (all inner .fb, zero wiggle-jump bugs!)
       ===================================================================== */
    const taps = {
      screw1() { unscrewBolt(screw1, 1); },
      screw2() { unscrewBolt(screw2, 2); },
      boxDoor() { ctx.attempt(); A.play('clink'); ctx.say('Bolted shut! Look at the two metal screws on the corners.'); },
      breaker() { flipMasterBreaker(); },
      gravSw() {
        if (st.done || ctx.locked || !st.portraitMoved || st.gravUnlocked) return;
        st.gravUnlocked = true;
        ctx.attempt(); A.play('click'); A.play('pop'); U.haptic(16);
        gravPill.setAttribute('fill', MINT);
        gravTxt.textContent = 'FREE!';
        gravFlip.setAttribute('opacity', '1');
        gravFlip.style.pointerEvents = 'all';
        pop(PORT.x, PORT.y - 46, 'GRAVITY FREE!', MINT, 16);
        bossSay('WAIT—WHAT WAS THAT CLICK?!');
        ctx.say('Gravity unlocked! Now turn your phone 180° UPSIDE DOWN (or tap FLIP 180°)!');
      },
      gravFlip() { if (st.gravUnlocked && !st.done) winBrainflip(); },
      boss() {
        ctx.attempt();
        if (!st.powerOff) {
          A.play('zap'); U.haptic(14);
          pop(st.bossPos.x, st.bossPos.y - 60, 'ZAP!!', SKY, 18);
          bossSay('10,000-volt shield! Trace the wires!');
          ctx.say('Shield is active! Cut the power or find a way inside.');
        } else if (!st.keyDropped) {
          A.play('whoosh'); st.perchVel = 16;
          bossSay('Too slow! Can’t grab my key!');
          ctx.say('He dodged your finger! SHAKE the phone (or wiggle his chain fast)!');
        } else {
          A.play('bonk');
          ctx.say('He’s already dizzy — drag the Golden Key to Noodle’s padlock!');
        }
      },
      caseGlass() {
        ctx.attempt(); A.play('beat', 0); U.replay(spkIn, 'wiggle');
        if (ctx.soundBtn && !st.sonicOff) ctx.soundBtn.classList.add('sound-blast');
        pop(342, 290, 'SONIC LOCK!', PINK, 16);
        bossSay('Loudspeaker keeps my trophies locked!');
        ctx.say('Locked by the Boss’s booming voice! Mute the game to silence it.');
      },
      speaker(node) {
        ctx.attempt(); A.play('beat', 1); U.replay(node, 'wiggle');
        ctx.say(st.sonicOff ? 'Silenced! The Sonic Lock is disabled.' : 'Blasting Sonic Lock waves! If only there were a Mute button…');
      },
      camera() {
        ctx.attempt(); A.play('alarm');
        pop(CCTV.x, CCTV.y + 38, 'WATCHING!', RED, 15);
        ctx.say(st.camBlinded ? 'Camera blinded!' : 'Live CCTV camera. Cover its view with something movable!');
      },
      noodle() {
        ctx.attempt(); A.play('squeak'); U.replay(ndAnim, 'hop');
        noodleSay(st.powerOff ? 'GET THE KEY!!' : 'HELP!! LASERS!!');
        ctx.say(st.powerOff ? 'Lasers are off — just unlock his padlock!' : 'Trapped behind live red lasers and a steel padlock.');
      },
      cage() {
        ctx.attempt();
        if (!st.powerOff) { A.play('zap'); pop(CAGE.x, CAGE.y - 40, 'LASERS ON!', RED, 17); ctx.say('Live lasers! Shut down the ⚡ POWER box first.'); }
        else { A.play('clink'); ctx.say('Glass is thick — unlock the steel padlock with the Golden Key.'); }
      },
      padlock(node) {
        ctx.attempt(); A.play('clink'); U.replay(node, 'wiggle');
        ctx.say(st.keyDropped ? 'Drag the Golden Key from the floor onto this padlock!' : 'Locked tight! The Boss is clutching the Golden Key.');
      },
      cameoCookie(node) { ctx.attempt(); A.play('crunch'); U.replay(node, 'wiggle'); ctx.say('Level 5’s Cookie Jar — confiscated!'); },
      cameoPickle(node) { ctx.attempt(); A.play('clink'); U.replay(node, 'wiggle'); ctx.say('Level 13’s Pickle Jar — still crunchy!'); },
      rug() { ctx.attempt(); A.play('swish'); ctx.say('No spare key under the villain rug.'); },
      wall() { ctx.attempt(); A.play('tap'); ctx.say('Look closely at the wires, the camera, and the air vent.'); },
      floor() { ctx.attempt(); A.play('thud'); ctx.say('Noodle’s hijacked living room floor.'); },
    };
    I.taps(svg, (name, node) => { if (ctx.locked || st.done) return; if (taps[name]) taps[name](node); });
  }

  BF.levels = BF.levels || {};
  BF.levels[15] = L;
})(window.BF);

</script>
<script>
/* Brainflip — boot, title screen, progression & settings. */
(function (BF) {
  'use strict';
  const U = BF.U, A = BF.audio, I = BF.input, G = BF.game, ART = BF.art;
  const isDev = () => !(BF.config && BF.config.isProd) && U.params.get('dev') === '1';
  let toastTimer = 0;

  function showTitleToast(msg) {
    const el = U.$('#title-toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2100);
  }

  function openSettings(onReset) {
    const ov = U.$('#title-overlay');
    if (!ov) return;
    let armedReset = false;
    const render = () => {
      const cfg = BF.config || { version: '1.0.0', privacyUrl: '' };
      ov.innerHTML = `
        <div class="card" role="dialog" aria-label="Settings">
          <span class="card-kicker">SETTINGS</span>
          <h2 style="font-size:32px;margin:8px 0 4px">Brainflip</h2>
          <div class="settings-list">
            <button class="btn btn-yellow" id="set-sound">Sound Effects: ${A.muted ? 'OFF' : 'ON'}</button>
            <button class="btn btn-pink btn-rate" id="set-rate">${ART.icons.star}<span>Rate &amp; Ask for Chapter 2</span></button>
            <button class="btn" id="set-privacy">Privacy Policy</button>
            <button class="btn btn-danger" id="set-reset">${armedReset ? 'Tap again to confirm reset!' : 'Reset Progress'}</button>
          </div>
          <button class="btn btn-mint" id="set-close" style="width:100%;font-size:20px">Done</button>
          <p class="settings-ver">Version ${cfg.version} · Chapter 1 (Home Sweet Home)</p>
        </div>`;
      ov.classList.remove('hidden');

      U.$('#set-sound').onclick = () => {
        A.unlock(); A.setMuted(!A.muted); A.play('tap');
        render();
      };
      U.$('#set-rate').onclick = () => {
        A.play('pop');
        if (BF.native) BF.native.openStoreReview();
      };
      U.$('#set-privacy').onclick = () => {
        A.play('tap');
        if (BF.native && cfg.privacyUrl) BF.native.openExternal(cfg.privacyUrl);
      };
      U.$('#set-reset').onclick = () => {
        if (!armedReset) {
          A.play('bonk');
          armedReset = true;
          render();
          return;
        }
        A.play('pop');
        U.store.clear('bf.');
        G.refreshHints();
        ov.classList.add('hidden');
        ov.innerHTML = '';
        if (onReset) onReset();
        showTitleToast('Progress reset!');
      };
      U.$('#set-close').onclick = () => {
        A.play('tap');
        ov.classList.add('hidden');
        ov.innerHTML = '';
      };
    };
    ov.onclick = (e) => {
      if (e.target === ov) { A.play('tap'); ov.classList.add('hidden'); ov.innerHTML = ''; }
    };
    render();
  }

  function buildTitle() {
    // logo: BRAIN / FLIP (FLIP hangs upside down until you tap it)
    const letters = (word, delay) => word.split('').map((c, i) => `<span class="ch" style="animation-delay:${(delay + i * 0.12).toFixed(2)}s">${c}</span>`).join('');
    U.$('#logo').innerHTML =
      `<span class="logo-row">${letters('BRAIN', 0)}</span>` +
      `<span class="logo-row"><span class="logo-flip" id="logo-flip" role="button" aria-label="Flip the logo">${letters('FLIP', 0.6)}</span></span>`;

    U.$('#title-hero').innerHTML =
      `<svg viewBox="-115 -125 230 250" xmlns="http://www.w3.org/2000/svg" aria-label="Noodle waving">
        <ellipse cx="0" cy="104" rx="62" ry="10" fill="#1B1B2F" opacity=".12"/>
        <g class="float"><g class="boil">${ART.noodle({ y: 20, scale: 1.05, eyes: 'open', mouth: 'grin', armType: 'wave', withLegs: true })}</g></g>
      </svg>`;

    // background doodles: question marks, sparkles, squiggles
    const INK = '#1B1B2F';
    const q = (x, y, r, s, c) => `<g transform="translate(${x},${y}) rotate(${r}) scale(${s})"><text font-family="Lilita One, sans-serif" font-size="46" fill="${c}" stroke="${INK}" stroke-width="3" paint-order="stroke" text-anchor="middle">?</text></g>`;
    const spark = (x, y, s, c) => `<path transform="translate(${x},${y}) scale(${s})" d="M0,-12 Q0,0 12,0 Q0,0 0,12 Q0,0 -12,0 Q0,0 0,-12 Z" fill="${c}" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>`;
    U.$('#title-doodles').innerHTML =
      `<svg viewBox="0 0 390 780" width="390" height="780" xmlns="http://www.w3.org/2000/svg">
        ${q(42, 92, -18, 1, '#5BC0EB')}${q(350, 236, 16, .8, '#3DDC97')}${q(36, 470, 10, .7, '#FF6B35')}${q(356, 560, -12, 1, '#FFC93C')}
        ${spark(330, 70, 1, '#FFC93C')}${spark(62, 300, .8, '#FF5D8F')}${spark(320, 420, .7, '#5BC0EB')}${spark(70, 640, .9, '#3DDC97')}
        <path d="M290,700 q10,-12 20,0 t20,0 t20,0" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>
        <path d="M24,200 q8,-10 16,0 t16,0" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>
      </svg>`;

    const flip = U.$('#logo-flip');
    let flipT = 0;
    flip.addEventListener('click', () => {
      A.unlock(); A.play('whoosh');
      flip.classList.add('unflipped');
      clearTimeout(flipT);
      flipT = setTimeout(() => { flip.classList.remove('unflipped'); A.play('swish'); }, 1300);
    });

    const snd = U.$('#btn-sound');
    const paintSound = () => { snd.innerHTML = A.muted ? ART.icons.soundOff : ART.icons.soundOn; snd.setAttribute('aria-label', A.muted ? 'Sound off' : 'Sound on'); };
    paintSound();
    A.onMuteChange(paintSound);
    snd.addEventListener('click', () => { A.unlock(); A.setMuted(!A.muted); A.play('tap'); });

    const setBtn = U.$('#btn-settings');
    if (setBtn) {
      setBtn.innerHTML = ART.icons.gear;
      setBtn.addEventListener('click', () => { A.unlock(); A.play('tap'); openSettings(paintPick); });
    }

    const start = async (n) => {
      A.unlock();
      A.play('tap');
      await I.requestMotion(); // iOS asks here, inside the tap
      G.startLevel(BF.levels[n] || BF.levels[1]);
    };

    const pick = U.$('#level-pick');
    const statsEl = U.$('#title-stats');
    const playBtn = U.$('#btn-play');

    const paintPick = () => {
      const p = G.getProgress();
      const devAll = isDev();
      const cur = U.clamp(U.store.get('bf.level', p.unlocked), 1, devAll ? p.maxLevel : p.unlocked);
      if (statsEl) {
        statsEl.innerHTML = `<span>${p.foundTotal}/${p.maxTotal} Endings</span><span class="ts-rank">${p.rank}</span>`;
      }
      if (playBtn) {
        playBtn.textContent = p.foundTotal > 0 ? `PLAY · LV ${cur}` : 'PLAY';
      }
      pick.innerHTML = p.ids.map((n) => {
        const def = BF.levels[n], valid = new Set(def.endings.map((e) => e.id));
        const found = U.store.get(`bf.l${n}.found`, []).filter((id) => valid.has(id));
        const locked = !devAll && n > p.unlocked;
        if (locked) {
          return `<button class="btn locked" data-n="${n}" data-locked="1" aria-label="Level ${n} locked"><span>Lv ${n}</span><span class="lp-lock">${ART.icons.lock}</span></button>`;
        }
        const dots = def.endings.map((e) => `<span class="lp-dot ${found.includes(e.id) ? 'f' : ''}"></span>`).join('');
        return `<button class="btn ${n === cur ? 'on' : ''}" data-n="${n}"><span>Lv ${n}</span><span class="lp-dots">${dots}</span></button>`;
      }).join('');
    };

    playBtn.addEventListener('click', () => {
      const p = G.getProgress();
      const cur = U.clamp(U.store.get('bf.level', p.unlocked), 1, isDev() ? p.maxLevel : p.unlocked);
      start(cur);
    });
    paintPick();
    pick.addEventListener('click', (e) => {
      const b = e.target.closest('[data-n]');
      if (!b) return;
      if (b.dataset.locked === '1') {
        A.unlock(); A.play('bonk'); U.haptic(25);
        U.replay(b, 'wiggle');
        const p = G.getProgress();
        showTitleToast(`Beat Level ${p.unlocked} to unlock more!`);
        return;
      }
      start(Number(b.dataset.n));
    });
    G.onTitle = paintPick;
  }

  function devMode() {
    // ?dev=1 (non-prod only) → keyboard shortcuts for desktop QA
    if (!isDev()) return;
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 's') I.simulateShake();
      if (k === 'f') I.simulateFlip();
      if (k === 'u') I.simulateUpsideDown('debug');
      if (k === 'b') I.simulateBlow('debug');
      if (k === 'm') I.simulateVolumeDown('debug');
      if (k === 'l') I.simulateLandscape(1);
      if (k === 'c') I.simulateCharging(true);
      if (k === 'v') I.simulateAppReturn(5000);
      if (e.key === 'ArrowRight') I.simulateTilt(Math.min(80, (I.tilt || 0) + 10));
      if (e.key === 'ArrowLeft') I.simulateTilt(Math.max(-80, (I.tilt || 0) - 10));
      if (e.key === 'ArrowDown') I.simulateTilt(0);
      if (k === 'r') G.restart(true);
      if (k === 't') G.showTitle();
    });
  }

  function boot() {
    const prod = Boolean(BF.config && BF.config.isProd);
    if (!prod && U.params.get('reset') === '1') U.store.clear('bf.');
    G.init();
    buildTitle();
    devMode();
    if (!prod) {
      const lv = Number(U.params.get('level') || 0);
      if (U.params.get('skip') === '1' || lv) G.startLevel(BF.levels[lv] || BF.levels[1]);
    }
    window.BF_READY = true;
  }

  const fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.race([fontsReady, U.wait(1500)]).then(boot);
})(window.BF);

</script>
