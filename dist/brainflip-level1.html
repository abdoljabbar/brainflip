        while (da < -180) da += 360;
        st.signAngle = signGrab.base + da;
        upsign.setAttribute('transform', `rotate(${st.signAngle.toFixed(1)})`);
      },
      onEnd() {
        if (!signGrab) return;
        signGrab = null; st.signDragging = false;
        if (st.done) return;
        const norm = Math.abs(((st.signAngle % 360) + 540) % 360 - 180); // 0 = completely upside down!
        if (norm < 42) {
          if (I.hasMotion) {
            A.play('wobble');
            ctx.say('Haha, nice try! Flip your ACTUAL phone upside down!', 2600);
            const from = st.signAngle;
            U.tween(420, (t) => {
              if (!alive() || st.done) return;
              st.signAngle = U.lerp(from, 0, t);
              upsign.setAttribute('transform', `rotate(${st.signAngle.toFixed(1)})`);
            }, U.ease.outBack);
          } else {
            A.play('click');
            upsideDownEnding('sign');
          }
        } else {
          const from = st.signAngle;
          A.play('swish');
          U.tween(360, (t) => {
            if (!alive() || st.done) return;
            st.signAngle = U.lerp(from, 0, t);
            upsign.setAttribute('transform', `rotate(${st.signAngle.toFixed(1)})`);
          }, U.ease.outBack);
        }
      },
      onTap() {
        signGrab = null; st.signDragging = false;
        if (ctx.locked || st.done) return;
        st.signTaps++;
        if (I.hasMotion) {
          A.play('wobble');
          U.tween(460, (t) => {
            if (!alive() || st.done) return;
            upsign.setAttribute('transform', `rotate(${(Math.sin(t * Math.PI * 2) * 28).toFixed(1)})`);
          });
          ctx.say(st.signTaps === 1 ? '“This side up”… unless you flip your phone!' : 'Seriously — turn your phone upside down!');
        } else if (st.signTaps === 1) {
          A.play('creak');
          U.tween(320, (t) => {
            if (!alive() || st.done) return;
            st.signAngle = U.lerp(0, 95, t);
            upsign.setAttribute('transform', `rotate(${st.signAngle.toFixed(1)})`);
          }, U.ease.outBack);
          ctx.say('Ooh, it turns! Tap or drag it all the way upside down…');
        } else {
          A.play('click');
          upsideDownEnding('sign');
        }
      },
    });

    /* ---------- SECRET ENDING #1: Stack the 3 heavy books under the shelf! ---------- */
    let ndMovedAside = false;
    function moveNoodleAside() {
      if (ndMovedAside) return;
      ndMovedAside = true;
      const x0 = st.ndX, tx = 104;
      U.tween(360, (t) => {
        if (!alive() || st.done) return;
        st.ndX = U.lerp(x0, tx, t);
        nd.setAttribute('transform', `translate(${st.ndX.toFixed(1)},${st.ndY.toFixed(1)})`);
      }, U.ease.outBack);
    }

    BOOKS.forEach((b, idx) => {
      const el = bookEls[idx];
      const bs = bookState[idx];
      let grab = null;
      I.drag(el, svg, {
        onStart(pt) {
          if (ctx.locked || st.done || bs.stacked) return;
          st.lastTouch = performance.now();
          grab = { dx: pt.x - bs.x, dy: pt.y - bs.y };
          // Bring dragged book to top of #l5-books
          el.parentNode.appendChild(el);
          A.play('tap');
        },
        onMove(pt) {
          if (!grab) return;
          bs.x = U.clamp(pt.x - grab.dx, 44, 346);
          bs.y = U.clamp(pt.y - grab.dy, 120, 560);
          el.setAttribute('transform', `translate(${bs.x.toFixed(1)},${bs.y.toFixed(1)}) rotate(${U.clamp((bs.x - b.x0) * 0.04, -10, 10).toFixed(1)})`);
        },
        onEnd() {
          if (!grab) return;
          grab = null;
          if (st.done) return;
          const inDropZone = bs.x > 112 && bs.x < 284 && bs.y > 240 && bs.y < 560;
          if (inDropZone) {
            bs.stacked = true;
            st.stacked.push(idx);
            const targetY = st.stackTopY - b.h / 2;
            st.stackTopY -= b.h;
            const x0 = bs.x, y0 = bs.y;
            const jitterX = (st.stacked.length - 2) * 3;
            moveNoodleAside();
            A.play('thud'); U.haptic(25);
            U.tween(240, (t) => {
              if (!alive() || st.done) return;
              bs.x = U.lerp(x0, STACK_X + jitterX, t);
              bs.y = U.lerp(y0, targetY, t);
              el.setAttribute('transform', `translate(${bs.x.toFixed(1)},${bs.y.toFixed(1)})`);
            }, U.ease.outBounce);
            if (st.stacked.length === 1) ctx.say('Nice! Stack more books to make it taller!');
            else if (st.stacked.length === 2) ctx.say('Almost tall enough! One more book!');
            else if (st.stacked.length >= 3) setTimeout(() => booksEnding(), 280);
          } else {
            const x0 = bs.x, y0 = bs.y;
            A.play('swish');
            U.tween(380, (t) => {
              if (!alive() || st.done) return;
              bs.x = U.lerp(x0, b.x0, t); bs.y = U.lerp(y0, b.y0, t);
              el.setAttribute('transform', `translate(${bs.x.toFixed(1)},${bs.y.toFixed(1)})`);
            }, U.ease.outBack);
          }
        },
        onTap() {
          grab = null;
          if (ctx.locked || st.done) return;
          A.play('tap'); U.replay(el.firstElementChild, 'hop');
          ctx.say(bs.stacked
            ? 'Solid foundation! Keep stacking.'
            : b.title === 'GRAVITY 101'
              ? '“Gravity 101” — thick enough to stand on, and a decent hint too!'
              : `A super thick ${b.title.toLowerCase()}. Bet you can stack it!`);
        },
      });
    });

    async function booksEnding() {
      if (st.done || !alive()) return;
      st.done = true; ctx.locked = true;
      A.play('boing'); U.haptic(25);
      setFace('happy', 'grin'); setArms('up');
      const nx0 = st.ndX, ny0 = st.ndY;
      const topY = st.stackTopY - 70; // feet rest squarely on top of the 3-book stack!
      // Hop smoothly onto top of the book tower
      await U.tween(520, (t) => {
        if (!alive()) return;
        const x = U.lerp(nx0, STACK_X, t);
        const y = U.lerp(ny0, topY, t) - Math.sin(t * Math.PI) * 58;
        nd.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)})`);
      }, U.ease.outCubic);
      if (!alive()) return;
      st.ndX = STACK_X; st.ndY = topY;
      A.play('thud');

      // Stretch up on tippy-toes and pull the jar right down into Noodle's arms!
      const jm = /translate\(([-\d.]+),([-\d.]+)/.exec(jar.getAttribute('transform'));
      const jx0 = jm ? parseFloat(jm[1]) : JAR0.x, jy0 = jm ? parseFloat(jm[2]) : JAR0.y;
      await U.tween(240, (t) => {
        if (!alive()) return;
        nd.setAttribute('transform', `translate(${STACK_X},${(topY - 26 * t).toFixed(1)}) scale(${(1 - 0.06 * t).toFixed(3)},${(1 + 0.08 * t).toFixed(3)})`);
      }, U.ease.outCubic);
      A.play('pop');
      setArms('hold');
      // Bring jar in front of Noodle so the full COOKIES jar is proudly visible!
      nd.parentNode.insertBefore(jar, fx);
      await U.tween(320, (t) => {
        if (!alive()) return;
        nd.setAttribute('transform', `translate(${STACK_X},${U.lerp(topY - 26, topY, t).toFixed(1)})`);
        jar.setAttribute('transform', `translate(${U.lerp(jx0, STACK_X + 38, t).toFixed(1)},${U.lerp(jy0, topY + 22, t).toFixed(1)}) scale(${U.lerp(1, 0.74, t).toFixed(2)})`);
      }, U.ease.outBounce);
      if (!alive()) return;

      A.play('crunch');
      crumbs(STACK_X, topY - 4);
      talk('Knowledge IS delicious!', 2400, STACK_X, topY - 64);
      ctx.say('Who says reading never pays off?', 2500);
      await U.wait(1250);
      if (alive()) ctx.win('books');
    }

    /* ---------- SECRET ENDING #2: Unscrew both bolts holding up the high shelf! ---------- */
    async function unscrew(side) {
      if (st.done || !alive()) return;
      if (side === 'l' && st.screwLOut) return;
      if (side === 'r' && st.screwROut) return;

      const sEl = side === 'l' ? screwL : screwR;
      const p0 = side === 'l' ? SCREW_L : SCREW_R;
      if (side === 'l') st.screwLOut = true; else st.screwROut = true;

      A.play('clink'); U.haptic(25);
      // Spin & pop screw out, dropping it to the floor
      U.tween(560, (t) => {
        if (!alive()) return;
        const x = p0.x + (side === 'l' ? -36 : 36) * t;
        const y = p0.y - Math.sin(t * Math.PI) * 34 + (484 - p0.y) * t * t;
        sEl.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(540 * t).toFixed(1)})`);
      }, U.ease.linear);

      const bothOut = st.screwLOut && st.screwROut;
      if (!bothOut) {
        // First screw out → shelf tilts precariously on the remaining bolt!
        A.play('creak');
        const dir = side === 'l' ? -1 : 1; // left screw gone -> left end sags (-22deg)
        st.shelfTilt = dir * 22;
        const pivotX = side === 'l' ? 52 : -52;
        await U.tween(420, (t) => {
          if (!alive() || st.done) return;
          const a = st.shelfTilt * t;
          shelfWrap.setAttribute('transform', `translate(198,${SHELF_Y}) translate(${pivotX},14) rotate(${a.toFixed(1)}) translate(${-pivotX},-14)`);
          const jx = JAR0.x + dir * 32 * t;
          const jy = JAR0.y + 18 * t;
          jar.setAttribute('transform', `translate(${jx.toFixed(1)},${jy.toFixed(1)}) rotate(${a.toFixed(1)})`);
        }, U.ease.outBounce);
        if (!alive() || st.done) return;
        setFace('wide', 'o');
        talk('Uhh… careful!!', 1800);
        ctx.say('Whoa! Only ONE screw holding that shelf up now…');
      } else {
        shelfCollapseEnding();
      }
    }

    async function shelfCollapseEnding() {
      if (st.done || !alive()) return;
      st.done = true; ctx.locked = true;
      A.play('whoosh'); U.haptic([30, 40, 60]);
      setFace('wide', 'bigO'); setArms('up');

      const jm = /translate\(([-\d.]+),([-\d.]+)/.exec(jar.getAttribute('transform'));
      const jx0 = jm ? parseFloat(jm[1]) : JAR0.x, jy0 = jm ? parseFloat(jm[2]) : JAR0.y;
      const a0 = st.shelfTilt || 0;
      const catchX = st.ndX, catchY = st.ndY + 18;
      // Bring jar in front of Noodle so the catch shows the whole COOKIES jar clearly
      nd.parentNode.insertBefore(jar, fx);

      // Shelf crashes down onto the floor while the cookie jar arcs smoothly right into Noodle's arms!
      await U.tween(620, (t) => {
        if (!alive()) return;
        const sy = U.lerp(SHELF_Y, 474, t * t);
        const sa = a0 + (a0 >= 0 ? 16 : -16) * t;
        shelfWrap.setAttribute('transform', `translate(${(198 + (a0 >= 0 ? 16 : -16) * t).toFixed(1)},${sy.toFixed(1)}) rotate(${sa.toFixed(1)})`);
        const jx = U.lerp(jx0, catchX + 36, t);
        const jy = U.lerp(jy0, catchY, t * t) - Math.sin(t * Math.PI) * 32;
        jar.setAttribute('transform', `translate(${jx.toFixed(1)},${jy.toFixed(1)}) rotate(${U.lerp(a0, 8, t).toFixed(1)}) scale(${U.lerp(1, 0.74, t).toFixed(2)})`);
      }, U.ease.linear);
      if (!alive()) return;

      A.play('crash'); U.haptic(50);
      U.replay(ndBoil, 'jolt');
      burst('CATCH!', catchX + 14, catchY - 46, MINT);
      setFace('happy', 'grin'); setArms('hold');
      await U.wait(260);
      if (!alive()) return;
      A.play('crunch');
      crumbs(catchX, st.ndY - 8);
      talk('Nailed it! …Well, unscrewed it!', 2400);
      ctx.say('Zero structural integrity. 100% cookies.', 2500);
      await U.wait(1250);
      if (alive()) ctx.win('shelf');
    }

    /* ---------- Jar decoy: tapping or trying to drag the jar directly says TOO HIGH! ---------- */
    I.drag(jar, svg, {
      onStart() { st.lastTouch = performance.now(); },
      onMove(pt, d) {
        if (st.done || Math.hypot(d.dx, d.dy) < 18) return;
        if (!st.taps.jarDragWarn) {
          st.taps.jarDragWarn = 1;
          A.play('clink'); U.replay(jarIn, 'wiggle');
          burst('TOO HIGH!', JAR0.x, JAR0.y - 38, '#FF8FB1');
          ctx.say('Hey, no fair! Noodle has to reach it himself!');
          ctx.attempt();
        }
      },
      onEnd() { st.taps.jarDragWarn = 0; },
      onTap() {
        if (ctx.locked || st.done) return;
        A.play('clink'); U.replay(jarIn, 'wiggle');
        ctx.attempt();
        noodleJump();
        ctx.say('Way out of reach! Think outside the room…');
      },
    });

    /* ---------- animation loop: live upside-down sensor feedback + idle reminders ---------- */
    const t0 = performance.now();
    (function loop(now) {
      if (!alive()) return;
      const t = (now - t0) / 1000;
      if (!st.done && I.hasMotion && !st.screwLOut && !st.screwROut) {
        const up = I.upProgress;
        if (up > 0.04) {
          // Jar visibly trembles & floats slightly as you rotate the phone toward upside-down!
          const lift = up * 16;
          const wob = Math.sin(t * 24) * up * 8;
          jar.setAttribute('transform', `translate(${JAR0.x},${(JAR0.y - lift).toFixed(1)}) rotate(${wob.toFixed(1)})`);
        } else {
          jar.setAttribute('transform', `translate(${JAR0.x},${JAR0.y})`);
        }
      }
      if (!st.done && now - st.lastTouch > 8500) {
        st.lastTouch = now;
        ctx.say(U.pick([
          I.hasMotion ? 'Psst… the game is called BrainFLIP for a reason!' : 'Psst… check out that “THIS SIDE UP” sign!',
          'Those books on the floor look pretty thick…',
          'Do those shelf screws look loose to you?',
        ]));
      }
      requestAnimationFrame(loop);
    })(t0);
    svg.addEventListener('pointerdown', () => { st.lastTouch = performance.now(); });

    /* ---------- reactions (no dead taps!) ---------- */
    const taps = {
      screwL: () => unscrew('l'),
      screwR: () => unscrew('r'),
      noodle() {
        ctx.attempt();
        noodleJump();
      },
      clock(node) {
        st.clockSpin += 90;
        A.play('clink'); U.replay(node, 'wiggle');
        clockH.setAttribute('transform', `rotate(${st.clockSpin})`);
        clockM.setAttribute('transform', `rotate(${st.clockSpin * 3})`);
        ctx.say('It’s cookie o’clock! (Just way too high up.)');
        ctx.attempt();
      },
      async mousehole() {
        if (st.mouseBusy) return;
        st.mouseBusy = true;
        A.play('squeak');
        await U.tween(200, (t) => mouse.setAttribute('transform', `translate(0,${U.lerp(22, 2, t).toFixed(1)})`), U.ease.outBack);
        ctx.say('Tiny mouse says: “Find your own crumbs!”');
        await U.wait(700);
        if (alive()) await U.tween(180, (t) => mouse.setAttribute('transform', `translate(0,${U.lerp(2, 22, t).toFixed(1)})`));
        st.mouseBusy = false;
      },
      cabinet() { A.play('bonk'); ctx.say('Bolted straight to the floor! Nice try.'); ctx.attempt(); },
      ruler() { A.play('tap'); ctx.say('Shelf: 6 feet. Noodle: 2 feet. Math checks out.'); ctx.attempt(); },
      rug() { A.play('tap'); ctx.say('Soft kitchen rug. Zero cookies under it.'); ctx.attempt(); },
      wall() { A.play('bonk'); ctx.say(U.pick(['Nope.', 'Think outside the screen.', 'What if gravity went up?'])); ctx.attempt(); },
      floor() { A.play('thud'); ctx.say('Solid floor. Definitely down here.'); ctx.attempt(); },
    };
    I.taps(svg, (name, node) => { if (ctx.locked || st.done) return; if (taps[name]) taps[name](node); });

    const jarWord = ctx.promptEl.querySelector('#pw-jar');
    ctx.promptEl.onclick = (e) => {
      if (ctx.locked) return;
      if (e.target === jarWord) {
        U.replay(jarWord, 'hop'); A.play('crunch');
        ctx.say('Nice try — those words aren’t edible.');
      } else {
        A.play('tap');
        ctx.say('Way up there on the top shelf!');
      }
    };
  }

  BF.levels = BF.levels || {};
  BF.levels[5] = L;
})(window.BF);

</script>
<script>
/* Brainflip — Level 6 (per GDD v0.1): "How many sheep?"
   Main ending : hold the sky/meadow to enter Slow-Mo, then tap all 5 real jumping sheep directly (taps at normal speed are too fast and don't count!)  (verb: hold + tap)
   Secret #1   : while in Slow-Mo, tap Jumper #4 — the sneaky wolf disguised in wool — to unmask the impostor!  (verb: hold + observe)
   Secret #2   : find & tap the sleepy hidden sheep behind the "How many sheep?" prompt banner (drag banner or tap its peeking nightcap!)  (verb: inspect UI)
   Decoys: Noodle in pajamas, smiling moon, drifting clouds, wooden fence, normal-speed blurry sheep whiffs. */
(function (BF) {
  'use strict';
  const U = BF.U, A = BF.audio, I = BF.input, ART = BF.art;
  const INK = '#1B1B2F', YELLOW = '#FFC93C', PINK = '#FF5D8F', MINT = '#3DDC97', SKY = '#5BC0EB';
  const W = 'stroke-linecap="round" stroke-linejoin="round"';
  const S = `stroke="${INK}" stroke-width="3.2" ${W}`;

  const ND = { x: 76, y: 416 };
  const SHEEP_HIDE = { x: 292, y: -47 }; // tucked behind right end of #prompt; pink nightcap pom-pom peeks subtly above top edge
  const SHEEP_LAND = { x: 308, y: 422 };
  const HERD_N = 6;     // 5 real sheep + 1 wolf impostor
  const REAL_NEED = 5;  // tap all 5 real sheep during Slow-Mo!
  const WOLF_IDX = 3;   // Jumper #4 is a wolf in sheep's clothing
  const GAP = 0.23;     // sim-seconds between jumpers
  const DUR = 0.54;     // sim-seconds to cross screen
  const CYCLE = 2.6;    // full loop in sim-seconds

  function sheepWool(fill = '#FFFFFF') {
    return `<path d="M-24,4 C-32,-2 -30,-16 -18,-18 C-14,-28 2,-28 8,-20 C20,-24 30,-14 26,-2 C32,6 24,18 12,16 C6,22 -8,22 -14,16 C-24,18 -30,10 -24,4 Z" fill="${fill}" ${S}/>`;
  }

  function sheepArt(variant = 0) {
    const faceEye = variant === 1
      ? `<path d="M18,-3 Q21,-7 24,-3 M26,-3 Q29,-7 32,-3" fill="none" stroke="#fff" stroke-width="2" ${W}/>`
      : `<circle cx="21" cy="-4" r="3" fill="#fff"/><circle cx="22" cy="-4" r="1.4" fill="${INK}"/><circle cx="29" cy="-4" r="3" fill="#fff"/><circle cx="30" cy="-4" r="1.4" fill="${INK}"/>`;
    const bow = variant === 2
      ? `<path d="M12,-18 L18,-14 L12,-10 Z M24,-18 L18,-14 L24,-10 Z" fill="${PINK}" stroke="${INK}" stroke-width="1.8" ${W}/>`
      : '';
    return `
      <!-- legs -->
      <path d="M-12,14 L-16,26 M-4,15 L-5,26 M8,15 L12,26 M16,14 L22,25" stroke="${INK}" stroke-width="4.5" stroke-linecap="round"/>
      <!-- tiny fluffy tail -->
      <circle cx="-28" cy="2" r="6" fill="#fff" stroke="${INK}" stroke-width="2.6"/>
      ${sheepWool()}
      <!-- dark sheep head -->
      <ellipse cx="24" cy="-2" rx="13" ry="11" fill="#32304A" ${S}/>
      <!-- floppy ears -->
      <ellipse cx="14" cy="-10" rx="6" ry="3.5" transform="rotate(-28,14,-10)" fill="#32304A" stroke="${INK}" stroke-width="2.4"/>
      <ellipse cx="33" cy="-10" rx="5.5" ry="3.2" transform="rotate(24,33,-10)" fill="#32304A" stroke="${INK}" stroke-width="2.4"/>
      <!-- top wool puff -->
      <circle cx="22" cy="-12" r="6.5" fill="#fff" stroke="${INK}" stroke-width="2.4"/>
      ${faceEye}
      <path d="M23,3 Q26,6 29,3" fill="none" stroke="#FF8FB1" stroke-width="2" ${W}/>
      ${bow}`;
  }

  function wolfSheepArt() {
    return `
      <!-- gray wolf paws -->
      <path d="M-12,14 L-17,26 M-4,15 L-5,26 M8,15 L13,26 M16,14 L23,25" stroke="#5B6275" stroke-width="5" stroke-linecap="round"/>
      <path d="M-12,14 L-17,26 M-4,15 L-5,26 M8,15 L13,26 M16,14 L23,25" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>
      <!-- BUSHY GRAY WOLF TAIL sticking out the back! -->
      <path d="M-24,2 C-38,-6 -44,6 -36,14 C-28,16 -24,10 -22,6 Z" fill="#7D869B" stroke="${INK}" stroke-width="2.8" ${W}/>
      <path d="M-38,8 L-31,12" stroke="#DCE3EE" stroke-width="3.5" stroke-linecap="round"/>
      <!-- wool disguise with silver zipper! -->
      ${sheepWool('#F5F4F8')}
      <path d="M-4,-10 V14" stroke="#7D869B" stroke-width="2.6" stroke-dasharray="3 3" stroke-linecap="round"/>
      <rect x="-6.5" y="10" width="5" height="6" rx="1.5" fill="${YELLOW}" stroke="${INK}" stroke-width="1.6"/>
      <!-- wolf snout + pointy wolf ears poking through the hood! -->
      <path d="M13,-10 L11,-24 L21,-13 Z" fill="#7D869B" stroke="${INK}" stroke-width="2.4" ${W}/>
      <path d="M26,-11 L33,-24 L35,-10 Z" fill="#7D869B" stroke="${INK}" stroke-width="2.4" ${W}/>
      <path d="M14,-4 C16,-14 34,-12 39,-3 C41,3 35,8 25,8 C17,8 12,3 14,-4 Z" fill="#7D869B" ${S}/>
      <circle cx="39" cy="-3" r="3" fill="${INK}"/>
      <!-- mischievous yellow eyes + tiny white fang -->
      <circle cx="21" cy="-4" r="3.2" fill="${YELLOW}" stroke="${INK}" stroke-width="1.4"/><circle cx="22" cy="-4" r="1.4" fill="${INK}"/>
      <circle cx="29" cy="-4" r="3.2" fill="${YELLOW}" stroke="${INK}" stroke-width="1.4"/><circle cx="30" cy="-4" r="1.4" fill="${INK}"/>
      <path d="M23,3 Q29,6 34,2" fill="none" stroke="${INK}" stroke-width="2" ${W}/>
      <path d="M30,4 L32,8 L34,3 Z" fill="#fff" stroke="${INK}" stroke-width="1.2"/>
      <!-- whisper tag that only fades in during slow-mo! -->
      <text class="wolf-tag" x="8" y="-28" text-anchor="middle" font-family="Lilita One, sans-serif" font-size="10.5" fill="${YELLOW}" stroke="${INK}" stroke-width="2.2" paint-order="stroke" opacity="0">WOOF?</text>`;
  }

  function unmaskedWolfArt() {
    return `
      <!-- goofy unmasked gray wolf in polka-dot shorts! -->
      <path d="M-26,6 C-42,-4 -48,10 -38,18 C-30,20 -24,12 -22,8 Z" fill="#7D869B" stroke="${INK}" stroke-width="3" ${W}/>
      <ellipse cx="0" cy="4" rx="26" ry="18" fill="#7D869B" ${S}/>
      <!-- pink polka-dot boxers -->

  }

  const L = {
    id: 6,
    promptHTML: 'How many sheep?',
    endings: [
      { id: 'count', name: 'Slow-Mo Counter', line: 'One, two, three, four, five… COUNTED!', rarity: 56, icon: 'l6slow', stamp: 'COUNTED!' },
      { id: 'wolf', name: 'Wolf in Wool', line: '5 sheep… and 1 VERY bad disguise!', rarity: 18, icon: 'l6wolf', stamp: 'BUSTED!' },

    hints(found) {

    },
    demo(kind) {
      if (kind === 'hold') return { hold: { x: 195, y: 195 } };
      if (kind === 'wolf') return { hold: { x: 195, y: 245 } };

  // Level 6 stickers
  Object.assign(ART.stickers, {

      `<circle cx="-32" cy="-28" r="2.5" fill="#FFF4C2"/><circle cx="34" cy="-24" r="2.5" fill="#FFF4C2"/>` +
      `<g transform="translate(-4,10) scale(.95)">${sheepArt(0)}</g>` +

    l6wolf: (uid = 'a') => ART.stickerFrame(PINK,

  function build(ctx) {
    ctx.root.innerHTML = sceneSVG();
    const svg = ctx.root.querySelector('svg');
    const $ = (id) => svg.querySelector('#l6-' + id);

    const herdLayer = $('herd');
    const shWrap = $('sh-wrap'), sh = $('sh'), shIn = $('sh-in'), shTag = $('sh-tag');
    const slowFx = $('slow-fx'), slowPill = $('slow-pill'), slowBar = $('slow-bar');
    const holdUI = $('hold-ui'), holdArc = $('hold-arc'), holdLbl = $('hold-lbl');
    const tallyIn = $('tally-in'), tallyTxt = $('tally-txt');
    const ndBoil = $('nd-boil'), ndFace = $('nd-face'), ndArms = $('nd-arms');
    const cloud1 = $('cloud1'), cloud2 = $('cloud2');
    const fx = $('fx'), talkLayer = $('talk');

    // Reveal peeking hidden sheep only after the 470ms #prompt slam intro finishes so it never flashes!
    const shRevealTimer = setTimeout(() => { if (alive()) shWrap.setAttribute('opacity', '1'); }, 470);
    ctx.onCleanup(() => clearTimeout(shRevealTimer));

    const st = {
      done: false, counted: 0, foundHidden: false,
      simT: 0.1, timeScale: 1.0, slowActive: false, slowCoast: 0,
      pOff: { x: 0, y: 0 }, taps: {}, lastTouch: performance.now(),
    };
    const alive = () => ctx.alive;
    const bump = (k) => (st.taps[k] = (st.taps[k] || 0) + 1);
    const setFace = (eyes, mouth) => { ndFace.innerHTML = ART.noodleFace({ eyes, mouth }); };
    const setArms = (t) => { ndArms.innerHTML = ART.noodleArms(t); };
    const talk = (text, ms = 1900, ax = ND.x + 14, ay = ND.y - 68) => ctx.talk(talkLayer, ax, ay, text, ms, 0.25);

    function burst(text, x, y, color = YELLOW) {
      const g = U.svgEl('g', { transform: `translate(${x},${y})` }, fx);
      const inner = U.svgEl('g', { class: 'fb popin' }, g);
      let d = '';
      for (let i = 0; i < 16; i++) { const a = (i / 16) * Math.PI * 2, r = i % 2 ? 20 : 32; d += `${i ? 'L' : 'M'}${(Math.cos(a) * r * 1.5).toFixed(1)},${(Math.sin(a) * r).toFixed(1)} `; }
      U.svgEl('path', { d: d + 'Z', fill: color, stroke: INK, 'stroke-width': 3, 'stroke-linejoin': 'round' }, inner);
      const t = U.svgEl('text', { y: 6, 'text-anchor': 'middle', 'font-family': '"Lilita One", sans-serif', 'font-size': 15.5, fill: INK }, inner);
      t.textContent = text;
      setTimeout(() => g.remove(), 800);
    }

    function floatNum(text, x, y, color = MINT) {
      const t = U.svgEl('text', {
        x: x.toFixed(1), y: y.toFixed(1), 'text-anchor': 'middle',
        'font-family': '"Lilita One", sans-serif', 'font-size': 28,
        fill: color, stroke: INK, 'stroke-width': 3.2, 'paint-order': 'stroke',
      }, fx);
      t.textContent = text;
      U.tween(750, (p) => {
        if (!alive()) return;
        t.setAttribute('y', (y - 46 * p).toFixed(1));
        t.setAttribute('opacity', (1 - p).toFixed(2));
      }, U.ease.outCubic).then(() => t.remove());
    }

    /* ---------- Build the 6 leaping jumpers (5 real sheep + Jumper #4 Wolf in Wool) ---------- */
    const HOLD_CHARGE = 0.42; // seconds to fill the circular ring
    const COAST_DUR = 4.2;    // seconds Slow-Mo coasts after release (1-finger & desktop friendly!)

    const jumpers = [];
    for (let i = 0; i < HERD_N; i++) {
      const isWolf = i === WOLF_IDX;
      const g = U.svgEl('g', { transform: 'translate(-120,340)', style: 'cursor:pointer', 'data-no-hold': '1' }, herdLayer);
      // Supersonic white motion streaks shown at normal speed, hidden in Slow-Mo
      const streaks = U.svgEl('g', { class: 'l6-streaks', pointerEvents: 'none' }, g);
      U.svgEl('path', { d: 'M-28,-8 H-74 M-26,4 H-84 M-22,14 H-64', stroke: '#fff', 'stroke-width': 5, 'stroke-linecap': 'round', opacity: 0.72 }, streaks);
      // Generous invisible touch target so tapping in Slow-Mo feels buttery-smooth
      U.svgEl('circle', { r: 42, fill: '#000', 'fill-opacity': 0, 'pointer-events': 'all' }, g);
      const art = U.svgEl('g', { class: 'fb' }, g);
      art.innerHTML = isWolf ? wolfSheepArt() : sheepArt(i % 3);
      const wolfTag = isWolf ? art.querySelector('.wolf-tag') : null;
      // Mint counted badge pinned on real sheep once counted in Slow-Mo
      const badge = U.svgEl('g', { transform: 'translate(0,-30)', opacity: 0, pointerEvents: 'none' }, g);
      U.svgEl('circle', { r: 12, fill: MINT, stroke: INK, 'stroke-width': 2.6 }, badge);
      const badgeTxt = U.svgEl('text', { y: 4.5, 'text-anchor': 'middle', 'font-family': '"Lilita One", sans-serif', 'font-size': 13.5, fill: INK }, badge);

      g.addEventListener('pointerdown', (e) => {
        if (ctx.locked || st.done) return;
        st.lastTouch = performance.now();
        e.stopPropagation();

        // STRICT RULE: Tapping jumpers BEFORE entering Slow-Mo NEVER counts!
        if (!st.slowActive) {
          A.play('whoosh'); U.haptic(15);
          ctx.attempt();
          talk('Too fast! My fingers can’t catch them!', 1700);
          ctx.say('WHOOSH! Too fast — HOLD the night sky first to slow down time!');
          return;
        }

        // In Slow-Mo: tapping the Wolf unmasks it -> Secret Ending #1 (Wolf in Wool)!
        if (isWolf) {
          wolfEnding(jumpers[i]);
          return;
        }

        // In Slow-Mo: tapping a real sheep counts it!
        const j = jumpers[i];
        if (j.counted) {
          A.play('baa', 1.15);
          U.replay(j.art, 'hop');
          ctx.say(`Already counted #${j.num}! Tap the uncounted sheep!`);
          return;
        }
        j.counted = true;
        st.counted++;
        j.num = st.counted;
        badgeTxt.textContent = String(j.num);
        badge.setAttribute('opacity', '1');
        // Small momentum bonus to Slow-Mo coast so players chain all 5 taps smoothly!
        st.slowCoast = Math.min(COAST_DUR, st.slowCoast + 0.65);

        A.play('baa', 0.88 + st.counted * 0.08);
        U.haptic(20);
        U.replay(j.art, 'hop');
        floatNum(`${st.counted}!`, j.x, j.y - 34, MINT);
        tallyTxt.textContent = `${st.counted} / ${REAL_NEED}`;
        U.replay(tallyIn, 'popin');

        if (st.counted === 1) ctx.say('Nice! Keep tapping the real sheep (watch out for #4…)');
        else if (st.counted === 3) ctx.say('3 counted! Only 2 real sheep left!');
        else if (st.counted >= REAL_NEED) countEnding();
      });

      jumpers.push({ idx: i, isWolf, el: g, art, streaks, wolfTag, badge, x: -120, y: 340, visible: false, frozen: false, counted: false, num: 0 });
    }

    /* ---------- MAIN ENDING: All 5 real jumping sheep tapped in Slow-Mo! ---------- */
    async function countEnding() {
      if (st.done || !alive()) return;
      st.done = true; ctx.locked = true;
      holdUI.setAttribute('opacity', '0');
      slowPill.setAttribute('opacity', '0');
      A.play('baa', 1.15); U.haptic([25, 45, 35]);
      setFace('happy', 'grin'); setArms('up');
      talk('One, two, three, four, five… COUNTED!', 2400);
      ctx.say('5 real sheep counted! (And you didn’t fall for the wolf!)', 2600);
      await U.wait(1150);
      if (alive()) ctx.win('count');
    }

    /* ---------- SECRET ENDING #1: Tap the Wolf in Wool during Slow-Mo! ---------- */
    async function wolfEnding(j) {
      if (st.done || !alive()) return;
      st.done = true; ctx.locked = true;
      j.frozen = true;
      holdUI.setAttribute('opacity', '0');
      slowPill.setAttribute('opacity', '0');

      const wx = U.clamp(j.x, 86, 304), wy = U.clamp(j.y, 172, 320);
      j.el.setAttribute('transform', `translate(${wx.toFixed(1)},${wy.toFixed(1)})`);
      j.streaks.setAttribute('opacity', '0');
      if (j.wolfTag) j.wolfTag.setAttribute('opacity', '0');

      A.play('pop'); A.play('bark');
      U.haptic([35, 50, 80]);
      burst('IMPOSTOR!', U.clamp(wx + 46, 80, 310), wy - 36, PINK);

      const woolPop = U.svgEl('g', { transform: `translate(${wx},${wy})` }, fx);
      woolPop.innerHTML = sheepWool('#fff');
      U.tween(700, (t) => {

        j.el.setAttribute('transform', `translate(${U.lerp(wx, 460, t * t).toFixed(1)},${(wy + Math.sin(t * Math.PI * 3) * 10).toFixed(1)}) rotate(${(12 * t).toFixed(1)})`);

    /* ---------- SECRET ENDING #2: Find & tap the Hidden Sheep behind #prompt! ---------- */
    async function hiddenSheepEnding() {
      if (st.done || st.foundHidden || !alive()) return;
      st.foundHidden = true;
      st.done = true; ctx.locked = true;
      holdUI.setAttribute('opacity', '0');
      slowPill.setAttribute('opacity', '0');
      shWrap.setAttribute('opacity', '1');
      shWrap.parentNode.insertBefore(shWrap, slowFx);

      A.play('baa', 1.28); U.haptic(35);
      burst('BAA!', SHEEP_HIDE.x, 12, MINT);

      // Hop playfully from behind #prompt down onto the right meadow!
      const x0 = SHEEP_HIDE.x, y0 = SHEEP_HIDE.y;
      await U.tween(680, (t) => {
        if (!alive()) return;
        const x = U.lerp(x0, SHEEP_LAND.x, t);

      ctx.talk(talkLayer, SHEEP_LAND.x, SHEEP_LAND.y - 44, 'Baa… you found my hiding spot!', 2300, 0.78);
      ctx.say('Sneaky! One sheep was napping behind the question!', 2600);

    // Tap hidden sheep directly (peeking pom-pom OR once prompt banner is dragged aside!)
    sh.addEventListener('pointerdown', (e) => {
      if (ctx.locked || st.done) return;
      e.stopPropagation();
      st.lastTouch = performance.now();
      hiddenSheepEnding();
    });

    // Make #prompt draggable so dragging it aside uncovers the sleepy hidden sheep!
    const promptEl = ctx.promptEl;
    promptEl.classList.add('prompt-drag');
    let pDrag = null, bannerUncovered = false;
    function placePrompt(rot = -2) {
      promptEl.style.transform = `translate(calc(-50% + ${st.pOff.x.toFixed(1)}px), ${st.pOff.y.toFixed(1)}px) rotate(${rot.toFixed(1)}deg)`;
    }
    const onPromptDown = (e) => {
      if (ctx.locked || st.done || pDrag) return;
      st.lastTouch = performance.now();
      promptEl.classList.remove('slam');
      shWrap.setAttribute('opacity', '1');
      promptEl.style.transition = 'none';
      const p = ctx.sceneFromClient(e.clientX, e.clientY);
      pDrag = { id: e.pointerId, start: p, off0: { ...st.pOff }, maxMove: 0 };
      try { promptEl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      e.preventDefault();
    };
    const onPromptMove = (e) => {
      if (!pDrag || e.pointerId !== pDrag.id || st.done) return;
      const p = ctx.sceneFromClient(e.clientX, e.clientY);
      const dx = p.x - pDrag.start.x, dy = p.y - pDrag.start.y;
      pDrag.maxMove = Math.max(pDrag.maxMove, Math.hypot(dx, dy));
      st.pOff.x = U.clamp(pDrag.off0.x + dx, -200, 200);
      st.pOff.y = U.clamp(pDrag.off0.y + dy, -16, 220);
      placePrompt(U.clamp(-2 + dx * 0.08, -14, 12));
      if (!bannerUncovered && (Math.abs(st.pOff.x) > 58 || st.pOff.y > 42)) {
        bannerUncovered = true;
        A.play('baa', 1.3);
        U.replay(shIn, 'hop');
        ctx.say('WAIT… there’s a sleepy sheep back there! Tap it!', 2600);
      }
    };
    const onPromptUp = (e) => {
      if (!pDrag || e.pointerId !== pDrag.id) return;
      const moved = pDrag.maxMove;
      pDrag = null;
      if (moved < 8) {
        A.play('wobble');
        promptEl.style.transition = 'transform .22s cubic-bezier(.3,1.5,.5,1)';
        placePrompt(5);
        setTimeout(() => { if (alive() && !pDrag) placePrompt(-2); }, 180);
        ctx.say('Wait… did something fluffy just wiggle behind me?');
      } else {
        promptEl.style.transition = 'transform .25s ease-out';
        placePrompt(-2);
        A.play('tap');
      }
    };
    promptEl.addEventListener('pointerdown', onPromptDown);
    promptEl.addEventListener('pointermove', onPromptMove);
    promptEl.addEventListener('pointerup', onPromptUp);
    promptEl.addEventListener('pointercancel', onPromptUp);
    ctx.onCleanup(() => {
      promptEl.removeEventListener('pointerdown', onPromptDown);
      promptEl.removeEventListener('pointermove', onPromptMove);
      promptEl.removeEventListener('pointerup', onPromptUp);
      promptEl.removeEventListener('pointercancel', onPromptUp);
    });

    /* ---------- Hold-to-Slow-Mo (Circular progress ring + 4.2s bullet-time coast after release!) ---------- */
    let hold = null;

    function onSceneDown(e) {
      if (ctx.locked || st.done || hold) return;
      if (e.target.closest('[data-no-hold]')) return;
      st.lastTouch = performance.now();
      const pt = U.svgPoint(svg, e.clientX, e.clientY);
      hold = { id: e.pointerId, x: pt.x, y: pt.y, t0: performance.now(), charged: false, target: e.target };
    }
    function onSceneMove(e) {
      if (!hold || e.pointerId !== hold.id) return;
      const pt = U.svgPoint(svg, e.clientX, e.clientY);
      hold.x = pt.x; hold.y = pt.y;
    }
    function onSceneUp(e) {
      if (!hold || e.pointerId !== hold.id) return;
      const elapsed = (performance.now() - hold.t0) / 1000;
      const wasCharged = hold.charged;
      const startTarget = hold.target;
      hold = null;
      holdUI.setAttribute('opacity', '0');
      holdArc.setAttribute('stroke-dashoffset', '226.2');
      if (st.done) return;
      if (!wasCharged && elapsed < 0.24) {
        const hit = startTarget && startTarget.closest('[data-tap]');
        if (hit && taps[hit.getAttribute('data-tap')]) taps[hit.getAttribute('data-tap')](hit);
      } else if (!wasCharged && elapsed >= 0.24) {
        ctx.say('Keep holding a tiny bit longer until the ring fills!');
      }
    }
    svg.addEventListener('pointerdown', onSceneDown);
    window.addEventListener('pointermove', onSceneMove);
    window.addEventListener('pointerup', onSceneUp);
    window.addEventListener('pointercancel', onSceneUp);
    ctx.onCleanup(() => {
      window.removeEventListener('pointermove', onSceneMove);
      window.removeEventListener('pointerup', onSceneUp);
      window.removeEventListener('pointercancel', onSceneUp);
    });

    const t0 = performance.now();
    let last = t0;
    (function loop(now) {
      if (!alive()) return;
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      const realT = (now - t0) / 1000;

      // 1. Hold-to-Slow-Mo charge & bullet-time coast
      if (hold && !st.done) {
        const held = (now - hold.t0) / 1000;
        if (held > 0.1) {
          const p = U.clamp((held - 0.1) / HOLD_CHARGE, 0, 1);
          holdUI.setAttribute('opacity', '1');
          holdUI.setAttribute('transform', `translate(${U.clamp(hold.x, 48, 342).toFixed(1)},${U.clamp(hold.y, 44, 460).toFixed(1)})`);
          holdArc.setAttribute('stroke-dashoffset', (226.2 * (1 - p)).toFixed(1));
          holdArc.setAttribute('stroke', p >= 1 ? MINT : YELLOW);
          holdLbl.textContent = p >= 1 ? 'SLOW-MO!' : 'HOLD…';
          holdLbl.setAttribute('fill', p >= 1 ? MINT : YELLOW);
          if (p >= 1 && !hold.charged) {
            hold.charged = true;
            if (!st.slowActive) { A.play('slowmo'); U.haptic(25); }
            st.slowActive = true;
            st.slowCoast = COAST_DUR;
            setFace('open', 'o');
            const rip = U.svgEl('circle', { cx: hold.x, cy: hold.y, r: 36, fill: 'none', stroke: MINT, 'stroke-width': 4 }, fx);
            U.tween(380, (t) => {
              if (!alive()) return;
              rip.setAttribute('r', (36 + 34 * t).toFixed(1));
              rip.setAttribute('opacity', (1 - t).toFixed(2));
            }).then(() => rip.remove());
          }
          if (hold.charged) st.slowCoast = COAST_DUR;
        }
      } else if (st.slowActive && !st.done) {
        st.slowCoast = Math.max(0, st.slowCoast - dt);
        if (st.slowCoast <= 0) {
          st.slowActive = false;
          A.play('speedup');
          setFace('spiral', 'o');
        }
      }

      // Smooth timeScale interpolation (0.21x in Slow-Mo: super clear & tappable!)
      const targetScale = st.slowActive ? 0.21 : (hold && (now - hold.t0) > 120 ? 0.48 : 1.0);
      st.timeScale += (targetScale - st.timeScale) * Math.min(1, dt * 10);

      // Slow-mo HUD & vignette visuals
      const slowVis = U.clamp((1 - st.timeScale) / 0.79, 0, 1);
      slowFx.setAttribute('opacity', (slowVis * 0.95).toFixed(2));
      if (st.slowActive && !st.done) {
        slowPill.setAttribute('opacity', '1');
        slowBar.setAttribute('width', (96 * (st.slowCoast / COAST_DUR)).toFixed(1));
      } else {
        slowPill.setAttribute('opacity', '0');
      }

      // 2. Advance herd clock (fast-skip empty inter-wave gap in Slow-Mo so player never waits!)
      if (!st.done) {
        st.simT += dt * st.timeScale;
        const lastEnd = (HERD_N - 1) * GAP + DUR;
        if (st.slowActive && st.simT > lastEnd + 0.06 && st.simT < CYCLE - 0.08) {
          st.simT = CYCLE - 0.08;
        }
        if (st.simT >= CYCLE) st.simT -= CYCLE;
      }

      // 3. Parabolic jump paths over the wooden fence
      const fastFactor = U.clamp((st.timeScale - 0.35) / 0.65, 0, 1);
      const sx = 1 + fastFactor * 0.36;
      const sy = 1 - fastFactor * 0.12;
      jumpers.forEach((j) => {
        if (j.frozen) return;
        const u = (st.simT - j.idx * GAP) / DUR;
        if (u >= 0 && u <= 1) {
          j.visible = true;
          const x = U.lerp(-58, 448, u);
          const y = 382 - Math.sin(u * Math.PI) * 154 + (j.idx % 2) * 8;
          const rot = Math.cos(u * Math.PI) * -22;
          j.x = x; j.y = y;
          j.el.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${sx.toFixed(3)},${sy.toFixed(3)})`);
          j.streaks.setAttribute('opacity', (fastFactor * 0.85).toFixed(2));
          if (j.wolfTag) j.wolfTag.setAttribute('opacity', (slowVis > 0.65 ? (slowVis - 0.65) / 0.35 : 0).toFixed(2));
        } else if (j.visible) {
          j.visible = false;
          j.el.setAttribute('transform', 'translate(-140,340)');
        }
      });

      // Gentle drifting night clouds
      cloud1.setAttribute('transform', `translate(${(86 + Math.sin(realT * 0.25) * 14).toFixed(1)},98)`);
      cloud2.setAttribute('transform', `translate(${(232 + Math.cos(realT * 0.2) * 16).toFixed(1)},140)`);

      // Subtle peeking bob on hidden sheep while still behind prompt
      if (!st.foundHidden) {
        sh.setAttribute('transform', `translate(${SHEEP_HIDE.x},${(SHEEP_HIDE.y + Math.sin(realT * 2.4) * 2.5).toFixed(1)})`);
      }

      if (!st.done && now - st.lastTouch > 8500) {
        st.lastTouch = now;
        ctx.say(U.pick([
          'Psst… HOLD the sky to slow down time, then tap the sheep!',
          'Did a pink nightcap just peek above the title?',
          'Look closely at jumper #4 in slow motion…',
        ]));
      }
      requestAnimationFrame(loop);
    })(t0);

    /* ---------- Reactions (no dead taps!) ---------- */
    const noodleLines = ['Too fast! Slow time down first!', 'Was that 5 or 50?!', 'Try holding the sky to slow them down!'];
    const taps = {
      noodle() {

      fence() { A.play('bonk'); ctx.say('Sturdy wooden fence. Sheep-jumping certified.'); ctx.attempt(); },
      sky() { A.play('tap'); ctx.say('HOLD your finger down here to slow time, then tap the sheep!'); ctx.attempt(); },
      hill() { A.play('tap'); ctx.say('Soft midnight grass. Try holding down to slow time!'); ctx.attempt(); },
    };
  }

  BF.levels = BF.levels || {};
  BF.levels[6] = L;
})(window.BF);

  function build(ctx) {
    ctx.root.innerHTML = sceneSVG();

    const lampPivot = q('#l7-lamp-pivot'), clockM = q('#l7-clock-m'), soupSteam = q('#l7-soup-steam');
    const blindPane = q('#l7-blind-pane'), blindHandle = q('#l7-blind-handle'), sunSliver = q('#l7-sun-sliver'), sunbeam = q('#l7-sunbeam');
    const pepperEl = q('#l7-pepper'), pepperIn = q('#l7-pepper-in');
    const saltEl = q('#l7-salt'), saltIn = q('#l7-salt-in');
    const featherEl = q('#l7-feather'), featherIn = q('#l7-feather-in');
    const dustPile = q('#l7-dust-pile'), dustBunnies = q('#l7-dust-bunnies');
    const micBtn = q('#l7-mic-btn'), micIn = q('#l7-mic-in'), micPill = q('#l7-mic-pill'), micTxt = q('#l7-mic-txt'), micRing = q('#l7-mic-ring');
    const fx = q('#l7-fx'), talkLayer = q('#l7-talk');

    const st = {
      done: false,
      pepperPuffs: 0,
      pepperHeld: false,
      pepperPos: { ...PEP0 },
      overNoodle: false,
      overSince: 0,
      droppedHintFlake: false,
      saltHeld: false,
      saltPos: { ...SALT0 },
      featherHeld: false,
      featherPos: { ...FEATH0 },
      blindOpen: 0, // 0 = closed, 1 = fully open
      holdingBlind: false,
      dustHits: 0,
      micRevealed: false,
      lampVel: 0,
      lampAng: 0,
      lastTickle: 0,
      lastPuffAt: 0,
      lastSaltAt: 0,
      lastDustAt: 0,
      lastIdle: performance.now(),
    };

    const alive = () => ctx.alive;
    const setFace = (o) => { ndFace.innerHTML = ART.noodleFace(o); };
    const setArms = (t) => { ndArms.innerHTML = t === 'tissue' ? tissueArmPose() : ART.noodleArms(t, YELLOW); };
    const talk = (text, ms = 1850) => ctx.talk(talkLayer, ND0.x, ND0.y - 68, text, ms);

    function isOverNoodle(x, y) {
      return x >= 116 && x <= 274 && y >= 150 && y <= 355;
    }

    function pop(x, y, text, color = PINK, size = 18) {
      const el = U.svgEl('text', {
        x, y, 'text-anchor': 'middle',
        'font-family': 'Lilita One, sans-serif', 'font-size': size,
        fill: color, stroke: INK, 'stroke-width': 3.6, 'paint-order': 'stroke',
      }, fx);
      el.textContent = text;
      U.tween(700, (t) => {
        el.setAttribute('y', (y - t * 42).toFixed(1));
        el.setAttribute('opacity', (1 - t * t).toFixed(2));
      }, U.ease.outCubic).then(() => el.remove());
    }

    function setBlind(open) {
      st.blindOpen = U.clamp(open, 0, 1);
      const lift = st.blindOpen * (BLIND_MAX_Y - 12);
      blindPane.setAttribute('transform', `translate(0,${(-lift).toFixed(1)})`);
      blindHandle.setAttribute('transform', `translate(84,${(46 + BLIND_MAX_Y - lift).toFixed(1)})`);
      sunSliver.setAttribute('opacity', (0.55 * (1 - st.blindOpen)).toFixed(2));
      sunbeam.setAttribute('opacity', (st.blindOpen > 0.25 ? (st.blindOpen - 0.25) * 0.95 : 0).toFixed(2));
    }

    function revealMicBadge() {
      if (st.micRevealed) return;
      st.micRevealed = true;
      micBtn.setAttribute('opacity', '1');

    /* ---------- SHARED EXPLOSIVE MEGA SNEEZE FINALE ---------- */
    async function triggerSneeze(endingId, style, talkLine, narrLine) {
      if (st.done || !alive()) return;
      st.done = true;
      ctx.locked = true;
      I.stopMic();

      // 1. Giant dramatic inhale ("AAAH…")
      setFace({ eyes: 'squint', mouth: 'bigO' });
      setArms('up');
      ahPuff.setAttribute('opacity', '1');
      nose.setAttribute('r', '7.6');
      A.play('wobble');
      await U.tween(380, (t) => {
        if (!alive()) return;
        const sx = U.lerp(1, 1.18, t), sy = U.lerp(1, 1.14, t);
        ndAnim.setAttribute('transform', `translate(0,${(-t * 14).toFixed(1)}) scale(${sx.toFixed(3)},${sy.toFixed(3)})`);
      }, U.ease.outCubic);
      if (!alive()) return;

      // 2. EXPLOSIVE ACHOOO!!
      ahPuff.setAttribute('opacity', '0');
      A.play('sneeze');
      U.haptic([30, 45, 110]);
      U.replay(room, 'quake');
      st.lampVel = 18; // sneeze blast swings the ceiling lamp!

      const blast = U.svgEl('text', {
        x: ND0.x, y: ND0.y - 84, 'text-anchor': 'middle',
        'font-family': 'Lilita One, sans-serif', 'font-size': 42,
        fill: YELLOW, stroke: INK, 'stroke-width': 6.5, 'paint-order': 'stroke',
      }, fx);
      blast.textContent = 'ACHOOO!!';

      const ring = U.svgEl('circle', {
        cx: ND0.x, cy: ND0.y - 12, r: 16, fill: 'none',
        stroke: style === 'sun' ? '#FFE46B' : style === 'dust' ? '#CBD5E1' : '#fff',
        'stroke-width': 6,
      }, fx);

      for (let i = 0; i < 14; i++) {
        const ang = (i / 14) * Math.PI * 2 + U.rand(-0.2, 0.2);
        const dist = U.rand(70, 165);
        const p = i % 3 === 0
          ? U.svgEl('path', { d: 'M-10,-6 Q0,-12 10,-6 Q6,4 10,10 Q0,6 -10,10 Q-6,2 -10,-6 Z', fill: '#fff', stroke: INK, 'stroke-width': 2.2 }, fx)
          : U.svgEl('circle', {
              r: U.rand(3.5, 7.2).toFixed(1),
              fill: style === 'pepper' ? INK : style === 'dust' ? '#B0BEC5' : '#FFD23F',
              stroke: INK, 'stroke-width': 1.8,
            }, fx);
        const sx = ND0.x, sy = ND0.y - 12, rot = U.rand(-240, 240);
        U.tween(720, (t) => {
          const px = sx + Math.cos(ang) * dist * t;
          const py = sy + Math.sin(ang) * dist * t + 36 * t * t;
          p.setAttribute('transform', `translate(${px.toFixed(1)},${py.toFixed(1)}) rotate(${(rot * t).toFixed(0)}) scale(${(1 - t * 0.35).toFixed(2)})`);
          p.setAttribute('opacity', (1 - t * t).toFixed(2));
        }, U.ease.outCubic).then(() => p.remove());
      }

      await Promise.all([
        U.tween(540, (t) => {
          if (!alive()) return;
          ring.setAttribute('r', U.lerp(16, 175, t).toFixed(1));
          ring.setAttribute('opacity', (1 - t).toFixed(2));
          blast.setAttribute('transform', `translate(0,${(-t * 28).toFixed(1)}) scale(${(1 + Math.sin(t * Math.PI) * 0.16).toFixed(2)})`);
          blast.setAttribute('opacity', (1 - t * 0.85).toFixed(2));
        }, U.ease.outCubic),
        U.tween(520, (t) => {
          if (!alive()) return;
          const rec = Math.sin(t * Math.PI);
          ndAnim.setAttribute('transform', `translate(${(rec * -18).toFixed(1)},${(rec * 12).toFixed(1)}) rotate(${(rec * -15).toFixed(1)}) scale(${(1 - rec * 0.08).toFixed(2)},${(1 + rec * 0.12).toFixed(2)})`);
        }, U.ease.outCubic),
      ]);
      ring.remove(); blast.remove();
      if (!alive()) return;

      ndAnim.setAttribute('transform', '');
      nose.setAttribute('r', '3.6');
      setFace({ eyes: 'happy', mouth: 'grin' });
      setArms('wave');
      talk(talkLine, 2200);
      ctx.say(narrLine);
      await U.wait(650);
      if (alive()) ctx.win(endingId);

    /* ---------- ENDING 1 (MAIN): PEPPER STORM (Drag + Shake OR Wiggle!) ---------- */
    function sprinklePepper(px, py) {
      if (st.done) return;

      for (let i = 0; i < 12; i++) {
        const sx = px + U.rand(-16, 16), sy = py + 12;
        const flake = U.svgEl('circle', { cx: sx, cy: sy, r: U.rand(2.2, 4.2).toFixed(1), fill: i % 4 === 0 ? '#5E6478' : INK }, fx);
        const tx = ND0.x + U.rand(-24, 24), ty = ND0.y - 12 + U.rand(-14, 14);
        U.tween(460, (t) => {
          flake.setAttribute('cx', U.lerp(sx, tx, t).toFixed(1));
          flake.setAttribute('cy', U.lerp(sy, ty, t).toFixed(1));
          flake.setAttribute('opacity', (1 - t * t).toFixed(2));
        }, U.ease.outCubic).then(() => flake.remove());
      }

      if (st.pepperPuffs === 1) {
        nose.setAttribute('r', '5.8');
        setFace({ eyes: 'squint', mouth: 'o' });
        pop(ND0.x, ND0.y - 68, 'Sniff…!', ORANGE, 18);
        talk('Ooh, spicy!!');
        ctx.say('Spicy! Give it another shake!');
      } else if (st.pepperPuffs === 2) {
        nose.setAttribute('r', '6.8');
        setFace({ eyes: 'squint', mouth: 'bigO' });
        setArms('shrug');
        pop(ND0.x, ND0.y - 72, 'AAAH…!', PINK, 22);
        talk('AAAH… ONE MORE SHAKE!!');
        ctx.say('Right on the edge — one more shake!');
      } else {
        triggerSneeze('pepper', 'pepper', 'Ahhhh… FINALLY!! Bless me!', 'Drag, shake, season. Extra spicy!');
      }
    }

    function sprinkleSalt(px, py) {
      if (st.done) return;
      const now = performance.now();
      if (now - st.lastSaltAt < 460) return;
      st.lastSaltAt = now;
      A.play('shakeSalt');
      ctx.attempt();

      for (let i = 0; i < 10; i++) {
        const sx = px + U.rand(-14, 14), sy = py + 12;
        const grain = U.svgEl('rect', { x: sx, y: sy, width: 4.5, height: 4.5, rx: 1, fill: '#fff', stroke: INK, 'stroke-width': 1.2 }, fx);
        const tx = ND0.x + U.rand(-24, 24), ty = ND0.y - 16 + U.rand(-10, 14);
        U.tween(440, (t) => {
          grain.setAttribute('x', U.lerp(sx, tx, t).toFixed(1));
          grain.setAttribute('y', U.lerp(sy, ty, t).toFixed(1));
          grain.setAttribute('opacity', (1 - t * t).toFixed(2));
        }, U.ease.outCubic).then(() => grain.remove());
      }
      setFace({ eyes: 'wide', mouth: 'frown' });
      pop(ND0.x, ND0.y - 66, 'SALTY!', SKY, 18);
      talk('Bleh! Wrong shaker, chef!');
      ctx.say('Salt only makes him thirsty.');
    }

    let pepPrev = null, pepTravel = 0, pepLastDir = 0, pepFlips = 0;
    I.drag(pepperEl, svg, {
      onStart() {
        if (ctx.locked || st.done) return;
        st.pepperHeld = true;
        pepPrev = null; pepTravel = 0; pepLastDir = 0; pepFlips = 0;
        st.droppedHintFlake = false;
        A.play('pop');
        ctx.attempt();
      },
      onMove(p) {
        if (ctx.locked || st.done || !st.pepperHeld) return;
        const x = U.clamp(p.x, 34, 356), y = U.clamp(p.y, 48, 535);
        st.pepperPos = { x, y };
        const over = isOverNoodle(x, y);
        if (over && !st.overNoodle) st.overSince = performance.now();
        st.overNoodle = over;
        pepperEl.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${over ? 156 : -10})`);

        if (over) {
          if (pepPrev) {
            const dx = x - pepPrev.x, dy = y - pepPrev.y;
            pepTravel += Math.hypot(dx, dy);
            const dom = Math.abs(dx) > Math.abs(dy) ? dx : dy;
            if (Math.abs(dom) > 5) {
              const dir = Math.sign(dom);
              if (pepLastDir && dir !== pepLastDir) pepFlips++;
              pepLastDir = dir;
            }
            if (pepTravel >= 95 || (pepFlips >= 2 && pepTravel >= 46)) {
              pepTravel = 0; pepFlips = 0;
              sprinklePepper(x, y);
            }
          }
          pepPrev = { x, y };
        } else {
          pepPrev = null; pepTravel = 0; pepFlips = 0;
        }
      },
      onTap() {
        st.pepperHeld = false; st.overNoodle = false;
        if (ctx.locked || st.done) return;
        pepperEl.setAttribute('transform', `translate(${PEP0.x},${PEP0.y})`);
        A.play('shakeSalt'); U.replay(pepperIn, 'wiggle');
        ctx.say('Freshly ground black pepper. Very sneezy.');
      },
      async onEnd() {
        if (!st.pepperHeld) return;
        st.pepperHeld = false; st.overNoodle = false;
        if (st.done) return;
        const sx = st.pepperPos.x, sy = st.pepperPos.y;
        await U.tween(240, (t) => {
          if (!alive() || st.done || st.pepperHeld) return;
          pepperEl.setAttribute('transform', `translate(${U.lerp(sx, PEP0.x, t).toFixed(1)},${U.lerp(sy, PEP0.y, t).toFixed(1)}) rotate(${U.lerp(20, 0, t).toFixed(1)})`);
        }, U.ease.outBack);
        st.pepperPos = { ...PEP0 };
      },
    });

    let saltPrev = null, saltTravel = 0;
    I.drag(saltEl, svg, {
      onStart() {
        if (ctx.locked || st.done) return;
        st.saltHeld = true; saltPrev = null; saltTravel = 0;
        A.play('pop');
        ctx.attempt();
      },
      onMove(p) {
        if (ctx.locked || st.done || !st.saltHeld) return;
        const x = U.clamp(p.x, 34, 356), y = U.clamp(p.y, 48, 535);
        st.saltPos = { x, y };
        const over = isOverNoodle(x, y);
        saltEl.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${over ? 156 : 10})`);
        if (over) {
          if (saltPrev) {
            saltTravel += Math.hypot(x - saltPrev.x, y - saltPrev.y);
            if (saltTravel >= 72) { saltTravel = 0; sprinkleSalt(x, y); }
          }
          saltPrev = { x, y };
        } else {
          saltPrev = null; saltTravel = 0;
        }
      },
      onTap() {
        st.saltHeld = false;
        if (ctx.locked || st.done) return;
        saltEl.setAttribute('transform', `translate(${SALT0.x},${SALT0.y})`);
        A.play('shakeSalt'); U.replay(saltIn, 'wiggle');
        ctx.say('Plain table salt. Not exactly sneeze fuel.');
      },
      async onEnd() {
        if (!st.saltHeld) return;
        st.saltHeld = false;
        if (st.done) return;
        const sx = st.saltPos.x, sy = st.saltPos.y;
        await U.tween(240, (t) => {
          if (!alive() || st.done || st.saltHeld) return;
          saltEl.setAttribute('transform', `translate(${U.lerp(sx, SALT0.x, t).toFixed(1)},${U.lerp(sy, SALT0.y, t).toFixed(1)})`);
        }, U.ease.outBack);
        st.saltPos = { ...SALT0 };
      },
    });

    function onDeviceShake(src) {
      if (ctx.locked || st.done) return;
      if (st.pepperHeld && st.overNoodle) {
        sprinklePepper(st.pepperPos.x, st.pepperPos.y);
      } else if (st.saltHeld && isOverNoodle(st.saltPos.x, st.saltPos.y)) {
        sprinkleSalt(st.saltPos.x, st.saltPos.y);
      } else {
        A.play('shakeSalt');
        U.replay(pepperIn, 'wiggle');
        st.lampVel = 10;
        if (src === 'shake' || src === 'debug') {
          ctx.say('Hold something spicy over his nose first, then shake!');
          ctx.attempt();
        }
      }
    }
    ctx.onCleanup(I.onJolt(() => onDeviceShake('jolt')));
    ctx.onCleanup(I.onShake((src) => onDeviceShake(src || 'shake')));

    /* ---------- ENDING 2 (SECRET #1): BRIGHT IDEA! (Pull Window Blinds Up -> Sun Sneeze!) ---------- */
    let blindStartOpen = 0;
    async function winSunSneeze() {
      if (st.done || !alive()) return;
      st.holdingBlind = false;
      A.play('curtain');
      await U.tween(220, (t) => {
        if (!alive()) return;
        setBlind(U.lerp(st.blindOpen, 1, t));
      }, U.ease.outBack);
      if (!alive() || st.done) return;
      setFace({ eyes: 'squint', mouth: 'o' });
      talk('WHOA—TOO BRIGHT!!', 1400);
      pop(ND0.x, ND0.y - 72, 'SO BRIGHT!!', YELLOW, 19);
      await U.wait(420);
      if (!alive() || st.done) return;
      triggerSneeze('sun', 'sun', 'The sun trick actually worked!!', 'When a sneeze gets stuck, always look at the sun.');
    }

    I.drag(blindHandle, svg, {
      onStart() {
        if (ctx.locked || st.done) return;
        st.holdingBlind = true;
        blindStartOpen = st.blindOpen;
        A.play('tap');
        ctx.attempt();
      },
      onMove(p, d) {
        if (!st.holdingBlind || ctx.locked || st.done) return;
        // Dragging UP (negative dy) rolls the blinds open!
        const next = U.clamp(blindStartOpen + (-d.dy) / (BLIND_MAX_Y - 12), 0, 1);
        setBlind(next);
        if (next >= 0.78) {
          winSunSneeze();
        }
      },
      onTap() {
        st.holdingBlind = false;
        if (ctx.locked || st.done) return;
        A.play('curtain');
        // Quick playful peek of golden sunlight when tapped!
        U.tween(300, (t) => {
          if (!alive() || st.holdingBlind || st.done) return;
          setBlind(Math.sin(t * Math.PI) * 0.22);
        });
        ctx.say('Whoa, blazing sun outside! Good thing the blinds pull up…');
      },
      async onEnd() {
        if (!st.holdingBlind || st.done) return;
        st.holdingBlind = false;
        if (st.blindOpen >= 0.72) {
          winSunSneeze();
          return;
        }
        // Snap gently back down if not pulled all the way up
        const from = st.blindOpen;
        await U.tween(260, (t) => {
          if (!alive() || st.done || st.holdingBlind) return;
          setBlind(U.lerp(from, 0, t));
        }, U.ease.outBack);
        if (from > 0.25) ctx.say('Almost! Pull the blinds all the way up!');
      },
    });

    /* ---------- ENDING 3 (SECRET #2): 1998 DUST STORM (Mic Blow OR Scrub/Tap Shelf!) ---------- */
    function kickDust(mega = false) {
      if (st.done) return;
      const now = performance.now();
      if (!mega && now - st.lastDustAt < 280) return;
      st.lastDustAt = now;
      st.dustHits = mega ? 3 : st.dustHits + 1;
      revealMicBadge();
      A.play('puff');
      U.haptic(mega ? 40 : 16);
      U.replay(dustBunnies, 'wiggle');
      ctx.attempt();

      const clouds = mega ? 14 : 6;
      for (let i = 0; i < clouds; i++) {
        const sx = DUST_C.x + U.rand(-40, 40), sy = DUST_C.y + U.rand(-6, 16);
        const c = U.svgEl('circle', {
          cx: sx, cy: sy, r: U.rand(mega ? 12 : 8, mega ? 22 : 14).toFixed(1),
          fill: i % 2 ? '#CBD5E1' : '#E2E8F0', stroke: INK, 'stroke-width': 2.2, opacity: '0.92',
        }, fx);
        const tx = ND0.x + U.rand(-30, 30), ty = ND0.y - 12 + U.rand(-24, 20);
        U.tween(mega ? 620 : 520, (t) => {
          c.setAttribute('cx', U.lerp(sx, tx, t).toFixed(1));
          c.setAttribute('cy', U.lerp(sy, ty, t).toFixed(1));
          c.setAttribute('opacity', (0.92 * (1 - t * 0.7)).toFixed(2));
        }, U.ease.outCubic).then(() => c.remove());
      }

      if (mega) {
        for (let i = 0; i < 3; i++) {
          const y0 = 104 + i * 16;
          const gust = U.svgEl('path', {
            d: `M368,${y0} Q288,${y0 + 36} 214,${ND0.y - 24 + i * 12}`,
            fill: 'none', stroke: '#fff', 'stroke-width': 4.5, 'stroke-linecap': 'round', opacity: '0.88',
          }, fx);
          U.tween(540, (t) => gust.setAttribute('opacity', (0.88 * (1 - t)).toFixed(2))).then(() => gust.remove());
        }
        dustBunnies.setAttribute('opacity', '0.18');
        talk('WHOA!! 1998 DUST STORM!!', 1400);
        setTimeout(() => {
          if (alive() && !st.done) triggerSneeze('dust', 'dust', 'Ahhhh… clean that shelf!!', 'Decades of shelf dust straight to the nose!');
        }, 260);
      } else if (st.dustHits === 1) {
        dustBunnies.setAttribute('opacity', '0.76');
        pop(ND0.x, ND0.y - 66, '*cough*', '#94A3B8', 18);
        talk('*cough* Is that dust from 1998?!');
        ctx.say('That shelf has not been dusted this century. Keep going — or blow!');
      } else if (st.dustHits === 2) {
        dustBunnies.setAttribute('opacity', '0.48');
        nose.setAttribute('r', '6.6');
        setFace({ eyes: 'squint', mouth: 'bigO' });
        pop(ND0.x, ND0.y - 72, 'SO DUSTY…!', '#94A3B8', 20);
        talk('AAAH… TOO MUCH DUST!!');
        ctx.say('One more puff of shelf dust!');
      } else {
        dustBunnies.setAttribute('opacity', '0.18');
        triggerSneeze('dust', 'dust', 'Ahhhh… clean that shelf!!', 'Decades of shelf dust straight to the nose!');
      }
    }

    let dustPrev = null, dustTravel = 0;
    I.drag(dustPile, svg, {
      onStart(p) {
        if (ctx.locked || st.done) return;
        dustPrev = p; dustTravel = 0;
      },
      onMove(p) {
        if (ctx.locked || st.done || !dustPrev) return;
        dustTravel += Math.hypot(p.x - dustPrev.x, p.y - dustPrev.y);
        dustPrev = p;
        if (dustTravel >= 44) {
          dustTravel = 0;
          kickDust(false);
        }
      },
      onTap() {
        dustPrev = null;
        if (ctx.locked || st.done) return;
        kickDust(false);
      },
      onEnd() { dustPrev = null; },
    });

    ctx.onCleanup(I.onBlow(() => { if (!ctx.locked && !st.done) kickDust(true); }));
    ctx.onCleanup(() => I.stopMic());

    /* ---------- GDD DECOY: PINK TICKLE FEATHER (giggles only!) ---------- */
    I.drag(featherEl, svg, {
      onStart() {
        if (ctx.locked || st.done) return;
        st.featherHeld = true;
        A.play('swish');
        ctx.attempt();
      },
      onMove(p) {
        if (ctx.locked || st.done || !st.featherHeld) return;
        const x = U.clamp(p.x, 32, 358), y = U.clamp(p.y, 44, 536);
        st.featherPos = { x, y };
        const wob = Math.sin(performance.now() * 0.025) * 14;
        featherEl.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${wob.toFixed(1)})`);
        const now = performance.now();
        if (Math.hypot(x - ND0.x, y - (ND0.y - 10)) < 62 && now - st.lastTickle > 680) {
          st.lastTickle = now;
          A.play('giggle');
          U.replay(ndAnim, 'wiggle');
          setFace({ eyes: 'happy', mouth: 'grin' });
          setArms('hug');
          pop(ND0.x + U.rand(-22, 22), ND0.y - 68, U.pick(['HEHE!', 'TICKLES!', 'HAHA!']), PINK, 19);
          talk(U.pick(['Hehe! Stop, that just tickles!', 'Haha! Feathers only make me laugh!']));
          ctx.say('Classic cartoon trap — feathers only make him giggle.');
        }
      },
      onTap() {
        st.featherHeld = false;
        if (ctx.locked || st.done) return;
        featherEl.setAttribute('transform', `translate(${FEATH0.x},${FEATH0.y})`);
        A.play('swish'); U.replay(featherIn, 'wiggle');
        ctx.say('A fluffy pink feather. Classic… maybe too classic.');
      },
      async onEnd() {
        if (!st.featherHeld) return;
        st.featherHeld = false;
        if (st.done) return;
        const sx = st.featherPos.x, sy = st.featherPos.y;
        await U.tween(320, (t) => {
          if (!alive() || st.done || st.featherHeld) return;
          const cx = U.lerp(sx, FEATH0.x, t);
          const cy = U.lerp(sy, FEATH0.y, t) - Math.sin(t * Math.PI) * 24;
          featherEl.setAttribute('transform', `translate(${cx.toFixed(1)},${cy.toFixed(1)}) rotate(${(Math.sin(t * Math.PI * 2) * 12).toFixed(1)})`);
        }, U.ease.outCubic);
        st.featherPos = { ...FEATH0 };
        if (!st.done) {
          setFace({ eyes: 'squint', mouth: 'o' });
          setArms('tissue');
        }
      },
    });

    /* ---------- ANIMATION LOOP ---------- */
    const t0 = performance.now();
    let prev = t0;
    (function loop(now) {
      if (!alive()) return;
      const dt = Math.min(0.05, (now - prev) / 1000);
      prev = now;
      const t = (now - t0) / 1000;

      // Lamp pendulum spring physics
      if (Math.abs(st.lampAng) > 0.05 || Math.abs(st.lampVel) > 0.05) {
        st.lampVel += (-26 * st.lampAng - 3.2 * st.lampVel) * dt;
        st.lampAng += st.lampVel * dt;
        lampPivot.setAttribute('transform', `translate(195,-16) rotate(${st.lampAng.toFixed(2)})`);
      }

      if (!st.done) {
        // Gentle pre-sneeze bobbing + itchy nose twitch
        const bob = Math.sin(t * 3.4) * 2;
        ndG.setAttribute('transform', `translate(${ND0.x},${(ND0.y + bob).toFixed(1)})`);
        // Soup steam drift + ticking clock hand
        soupSteam.setAttribute('transform', `translate(${(Math.sin(now / 420) * 1.5).toFixed(1)},${(Math.cos(now / 360) * 1.6).toFixed(1)})`);
        clockM.setAttribute('transform', `rotate(${((now / 80) % 360).toFixed(1)})`);

        // Mic listening ring pulse
        if (I.micActive) {
          const pulse = (t * 1.4) % 1;
          micRing.setAttribute('r', (16 + pulse * 24).toFixed(1));
          micRing.setAttribute('opacity', ((1 - pulse) * 0.78).toFixed(2));
        } else {
          micRing.setAttribute('opacity', '0');
        }

        // Organic physics nudge if player holds PEPPER still over Noodle without shaking
        if (st.pepperHeld && st.overNoodle && !st.droppedHintFlake && now - st.overSince > 1100) {
          st.droppedHintFlake = true;
          A.play('tap');
          const sx = st.pepperPos.x, sy = st.pepperPos.y + 12;
          const dot = U.svgEl('circle', { cx: sx, cy: sy, r: 2.8, fill: INK }, fx);
          U.tween(380, (k) => {
            dot.setAttribute('cy', U.lerp(sy, ND0.y - 12, k).toFixed(1));
            dot.setAttribute('opacity', (1 - k).toFixed(2));
          }, U.ease.outCubic).then(() => dot.remove());
          ctx.say(I.hasMotion ? 'Just one speck fell out! SHAKE your phone (or wiggle it)!' : 'Just one speck! Wiggle the shaker fast back and forth!');
        }

        // Non-spoiler idle comedy
        if (now - st.lastIdle > 11000) {
          st.lastIdle = now;
          ctx.say(U.pick([
            'Aaaah… nope. Worst feeling on Earth.',
            'Four minutes on the edge of a sneeze.',
            'His nose is begging for closure.',
          ]));
        }
      }
      requestAnimationFrame(loop);
    })(t0);
    svg.addEventListener('pointerdown', () => { st.lastIdle = performance.now(); });

    /* ---------- TAP REACTIONS (no dead taps, no spoilers!) ---------- */
    const taps = {
      async micBtn() {
        ctx.attempt();
        if (I.micActive) {
          I.stopMic();
          micPill.setAttribute('fill', '#fff');
          micTxt.textContent = 'BLOW!';
          A.play('tap');
          ctx.say('Mic paused. You can also scrub or tap the dusty shelf.');
          return;
        }
        A.play('pop');
        const ok = await I.startMic();
        if (!alive() || st.done) return;
        if (ok) {
          micPill.setAttribute('fill', MINT);
          micTxt.textContent = 'BLOWING…';
          ctx.say('Mic is LIVE! Blow hard at the dusty shelf!');
        } else {
          U.replay(micIn, 'wiggle');
          ctx.say('No mic here — just scrub or tap the dusty shelf right above!');
        }
      },
      noodle() {
        ctx.attempt();
        A.play('wobble'); U.replay(ndAnim, 'hop');
        pop(ND0.x, ND0.y - 68, 'Ah… nope!', PINK, 18);
        talk(U.pick(['Aaaah… nope! Lost it!', 'So close! Help me sneeze!']));
        ctx.say('Stuck at 99% sneeze.');
      },
      tissues(node) {
        ctx.attempt();
        A.play('swish'); U.replay(node, 'hop');
        const tis = U.svgEl('path', { d: 'M-11,-6 Q0,-15 11,-6 Q7,5 11,11 Q0,5 -11,11 Q-7,3 -11,-6 Z', fill: '#fff', stroke: INK, 'stroke-width': 2.2 }, fx);
        U.tween(620, (t) => {
          tis.setAttribute('transform', `translate(${(TISSUE0.x + Math.sin(t * 8) * 14).toFixed(1)},${(TISSUE0.y - 22 - t * 66).toFixed(1)}) rotate(${(t * 45).toFixed(0)})`);
          tis.setAttribute('opacity', (1 - t * t).toFixed(2));
        }, U.ease.outCubic).then(() => tis.remove());
        ctx.say('Tissues locked and loaded. Now we just need the sneeze.');
      },
      soup(node) {
        ctx.attempt();
        A.play('pour', 0.25); U.replay(node, 'wiggle');
        ctx.say('Bland chicken soup. Definitely needs seasoning.');
      },
      lamp() {
        ctx.attempt();
        A.play('click');
        st.lampVel = (st.lampVel >= 0 ? -1 : 1) * 14;
        ctx.say('Cozy bulb. Nowhere near as bright as real sunlight.');
      },
      clock(node) {
        ctx.attempt();
        A.play('clink'); U.replay(node, 'wiggle');
        ctx.say('Tick-tock. Four full minutes stuck on “aaah…”');
      },
      table() { ctx.attempt(); A.play('thud'); ctx.say('Solid kitchen table. Zero allergens.'); },
      rug() { ctx.attempt(); A.play('swish'); ctx.say('Freshly vacuumed. Not a speck of dust down here.'); },
      wall() { ctx.attempt(); A.play('tap'); ctx.say('Clean striped wallpaper.'); },
      floor() { ctx.attempt(); A.play('thud'); ctx.say('Warm wooden floorboards.'); },
    };
    I.taps(svg, (name, node) => { if (ctx.locked || st.done) return; if (taps[name]) taps[name](node); });

    const onPromptClick = (e) => {
      if (ctx.locked || st.done) return;
      if (e.target.id === 'pw-sneeze') {
        U.replay(e.target, 'wiggle'); A.play('puff');
        ctx.say('Bless you! Wait — that was just the word.');
      } else {
        A.play('tap');
        ctx.say('He is stuck on the edge of a sneeze!');
      }
    };
    ctx.promptEl.addEventListener('click', onPromptClick);
    ctx.onCleanup(() => ctx.promptEl.removeEventListener('click', onPromptClick));
  }

  BF.levels = BF.levels || {};
  BF.levels[7] = L;
})(window.BF);

</script>
<script>
/* Brainflip — Level 8 (reserved per GDD v0.1): "Shhh! Baby's asleep!"
